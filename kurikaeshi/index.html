<!-- The saved theme, applied before anything paints: a returning dark reader must not see a light
     first frame. Light unless a choice was saved; the device never decides (artifact-theme rule). -->
<script>(function(){var t='light';try{var p=JSON.parse(localStorage.getItem('bw08.prefs.v1')||'{}');if(p&&p.theme==='dark')t='dark';}catch(e){}var r=document.documentElement;r.setAttribute('data-theme',t);r.style.colorScheme=t;})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500&display=swap"></noscript>
<style>
/* DESIGN-0.6 B. Light on bare :root, dark under [data-theme="dark"] only. The app writes the
   attribute itself at boot, so the in-app toggle wins over the system setting both ways; there
   is deliberately no colour-scheme media query anywhere on this page: the device never decides (7.7). */
:root{
  /* ground and surfaces */
  --ground:#F4F5F9; --surface:#FFFFFF; --surface-2:#E9ECF3; --hairline:var(--surface-2);
  /* ink */
  --ink:#171A26; --ink-soft:#454A5E; --ink-mute:#63687E; --ink-off:#A7A8AD;
  /* line — control boundaries only; --hairline for separators that carry no meaning */
  --rule:#7E8499; --rule-off:#CED0D8;
  /* 藍 indigo: text, fill, tint, pressed fill */
  --accent:#2F4A7D; --accent-lo:#DCE3F4; --accent-fill:#2F4A7D; --accent-ink:#FFFFFF; --accent-fill-press:#475F8C;
  --focus:var(--accent);
  /* the four grades: ink, fill, pressed fill */
  --again:#A03A24; --again-lo:#F7E4DF; --again-lo-press:#EDD0C9;
  --hard:#755620;  --hard-lo:#F4EBD8;  --hard-lo-press:#E5D9C2;
  --good:#2F4A7D;  --good-lo:#DCE3F4;  --good-lo-press:#C7D1E6;
  --easy:#3C6244;  --easy-lo:#DEEAE0;  --easy-lo-press:#CBDACD;
  --ok:#2C6B4B; --warn:#755620;
  /* the only two shadows, and the scrim — unchanged */
  --shadow-sheet:0 -2px 6px rgba(23,26,38,.06), 0 -18px 40px -20px rgba(23,26,38,.30);
  --shadow-toast:0 2px 6px rgba(23,26,38,.10), 0 14px 32px -18px rgba(23,26,38,.35);
  --scrim:rgba(23,26,38,.34);
  /* type */
  --f-display:Spectral, Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --f-ja:"Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
  --f-ja-glyph:"Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "BIZ UDMincho", serif;
  --t-glyph:clamp(4rem,24vw,7rem); --t-glyph-long:clamp(2.25rem,11vw,3.25rem);
  --t-display:1.625rem; --t-title:1.125rem; --t-body:1.0625rem; --t-label:.875rem; --t-micro:.75rem;
  --t-ja-reading:1.5rem; --t-ja-sentence:1.25rem;
  --t-specimen:2rem; --t-blank:.85em;
  /* rhythm, radius, size */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --r-control:8px; --r-block:14px; --r-pill:999px;
  --tap:48px; --row:56px; --row-lg:64px; --tab-h:64px; --band-h:92px; --undo-h:48px; --icon:24px; --icon-sm:20px; --fold:2px;
  /* motion — Material 3 tokens, §F */
  --ease-standard:cubic-bezier(0.2, 0, 0, 1);
  --ease-in:cubic-bezier(0.05, 0.7, 0.1, 1);
  --ease-out:cubic-bezier(0.3, 0, 0.8, 0.15);
  --ease-linear:linear;
  --d-short2:100ms; --d-short3:150ms; --d-short4:200ms; --d-medium1:250ms; --d-loop:1000ms;
  /* aliases kept from 0.5/0.6 */
  --paper:var(--ground); --indigo:var(--accent); --indigo-lo:var(--accent-lo); --indigo-ink:var(--accent-ink); --shadow:var(--shadow-sheet);
}
:root[data-theme="dark"]{
  --ground:#101321; --surface:#20253A; --surface-2:#2A3048;
  --ink:#E7E9F1; --ink-soft:#B4B8CB; --ink-mute:#9CA1B8; --ink-off:#6C6F80;
  --rule:#767E9E; --rule-off:#414760;
  --accent:#A6BCE4; --accent-lo:#22304D; --accent-fill:#4F6CB0; --accent-ink:#FFFFFF; --accent-fill-press:#47619F;
  --again:#EFA48C; --again-lo:#3B2219; --again-lo-press:#513227;
  --hard:#E0BB80;  --hard-lo:#352A18;  --hard-lo-press:#4A3B24;
  --good:#A6BCE4;  --good-lo:#22304D;  --good-lo-press:#32415F;
  --easy:#A4C8AA;  --easy-lo:#1F2D22;  --easy-lo-press:#2F4032;
  --ok:#8FC9A6; --warn:#E0BB80;
  --shadow-sheet:0 -2px 6px rgba(0,0,0,.45), 0 -18px 40px -20px rgba(0,0,0,.75);
  --shadow-toast:0 2px 6px rgba(0,0,0,.45), 0 14px 32px -18px rgba(0,0,0,.75);
  --scrim:rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
/* Load-bearing, not boilerplate. .screen sets display:flex, which beats the UA stylesheet's
   display:none for [hidden]; without this rule every screen renders at once, stacked. */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body { background:var(--ground); color:var(--ink); font-family:var(--f-body); font-size:var(--t-body); line-height:1.55; margin:0; -webkit-font-smoothing:antialiased; overflow:hidden; height:100%; }
/* Japanese follows the card's declared language, never a hard-coded class. */
[lang^="ja"]{font-family:var(--f-ja);line-height:1.9}
.r-text[lang^="ja"] rt,.r-cloze[lang^="ja"] rt{font-size:.6em}
.r-text,.r-also,.r-hint,.r-cloze{white-space:pre-line}
.drow.lesson .t[lang^="ja"]{font-size:var(--t-ja-sentence)}
.crow .b[lang^="ja"]{font-size:var(--t-ja-sentence)}
.crow .a[lang^="ja"]{font-size:var(--t-ja-sentence)}   /* 2026-09-12: 20px is the Japanese size and belongs to the Japanese case; a Latin front takes the body size like every other Latin line */
/* A one-line row is not a sentence: the Japanese sentence line-height (1.9) would take a row past its 72px (P08); both halves keep a row line-height. */
.crow .a[lang^="ja"],.crow .b[lang^="ja"]{line-height:1.4}
.crow{min-height:48px;content-visibility:auto;contain-intrinsic-size:auto 64px}   /* a row is a control: never under the 48px floor whatever its lines measure */

:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* 2026-09-12: a screen change moves focus to the destination's heading so it is announced. The heading is not tabbable and not actionable, so the ring the rest of the page gives a control would mark nothing a learner can act on; a cold start painted one around the first screen's title. */
h1[tabindex="-1"]:focus-visible{outline:none}
#tabbar button:focus-visible,.drow:focus-visible,.crow .txt:focus-visible,#sheet button.act:focus-visible,.answer-row:focus-visible{outline-offset:-4px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
a[href]{transition:background-color var(--d-short2) var(--ease-standard)}
a[href]:active{background:var(--surface-2);border-radius:var(--r-control)}

button:disabled{cursor:default}
b,strong{font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ── the frame ─────────────────────────────────────────────────────── */
#app{position:relative;height:100vh;height:100dvh;max-width:30rem;margin:0 auto;overflow:hidden}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--ground)}
.screen.arriving{z-index:1;animation:screen-in var(--d-short3) var(--ease-in) both}
.screen.leaving{z-index:0;animation:screen-out var(--d-short3) var(--ease-out) both;pointer-events:none}
.screen.arriving>.top,.screen.leaving>.top{opacity:1}
@keyframes screen-in{from{opacity:0}to{opacity:1}}
@keyframes screen-out{from{opacity:1}to{opacity:0}}
#app.tabbed .screen.tabbed{bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px))}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 var(--s-6)}
#s-first .scroll,#s-paste .scroll{padding-bottom:calc(var(--s-6) + env(safe-area-inset-bottom,0px))}
.pad{padding-left:var(--s-4);padding-right:var(--s-4)}
.top{display:flex;align-items:center;gap:var(--s-3);flex:none;padding:calc(var(--s-2) + env(safe-area-inset-top,0px)) var(--s-4) var(--s-2);min-height:56px;background:var(--surface);border-bottom:1px solid var(--rule)}
.top h1{font-family:var(--f-display);font-size:var(--t-display);font-weight:600;margin:0;line-height:1.2;flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;text-wrap:balance}
.top h1.long{font-size:var(--t-title);line-height:1.3}
.top .sp{flex:1}
.you{height:48px;min-width:48px;padding:0 var(--s-4);border-radius:var(--r-pill);border:1px solid var(--rule);font-size:var(--t-label);font-weight:500;color:var(--ink-soft);background:var(--surface);flex:none;transition:background-color var(--d-short2) var(--ease-standard)}
.you:active{background:var(--surface-2)}
.back{height:48px;min-width:48px;padding:0 var(--s-2) 0 0;font-size:var(--t-label);font-weight:500;color:var(--accent);flex:none;display:inline-flex;align-items:center;gap:var(--s-1);transition:background-color var(--d-short2) var(--ease-standard)}
.back:active{background:var(--surface-2);border-radius:var(--r-control)}
.back svg{width:var(--icon-sm);height:var(--icon-sm)}

/* type roles (DESIGN-0.6 C): six sizes, no seventh */
.display{font-family:var(--f-display);font-size:var(--t-display);font-weight:600;line-height:1.25;margin:0}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:0!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
.title{font-size:var(--t-title);font-weight:600;line-height:1.35}
.label{font-size:var(--t-label);font-weight:500}
.micro{font-family:var(--f-mono);font-size:var(--t-micro);font-weight:500;letter-spacing:.06em;color:var(--ink-mute);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
p{margin:0 0 var(--s-3)}
.prose{padding:var(--s-4)}
.prose p{max-width:40ch}
.note{font-size:var(--t-label);color:var(--ink-mute);margin:var(--s-2) 0 var(--s-3);line-height:1.5}
.sec{font-size:var(--t-title);font-weight:600;margin:var(--s-5) 0 var(--s-2)}
.prose .sec:first-child{margin-top:0}

/* ── tab bar (E) ───────────────────────────────────────────────────── */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;gap:var(--s-2);padding-left:var(--s-2);padding-right:var(--s-2);background:var(--surface);border-top:1px solid var(--rule);z-index:5}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-1);color:var(--ink-mute);font-size:var(--t-micro);font-weight:500;position:relative;background:none;z-index:0;transition:color var(--d-short3) var(--ease-standard)}
#tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
#tabbar button::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--tab-h);height:var(--tap);border-radius:var(--r-control);background:transparent;z-index:-1;transition:background-color var(--d-short2) var(--ease-standard)}
#tabbar button:active::before{background:var(--surface-2)}
#tabbar button[aria-current="page"]{color:var(--accent)}
#tabbar button[aria-current="page"]::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:var(--s-4);height:var(--fold);background:var(--accent);transition:opacity var(--d-short3) var(--ease-standard)}

/* ── rows, tiles, offers ───────────────────────────────────────────── */
.tile{display:block;width:100%;border-radius:var(--r-block);background:var(--accent-fill);color:var(--accent-ink);padding:var(--s-5);min-height:72px;transition:transform var(--d-short2) var(--ease-standard),background-color var(--d-short2) var(--ease-standard)}
.tile:active{background:var(--accent-fill-press);transform:scale(.98)}
.tile .t1{font-size:var(--t-title);font-weight:600;line-height:1.3}
.tile .fold{display:block;width:16px;height:var(--fold);background:currentColor;opacity:.7;margin:var(--s-2) 0}
.tile .t2{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tile.done{background:var(--surface);color:var(--ink);border:1px solid var(--hairline);cursor:default}
.tile.done:active{transform:none;filter:none}
.tile.done .display{margin-bottom:var(--s-2)}
.tile.done p{margin:0;color:var(--ink-soft);max-width:36ch}
.status{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--ink-mute);padding:var(--s-3) var(--s-4) 0;font-variant-numeric:tabular-nums;line-height:1.5}
.offers{display:flex;flex-direction:column;gap:var(--s-2);padding:var(--s-4)}
.ghost{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);width:100%;min-height:48px;padding:var(--s-2) var(--s-4);border:1px solid var(--rule);border-radius:var(--r-control);background:var(--surface);color:var(--ink-soft);font-size:var(--t-label);font-weight:500;transition:background-color var(--d-short2) var(--ease-standard)}
.ghost:active{background:var(--surface-2)}
.ghost .c{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.ghost:disabled{color:var(--ink-off);border-color:var(--rule-off);opacity:1}
.primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:var(--s-2) var(--s-4);border-radius:var(--r-control);background:var(--accent-fill);color:var(--accent-ink);font-size:var(--t-label);font-weight:600;transition:transform var(--d-short2) var(--ease-standard),background-color var(--d-short2) var(--ease-standard)}
.primary:active{background:var(--accent-fill-press);transform:scale(.98)}
.primary:disabled{background:var(--surface-2);color:var(--ink-off);opacity:1;transform:none}
.danger{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:var(--s-2) var(--s-4);border-radius:var(--r-control);border:1px solid var(--again);color:var(--again);background:var(--surface);font-size:var(--t-label);font-weight:600;transition:background-color var(--d-short2) var(--ease-standard)}
.danger:active{background:var(--again-lo)}
/* 2026-09-12: the label role names a family and a tracking, and this rule was declaring only the size, the weight and the colour — so a text button took whatever face its host had, and the two that sit inside a mono container came out letter-spaced monospace. */
.textbtn{min-height:48px;padding:0 var(--s-4);font-family:var(--f-body);font-size:var(--t-label);font-weight:500;letter-spacing:0;color:var(--accent);display:inline-flex;align-items:center;transition:background-color var(--d-short2) var(--ease-standard)}
.textbtn:active{background:var(--surface-2);border-radius:var(--r-control)}
.stack{display:flex;flex-direction:column;gap:var(--s-2);padding:0 var(--s-4)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.group{display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--hairline,var(--rule));border-bottom:1px solid var(--hairline,var(--rule))}
.group-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);width:100%;min-height:56px;padding:0 var(--s-4);border-bottom:1px solid var(--surface-2);color:var(--ink);font-size:var(--t-body);position:relative;transition:background-color var(--d-short2) var(--ease-standard)}
.group-row:last-child{border-bottom:0}
.group-row:active{background:var(--surface-2)}
.group-row.nav{padding-right:var(--s-7)}
.group-row .chev{position:absolute;right:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--ink-mute)}
.theme-switch{display:block;width:48px;height:32px;flex:none;border:1px solid var(--rule);border-radius:var(--r-pill);background:var(--surface-2);position:relative;transition:background var(--d-short3) var(--ease-standard),border-color var(--d-short3) var(--ease-standard)}
.theme-switch::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:var(--r-pill);background:var(--ink-soft);transform:translateX(0);transition:transform var(--d-short3) var(--ease-standard),background var(--d-short3) var(--ease-standard)}
/* 2026-09-12: scoped to the role, not to .group-row — the card-direction row is class="act direction-row" and was falling through to the base painting, which is the off state, while it was on. */
[role="switch"][aria-checked="true"] .theme-switch{background:var(--accent);border-color:var(--accent)}
[role="switch"][aria-checked="true"] .theme-switch::after{background:var(--accent-ink);transform:translateX(16px)}

.list{display:flex;flex-direction:column;list-style:none;margin:0;padding:0}
.list>li{display:block}
.drow{display:block;width:100%;padding:var(--s-3) var(--s-7) var(--s-3) var(--s-4);min-height:64px;border-bottom:1px solid var(--hairline);transition:background-color var(--d-short2) var(--ease-standard);position:relative}
.drow .chev{position:absolute;right:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--ink-mute)}
.drow:active{background:var(--surface-2)}
.drow .t{font-size:var(--t-title);font-weight:600;line-height:1.35}
.drow .t[lang]{font-size:var(--t-ja-sentence)}   /* nothing Japanese below 20px */
.drow.lesson{padding-left:var(--s-4)}
.drow.lesson .t{font-size:var(--t-body)}
.drow .t[lang]{line-height:1.5}
.bar{display:block;height:4px;border:0;background:var(--surface-2);margin:var(--s-2) 0 var(--s-1);overflow:hidden}
.bar i{display:block;width:100%;height:4px;background:var(--accent);transform-origin:left;transition:transform var(--d-medium1) var(--ease-standard)}
.drow .m{display:block;font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.drow .sub{font-size:var(--t-label);color:var(--ink-mute);font-weight:400}
.crow{display:flex;align-items:center;gap:var(--s-2);min-height:56px;padding:var(--s-2) var(--s-2) var(--s-2) var(--s-4);border-bottom:1px solid var(--hairline)}
.crow .txt{flex:1;min-width:0;text-align:left;transition:background-color var(--d-short2) var(--ease-standard)}
.crow .txt:active{background:var(--surface-2)}
/* 2026-09-12: both halves are blocks. overflow and text-overflow apply to a block container only, so as inline spans a 400-character front painted an 8,000px box, clipped by an ancestor with no ellipsis. Two blocks stack on their own, which is why the row markup no longer carries a <br> between them. */
.crow .a{display:block;font-size:var(--t-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .b{display:block;font-size:var(--t-label);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .more{width:48px;height:48px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-control);color:var(--ink-soft);font-size:var(--t-ja-sentence);letter-spacing:.1em;transition:background-color var(--d-short2) var(--ease-standard)}
.crow .more:active{background:var(--surface-2)}
.crow.retired .a,.crow.retired .b{color:var(--ink-mute)}
.chipr{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;border:1px solid var(--rule);border-radius:var(--r-control);padding:var(--s-1) var(--s-2);color:var(--ink-mute)}
.retired-list{border-top:1px solid var(--rule)}

.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,minmax(0,1fr));grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s-1);margin:var(--s-2) 0 var(--s-4)}   /* one week per column, one weekday per row: 84 days ending today is twelve whole weeks */

/* forms */

button.row{width:100%;text-align:inherit;font:inherit;background:none;border-left:0;border-right:0;border-top:0;transition:background-color var(--d-short2) var(--ease-standard)}
button.row:active{background:var(--surface-2)}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-soft)} .row .v{font-family:var(--f-mono);font-size:var(--t-label);font-variant-numeric:tabular-nums;text-align:right}
.rows.plain .v{text-align:left;font-family:inherit;font-size:var(--t-body);flex:1}

.bigcode{font-family:var(--f-mono);font-size:var(--t-specimen);letter-spacing:.25em;text-align:center;padding:var(--s-3);border:1px dashed var(--rule);border-radius:var(--r-control);margin:var(--s-2) 0;user-select:all;-webkit-user-select:all}

.say:active{background:var(--surface-2);opacity:.7}
.say[aria-pressed="true"]{color:var(--accent)}

.cardwrap{flex:1;display:grid;grid-template-rows:1fr auto 1fr;padding:var(--s-2) var(--s-4);text-align:center;min-height:0}
.qst{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:var(--s-2);min-height:0;overflow-y:auto;padding-bottom:var(--s-3)}
.qst > :first-child{margin-top:auto}
#r-card .fold{width:var(--s-7);height:var(--fold);margin:0 auto;background:var(--rule)}
#r-card.revealed .fold{background:var(--rule)}
.ans{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:var(--s-1);min-height:0;overflow-y:auto;padding-top:var(--s-3)}
.tag{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--ink-mute);font-variant-numeric:tabular-nums}

.ans > .r-headline + *,
.ans > .r-glyph + *,
.ans > .r-cloze + *,
.ans > .r-say-line + *,
.ans > .meaning-toggle + *,
.ans > .chips,

.chip b[lang^="ja"]{font-family:var(--f-ja);font-size:var(--t-label);letter-spacing:0}
.leech{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--again);border:1px solid var(--again);padding:var(--s-1) var(--s-2);border-radius:var(--r-control)}
.r-hint{font-size:var(--t-body);color:var(--ink-mute);font-style:italic;max-width:30ch}
.hintbtn{min-height:48px;padding:0 var(--s-4);border:1px solid var(--rule);border-radius:var(--r-control);font-size:var(--t-label);font-weight:500;color:var(--ink-soft);background:var(--surface);transition:background-color var(--d-short2) var(--ease-standard)}
.hintbtn:active{background:var(--surface-2)}
.meaning-toggle{display:flex;align-items:center;justify-content:center;min-width:var(--tap);min-height:var(--tap);padding:var(--s-3) var(--s-4);border:1px solid var(--rule);border-radius:var(--r-control);background:var(--surface);color:var(--accent);font-size:var(--t-label);font-weight:600;transition:background-color var(--d-short2) var(--ease-standard)}

.english-choices{border:1px solid var(--rule);border-radius:var(--r-control);overflow:hidden;background:var(--surface);margin:var(--s-2) 0 var(--s-3)}
.english-choice{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap);padding:var(--s-2) var(--s-3);border-bottom:1px solid var(--surface-2);cursor:pointer}
.english-choice:last-child{border-bottom:0}

.r-cloze{font-family:var(--f-display);font-size:var(--t-title);line-height:1.6;max-width:30ch}

ruby{ruby-position:over;ruby-align:center}
rt{font-size:.5em;line-height:1.1;font-weight:400;color:var(--ink-soft);letter-spacing:.02em;-webkit-text-fill-color:currentColor}
ruby[data-reading="hidden"] rt{visibility:hidden}
.reveal-in{animation:rise var(--d-short3) var(--ease-in) both}

.grades.grades-in{animation:grades-in var(--d-short3) var(--ease-in) both}
@keyframes grades-in{from{opacity:0}to{opacity:1}}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bandwrap{flex:none;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.band{min-height:var(--band-h);padding:var(--s-3) var(--s-4) var(--s-2);display:flex;align-items:stretch}
.reveal{display:flex;align-items:center;justify-content:center;flex:1;min-height:var(--row);padding:0 var(--s-4);border-radius:var(--r-control);background:var(--accent-fill);color:var(--accent-ink);font-weight:600;font-size:var(--t-label);transition:transform var(--d-short2) var(--ease-standard),background-color var(--d-short2) var(--ease-standard)}
.reveal:active{background:var(--accent-fill-press);transform:scale(.98)}

.grade{min-height:var(--row);border-radius:var(--r-control);border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-1);transition:transform var(--d-short2) var(--ease-standard),background-color var(--d-short2) var(--ease-standard)}

.grade[data-g="1"]{background:var(--again-lo);border-color:var(--again);border-left-width:4px} .grade[data-g="1"] .g{color:var(--again)}
.grade[data-g="1"]:active{background:var(--again-lo-press)}
.grade[data-g="2"]{background:var(--hard-lo);border-color:var(--hard)}   .grade[data-g="2"] .g{color:var(--hard)}
.grade[data-g="2"]:active{background:var(--hard-lo-press)}
.grade[data-g="3"]{background:var(--good-lo);border-color:var(--good)}   .grade[data-g="3"] .g{color:var(--good)}
.grade[data-g="3"]:active{background:var(--good-lo-press)}
.grade[data-g="4"]{background:var(--easy-lo);border-color:var(--easy);border-right-width:4px} .grade[data-g="4"] .g{color:var(--easy)}
.grade[data-g="4"]:active{background:var(--easy-lo-press)}
.undo{display:flex;justify-content:center;width:100%;min-height:48px;align-items:center;font-size:var(--t-label);font-weight:500;color:var(--accent);transition:background-color var(--d-short2) var(--ease-standard)}
.undo:active{background:var(--surface-2);border-radius:var(--r-control)}
.undo:disabled{color:var(--ink-off);opacity:1}

/* ── end of session, first open, landing ───────────────────────────── */
.centre{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;text-align:left;padding:var(--s-6) var(--s-4) calc(var(--s-6) + env(safe-area-inset-bottom,0px));gap:var(--s-5);overflow-y:auto}
/* 2026-09-12: .rows carries overflow:hidden, so inside a column flex its content-based minimum is 0 and it alone absorbs every pixel of negative free space — the three end-of-session figures were squashed to a hairline. Children hold their content height; .centre already scrolls. */
.centre>*{margin-top:0;margin-bottom:0;flex-shrink:0}
.centre .rows{width:100%;max-width:22rem;text-align:left}
.centre .offers,.centre .stack{width:100%;max-width:22rem;padding:0}

.offercard.dismissing{opacity:0;pointer-events:none}

.offercard .textbtn{padding-left:0}

.prose>.textbtn,.centre>.textbtn{padding-left:0}
#fo-body{display:flex;flex-direction:column}
.first{padding:var(--s-6) var(--s-4) var(--s-6);display:flex;flex:1;min-height:100%;flex-direction:column}   /* the bottom inset is #s-first .scroll's (P22, the style check asserts it); carried here too it counted twice */
.first .display{margin-bottom:var(--s-3)}
.first .answers{margin-top:auto;padding:0}
.progressline{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--ink-mute);padding:var(--s-3) var(--s-4);font-variant-numeric:tabular-nums;min-height:42px}

/* ── sheet and toast (the only two shadows) ────────────────────────── */

#scrim.open{opacity:1}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);border-radius:var(--r-block) var(--r-block) 0 0;box-shadow:var(--shadow-sheet);padding:var(--s-2) 0 calc(var(--s-2) + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform var(--d-medium1) var(--ease-in);z-index:9;max-height:50%;overflow-y:auto;touch-action:pan-y}
#sheet::before{content:"";display:block;width:32px;height:4px;margin:var(--s-2) auto 0;border-radius:var(--r-pill);background:var(--rule)}
#sheet.open{transform:none}
#sheet.dragging{transition:none}
#sheet.returning{transition:transform var(--d-short3) var(--ease-standard)}
#sheet.closing{transition:transform var(--d-short4) var(--ease-out)}
#sheet .sh-title{padding:var(--s-2) var(--s-4) var(--s-1);font-size:var(--t-label);font-weight:500;color:var(--ink-mute)}
#sheet .sh-title.confirm{font-size:var(--t-body);color:var(--ink);padding:var(--s-3) var(--s-4)}
/* A card's own two sides on its details sheet, drawn by the review renderer at a size a half-height sheet can hold. */
#sheet .sh-card{display:flex;flex-direction:column;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-4) var(--s-3);text-align:center;border-bottom:1px solid var(--hairline)}
#sheet .sh-card .sh-front,#sheet .sh-card .sh-back{display:flex;flex-direction:column;align-items:center;gap:var(--s-1);width:100%;min-width:0}
#sheet .sh-card .sh-back{padding-top:var(--s-2);border-top:1px solid var(--hairline)}
#sheet .sh-card .r-glyph{font-size:var(--t-glyph-long);line-height:1.2}
#sheet .sh-card .r-glyph.long{font-size:var(--t-specimen)}
#sheet .sh-card .r-headline{font-size:var(--t-title)}
#sheet .sh-card .r-headline[lang]{font-size:var(--t-ja-sentence)}
#sheet div.act.static{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);width:100%;min-height:56px;padding:0 var(--s-4);font-size:var(--t-body);color:var(--ink);border-bottom:1px solid var(--hairline)}
#sheet button.act{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);width:100%;min-height:56px;padding:0 var(--s-4);font-size:var(--t-body);font-weight:400;color:var(--ink);transition:background-color var(--d-short2) var(--ease-standard)}
#sheet button.act.stick{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--hairline)}
#sheet button.act:active{background:var(--surface-2)}
#sheet button.act:disabled{color:var(--ink-off)}
#sheet button.act .c{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--ink-mute);font-variant-numeric:tabular-nums}
#sheet button.act.warnact{color:var(--again)}
#sheet button.act.nav{border-top:1px solid var(--hairline);margin-top:var(--s-2)}
#sheet button.act.direction-row{min-height:72px;padding-top:var(--s-2);padding-bottom:var(--s-2);align-items:center}
#sheet button.act.direction-row .direction-copy{display:flex;flex:1;min-width:0;flex-direction:column;align-items:flex-start;line-height:1.35}
#sheet button.act.direction-row .direction-name{font-size:var(--t-body)}
#sheet button.act.direction-row .direction-name [lang]{font-size:var(--t-ja-sentence)}   /* nothing Japanese below 20px */
#sheet button.act.direction-row .direction-detail{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--ink-mute)}
#sheet button.act.direction-row .direction-count{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.04em;color:var(--ink-mute);white-space:normal}
#sheet button.act.direction-row:disabled .theme-switch{border-color:var(--rule-off)}
#sheet button.act.direction-row:disabled .direction-name,#sheet button.act.direction-row:disabled .direction-detail,#sheet button.act.direction-row:disabled .direction-count{color:var(--ink-off)}

#app{--toast-gap:var(--s-4)}
#app.tabbed{--toast-gap:calc(var(--tab-h) + var(--s-4))}
#app.review{--toast-gap:calc(var(--band-h) + var(--undo-h) + 1px + var(--s-4))}
#toast{position:absolute;left:16px;right:16px;bottom:calc(var(--toast-gap) + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-control);box-shadow:var(--shadow-toast);padding:0 var(--s-4);min-height:48px;display:flex;align-items:center;gap:var(--s-3);font-size:var(--t-label);font-weight:500;z-index:10;opacity:0;transform:translateY(8px);transition:opacity var(--d-short4) var(--ease-in),transform var(--d-short4) var(--ease-in)}
#toast.in{opacity:1;transform:none}
/* The region stays in the page for assistive technology (P12); while it is not showing it takes no tap — it sits over a sheet's bottom rows. */
#toast:not(.in){pointer-events:none}
#toast.out{transition:opacity var(--d-short3) var(--ease-out);opacity:0}
#toast span{flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere}
#toast-dismiss{flex:none;min-width:48px;min-height:48px;font-size:var(--t-title);color:var(--ink-soft)}
#toast button{min-height:48px;padding:0 var(--s-2);color:var(--accent);font-weight:600;transition:background-color var(--d-short2) var(--ease-standard)}
#toast button:active{background:var(--surface-2);border-radius:var(--r-control)}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ── class view (kept) ─────────────────────────────────────────────── */
.cv-table{width:100%;border-collapse:collapse;font-size:var(--t-label);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-control);overflow:hidden}
.cv-table th{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--ink-mute);text-align:left;padding:var(--s-2);border-bottom:1px solid var(--hairline);background:var(--surface-2)}
.cv-table td{padding:var(--s-2);border-bottom:1px solid var(--hairline);vertical-align:top}
.cv-table tr:last-child td{border-bottom:0}
.cv-table td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cv-table td.bad{color:var(--again);font-weight:600}
.cv-table td.warn{color:var(--warn)}
.cv-wrap{overflow-x:auto;margin:var(--s-2) 0 var(--s-4)}
.cv-table tr.grp td{font-weight:600;background:var(--surface-2)}
.cv-table th br+*{font-weight:400}
.cv-items td:first-child{white-space:nowrap}
.bkt{display:inline-flex;height:10px;overflow:hidden;width:100%;background:var(--surface-2);border:1px solid var(--hairline)}
.bkt i{display:block;height:100%}
.bkt .b0{background:var(--again)} .bkt .b1{background:var(--hard)} .bkt .b2{background:var(--accent)} .bkt .b3{background:var(--easy)}
.legend{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--ink-mute);margin:var(--s-1) 0 var(--s-3)}
.legend i{display:inline-block;width:.7rem;height:.7rem;vertical-align:-1px;margin:0 var(--s-1) 0 var(--s-3);border:1px solid var(--hairline)}

/* Reduced motion is a replacement, not a removal (F): travel goes, a 100ms fade stays. */
@media (prefers-reduced-motion: reduce){
  /* DESIGN-0.6 §F, line by line: rises, scales and cross-fades drop; opacity keeps its own durations */
  .reveal-in,.grades-in,.card-in{animation:fadein var(--d-short2) var(--ease-linear) both!important;transform:none!important}   /* answer reveal: opacity only, 100ms */
  #sheet{opacity:0;transition:opacity var(--d-short2) var(--ease-linear)!important;transform:none!important} /* sheet opens and closes: 100ms opacity in place — the base has no opacity to move, so it is given one here */
  #sheet.open{opacity:1} #sheet.closing{opacity:0;transition:opacity var(--d-short2) var(--ease-linear)!important}
  #scrim{transition:opacity var(--d-short2) var(--ease-linear)!important}                                    /* the scrim still fades */
  .screen.leaving,.screen.arriving{animation:none!important;opacity:1!important}
  .sprog i,.bar i{transition:none!important} /* progress updates in place without animated travel */
  #toast{transition:opacity var(--d-short4) var(--ease-linear)!important;transform:none!important}           /* toast in 200ms, opacity only */
  #toast.out{transition:opacity var(--d-short3) var(--ease-linear)!important}                                /* toast out 150ms */
  /* the fill step stays — every control on J.4 §5's list, not a subset */
  .tile,.primary,.ghost,.danger,.textbtn,.back,.you,.drow,.crow .txt,.crow .more,.answer-row,
  .grade,.reveal,.undo,.hintbtn,.say,.more,#tabbar button::before,#sheet button.act,
  #toast button,.group-row,.filter,button.row,.exportbox .dl,label.chk,.retired-list summary,a[href]{transition:background-color var(--d-short2) var(--ease-standard)!important}
  .tile:active,.grade:active,.reveal:active,.primary:active{transform:none!important;filter:none!important}
  .busy::after{animation-play-state:paused!important;transform:translateX(0)!important}
  html{scroll-behavior:auto!important}
}

@media (forced-colors:active){.tile,.primary,.reveal,.hintbtn,.danger{border:1px solid ButtonText}
#tabbar button[aria-current="page"]{text-decoration:underline}
#tabbar button[aria-current="page"]::after,.sprog i,.bar i{background:Highlight;forced-color-adjust:none}}


</style>
</head>

        if (!entries.length || dayKey(entries[entries.length - 1].t) < key) continue;
        let prev = 'new';
        for (const e of entries) {
          const sameDay = dayKey(e.t) === key;
          const crossesDay = e.k === KINDS.relearn && entries.some((x) => x.t < e.t && dayKey(x.t) !== key);
          if (sameDay && !counted.has(e.c) && (e.k === KINDS.review || crossesDay)) {
            counted.add(e.c);
            used++;
          }
          prev = e.g === 1 ? (prev === 'review' || prev === 'relearning' ? 'relearning' : 'learning') : (e.i >= 1 ? 'review' : (prev === 'review' || prev === 'relearning' ? 'relearning' : 'learning'));
        }
      }
      return used;
    },

    intakeBudget(now = Date.now()) {
      const before = dayStart(dayKey(now));
      const secondsPerCard = this.measuredSecondsPerCard(before);
      const ratio = this.measuredReviewsPerNewCard(before);
      const seconds = prefs.minutesPerDay * 60;
      const perDay = Math.max(1, Math.round(seconds / (secondsPerCard.value * ratio.value)));
      
      return { perDay, secondsPerCard, ratio, own: secondsPerCard.measured };
    },

    measuredSecondsPerCard(before = Infinity) {
      const times = log.filter((e) => e.t < before).map((e) => e.e).filter((v) => typeof v === 'number' && v > 500 && v < 120000);
      if (times.length < 30) return { value: 10, measured: false, n: times.length };
      times.sort((a, b) => a - b);
      return { value: times[Math.floor(times.length / 2)] / 1000, measured: true, n: times.length };
    },

    measuredReviewsPerNewCard(before = Infinity) {

      const past = before === Infinity ? log : log.filter((e) => e.t < before);
      const introduced = new Set(past.filter((e) => e.k === KINDS.learn).map((e) => e.c)).size;
      if (introduced < 20 || past.length < 100) return { value: 10, measured: false, n: introduced };
      return { value: Math.max(1, past.length / introduced), measured: true, n: introduced };
    },

    trueRetention() {

      let seen = 0, kept = 0;
      for (const entries of byCard.values()) {
        let prev = 'new', previousReviewDay = null;
        for (const e of entries) {
          if (prev === 'review') {
            const key = dayKey(e.t);
            if (key !== previousReviewDay) { seen++; if (e.g > 1) kept++; }
            previousReviewDay = key;
          }
          prev = e.g === 1 ? 'relearning' : (e.i >= 1 ? 'review' : 'learning');
        }
      }
      return { seen, kept, rate: seen ? kept / seen : null };
    },

    exportAll(extra = {}) {

      return JSON.stringify({ format: 'bw08-review-log', version: 1, exported: new Date().toISOString(), ...extra, prefs, suspended: [...suspended], retired: [...retired], log });
    },

    importAll(text, options = {}) {
      const parsed = JSON.parse(text);
      if (parsed.format !== 'bw08-review-log' || !Array.isArray(parsed.log)) throw new Error('not a progress export from this app');

      const finiteOrNull = (v) => v === null || Number.isFinite(v);

      const nonNegOrNull = (v) => v === null || (Number.isFinite(v) && v >= 0);
      const valid = (e) => e && typeof e.c === 'string' && /^[^#\s]+#\d+$/.test(e.c)
        && Number.isFinite(e.t) && e.t > 0 && Number.isInteger(e.g) && e.g >= 1 && e.g <= 4
        && nonNegOrNull(e.s) && nonNegOrNull(e.d)
        && Number.isFinite(e.i) && e.i >= 0 && e.i <= 36500 && Number.isFinite(e.u) && e.u > 0;
      const accepted = parsed.log.filter(valid);
      const rejected = parsed.log.length - accepted.length;
      if (rejected && !options.lenient) throw new Error(`${rejected} ${rejected === 1 ? 'review' : 'reviews'} in the file could not be read, so nothing was imported.`);

      const key = (e) => `${e.c}|${e.t}`;
      const have = new Set(log.map(key));
      const nextLog = log.slice();
      let added = 0;
      for (const e of accepted) if (!have.has(key(e))) { nextLog.push(e); have.add(key(e)); added++; }
      nextLog.sort((a, b) => a.t - b.t);
      const importedRetired = Array.isArray(parsed.retired) ? parsed.retired.filter((id) => typeof id === 'string') : [];
      const nextRetired = new Set([...retired, ...importedRetired]);
      const importedSuspended = Array.isArray(parsed.suspended) ? parsed.suspended.filter((id) => typeof id === 'string') : [];
      const nextSuspended = new Set([...suspended, ...importedSuspended, ...nextRetired]);
      
      const CLAMP = { minutesPerDay: [5, 90], maxReviewsPerDay: [1, 9999], desiredRetention: [0.8, 0.97], learnAheadMinutes: [0, 120], leechThreshold: [1, 99], maximumInterval: [1, 36500] };
      const BOOL = ['newCardsIgnoreReviewLimit', 'burySiblings', 'signInOffered', 'keyboardShortcuts', 'autoplay'];
      const SHORT = ['english', 'readings', 'leechAction'];   
      const filePrefs = parsed.prefs && typeof parsed.prefs === 'object' && !Array.isArray(parsed.prefs) ? parsed.prefs : null;
      const cleanPrefs = {};
      let prefsDropped = 0, prefsClamped = 0;
      const directionsOk = (v) => v && typeof v === 'object' && !Array.isArray(v) && Object.entries(v).every(([pid, types]) => /^[a-z0-9][a-z0-9-]{0,63}$/.test(pid) && types && typeof types === 'object' && !Array.isArray(types) && Object.values(types).every((ords) => Array.isArray(ords) && ords.every((o) => Number.isInteger(o) && o >= 0 && o < 16)));
      if (filePrefs) for (const [k, v] of Object.entries(filePrefs)) {
        if (CLAMP[k]) { if (typeof v === 'number' && Number.isFinite(v)) { const c = Math.min(CLAMP[k][1], Math.max(CLAMP[k][0], v)); cleanPrefs[k] = c; if (c !== v) prefsClamped++; } else prefsDropped++; }
        else if (BOOL.includes(k)) { if (typeof v === 'boolean') cleanPrefs[k] = v; else prefsDropped++; }
        else if (SHORT.includes(k)) { if (typeof v === 'string' && v.length <= 20 && /^[a-z-]*$/.test(v)) cleanPrefs[k] = v; else prefsDropped++; }
        else if (k === 'theme') { if (v === null || v === 'light' || v === 'dark') cleanPrefs[k] = v; else prefsDropped++; }
        else if (k === 'cardDirections') { if (directionsOk(v)) cleanPrefs[k] = v; else prefsDropped++; }
        else prefsDropped++;
      }
      const nextPrefs = filePrefs ? { ...prefs, ...cleanPrefs } : prefs;

      const priorOr = (key, fallback) => { const held = adapter.get(key); return held === null || held === undefined ? fallback : held; };
      const prior = { prefs: priorOr(PREFS_KEY, JSON.stringify(prefs)), retired: priorOr(RETIRED_KEY, JSON.stringify([...retired])), suspended: priorOr(SUSPENDED_KEY, JSON.stringify([...suspended])), log: priorOr(LOG_KEY, JSON.stringify(log)) };
      const written = [];
      const restore = (name, storageKey) => {
        const ok = adapter.set(storageKey, prior[name]);
        if (!ok) return false;
        return adapter.get(storageKey) === prior[name];
      };
      const failImport = (subject) => {
        const kept = [];
        for (let i = written.length - 1; i >= 0; i--) if (!restore(written[i].name, written[i].key)) kept.unshift(written[i].label);
        if (kept.includes(IMPORT_RECORDS[3])) prefs = nextPrefs;
        if (kept.includes(IMPORT_RECORDS[2])) retired = nextRetired;
        if (kept.includes(IMPORT_RECORDS[1])) suspended = nextSuspended;
        if (kept.includes(IMPORT_RECORDS[0])) { log = nextLog; index(); }
        const named = kept.join(' and ');
        const state = kept.length ? `${named.charAt(0).toUpperCase()}${named.slice(1)} were saved before the failure and could not be restored.` : 'Nothing was imported.';
        throw new Error(`The ${subject} could not be saved. ${state} Free some storage and try again.`);
      };
      if (options.prefs !== false) {
        if (!adapter.set(PREFS_KEY, JSON.stringify(nextPrefs))) failImport(IMPORT_RECORDS[3]);
        written.push({ name: 'prefs', key: PREFS_KEY, label: IMPORT_RECORDS[3] });
      }
      if (!persistRetired(nextRetired)) failImport(IMPORT_RECORDS[2]);
      written.push({ name: 'retired', key: RETIRED_KEY, label: IMPORT_RECORDS[2] });
      if (!persistSuspended(nextSuspended)) failImport(IMPORT_RECORDS[1]);
      written.push({ name: 'suspended', key: SUSPENDED_KEY, label: IMPORT_RECORDS[1] });
      if (!persist(nextLog)) failImport(IMPORT_RECORDS[0]);
      written.push({ name: 'log', key: LOG_KEY, label: IMPORT_RECORDS[0] });
      log = nextLog;
      retired = nextRetired;
      suspended = nextSuspended;
      if (options.prefs !== false) prefs = nextPrefs;
      index();
      return { added, total: log.length, rejected, logCount: parsed.log.length, suspended: importedSuspended.length, retired: importedRetired.length, prefs: filePrefs ? cleanPrefs : null, prefsDropped, prefsClamped };
    },

    suspend(ids) {
      const next = new Set(suspended);
      for (const id of ids) next.add(id);
      if (!persistSuspended(next)) return false;
      suspended = next;
      return true;
    },
    unsuspend(ids) {
      const next = new Set(suspended);
      for (const id of ids) next.delete(id);
      if (!persistSuspended(next)) return false;
      suspended = next;
      return true;
    },
    isSuspended(id) { return suspended.has(id); },
    retire(ids) {
      const nextRetired = new Set(retired);
      const nextSuspended = new Set(suspended);
      for (const id of ids) { nextRetired.add(id); nextSuspended.add(id); }
      const oldRetired = JSON.stringify([...retired]);
      if (!persistRetired(nextRetired)) return false;
      if (!persistSuspended(nextSuspended)) {

        if (!adapter.set(RETIRED_KEY, oldRetired)) { retired = nextRetired; return 'partial'; }
        return false;
      }
      retired = nextRetired;
      suspended = nextSuspended;
      return true;
    },
    unretire(ids) {
      const nextRetired = new Set(retired);
      const nextSuspended = new Set(suspended);
      for (const id of ids) { nextRetired.delete(id); nextSuspended.delete(id); }
      const oldRetired = JSON.stringify([...retired]);
      if (!persistRetired(nextRetired)) return false;
      if (!persistSuspended(nextSuspended)) {

        if (!adapter.set(RETIRED_KEY, oldRetired)) { retired = nextRetired; return 'partial'; }
        return false;
      }
      retired = nextRetired;
      suspended = nextSuspended;
      return true;
    },
    isRetired(id) { return retired.has(id); },
    retired() { return new Set(retired); },

    skipToday(id, now = Date.now()) {
      const next = { ...skipped, [id]: addDays(dayKey(now), 1) };
      if (!persistSkipped(next)) return false;
      skipped = next;
      return true;
    },
    unskip(id) {
      if (!(id in skipped)) return true;
      const next = { ...skipped }; delete next[id];
      if (!persistSkipped(next)) return false;
      skipped = next;
      return true;
    },
    isSkippedToday(id, now = Date.now()) {
      const until = skipped[id];
      return until != null && dayKey(now) < until;
    },
    get suspendedCount() { return suspended.size; },
    get retiredCount() { return retired.size; },

    reset() {
      const oldLog = log, oldSuspended = suspended, oldPreview = readPreview(adapter);
      if (!persist([])) return false;
      if (!persistSuspended(new Set())) {
        if (!persist(oldLog)) { log = []; index(); lastOwnKey = null; return 'partial'; }
        return false;
      }
      if (!adapter.set(PREVIEW_KEY, JSON.stringify([]))) {
        const logRestored = persist(oldLog);
        const suspendedRestored = persistSuspended(oldSuspended);
        const previewRestored = adapter.set(PREVIEW_KEY, JSON.stringify(oldPreview));
        if (!logRestored || !suspendedRestored || !previewRestored) {
          if (!logRestored) log = [];
          if (!suspendedRestored) suspended = new Set();
          index();
          lastOwnKey = null;
          return 'partial';
        }
        return false;
      }
      log = [];
      suspended = new Set();
      byCard.clear(); statesCache = null;
      lastOwnKey = null;
      return true;
    },
    eraseBefore(ms) {
      const point = Number(ms);
      if (!Number.isFinite(point)) return false;
      const oldLog = log, oldPreview = readPreview(adapter);
      const nextLog = log.filter((entry) => Number(entry.t) >= point);
      const nextPreview = oldPreview.filter((entry) => Number(entry.t) >= point);
      if (nextLog.length === oldLog.length && nextPreview.length === oldPreview.length) return true;
      if (!persist(nextLog)) return false;
      if (!adapter.set(PREVIEW_KEY, JSON.stringify(nextPreview))) {
        const logRestored = persist(oldLog);
        const previewRestored = adapter.set(PREVIEW_KEY, JSON.stringify(oldPreview));
        if (!logRestored || !previewRestored) {
          if (!logRestored) { log = nextLog; index(); }
          lastOwnKey = null;
          return 'partial';
        }
        return false;
      }
      log = nextLog;
      index();
      lastOwnKey = null;
      return true;
    },

    resetReviews() {
      const oldLog = log, oldPreview = readPreview(adapter);
      if (!persist([])) return false;
      if (!adapter.set(PREVIEW_KEY, JSON.stringify([]))) {
        const logRestored = persist(oldLog);
        const previewRestored = adapter.set(PREVIEW_KEY, JSON.stringify(oldPreview));
        if (!logRestored || !previewRestored) {
          if (!logRestored) { log = []; index(); }
          lastOwnKey = null;
          return 'partial';
        }
        return false;
      }
      log = [];
      byCard.clear(); statesCache = null;
      lastOwnKey = null;
      return true;
    },
    get log() { return log; },
    KINDS,
    dayKey,
    dayStart,
    addDays,
  };
}



const FORMAT = 'kurikaeshi-pack';

const FORMAT_LEGACY = 'kanji-queue-pack';
const FORMAT_VERSION = 1;
const PACKS_KEY = 'bw08.packs.v1';

const ID_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
const SEMVER_RE = /^\d+\.\d+\.\d+$/;

const DISPLAY_ROLES = ['glyph', 'headline', 'text', 'also', 'chip', 'meta', 'hint', 'hidden', 'image'];
const IMAGE_VALUE_MAX = 32 * 1024;   
const IMAGE_PACK_MAX = 1024 * 1024;   
const TEXT_PACK_MAX = 4 * 1024 * 1024;   
const FIELD_VALUE_MAX = 64 * 1024;       

const JAPANESE_CHAR_RE = /[\u3005\u3040-\u309f\u30a0-\u30ff\u3400-\u9fff]/;
const SPACE_RE = /\s/;

function bracketTouchesJapanese(chars, index) {
  let left = index - 1, right = index + 1;
  while (left >= 0 && SPACE_RE.test(chars[left])) left--;
  while (right < chars.length && SPACE_RE.test(chars[right])) right++;
  return (left >= 0 && JAPANESE_CHAR_RE.test(chars[left])) ||
    (right < chars.length && JAPANESE_CHAR_RE.test(chars[right]));
}

function offendingBrackets(chars) {
  const out = new Set();
  const stack = [];
  for (let i = 0; i < chars.length; i++) {
    if (chars[i] === '(') stack.push(i);
    else if (chars[i] === ')') {
      const open = stack.pop();
      const hit = bracketTouchesJapanese(chars, i) || (open != null && bracketTouchesJapanese(chars, open));
      if (hit) { out.add(i); if (open != null) out.add(open); }
    }
  }
  for (const open of stack) if (bracketTouchesJapanese(chars, open)) out.add(open);   
  return out;
}

function asciiBracketsInJapanese(text) {
  const chars = [...String(text == null ? '' : text)];
  return [...offendingBrackets(chars)].sort((a, b) => a - b);
}

function japaneseBrackets(text) {
  const chars = [...String(text == null ? '' : text)];
  const bad = offendingBrackets(chars);
  return chars.map((char, index) => (bad.has(index) ? (char === '(' ? '（' : '）') : char)).join('');
}

function validatePack(p) {
  const bad = (m, code = 'not-a-pack') => { const error = new Error(`not a usable pack: ${m}`); error.code = code; throw error; };
  if (!p || typeof p !== 'object') bad('not an object');
  if (p.format !== FORMAT && p.format !== FORMAT_LEGACY) bad(`format is "${p.format}", expected "${FORMAT}"`);
  if (!Number.isInteger(p.formatVersion) || p.formatVersion > FORMAT_VERSION) bad(`formatVersion ${p.formatVersion} is newer than this app understands (${FORMAT_VERSION})`, 'newer-format');
  if (typeof p.id !== 'string' || !ID_RE.test(p.id)) bad('id must be lowercase letters, digits and hyphens');
  if (typeof p.version !== 'string' || !SEMVER_RE.test(p.version)) bad('version must be semver like 1.2.0');
  if (typeof p.title !== 'string' || !p.title.trim()) bad('title is required');
  if (!Array.isArray(p.noteTypes) || !p.noteTypes.length) bad('noteTypes must be a non-empty array');
  if (!Array.isArray(p.notes) || !p.notes.length) bad('notes must be a non-empty array');
  const types = new Map();
  for (const t of p.noteTypes) {
    if (!t || typeof t.id !== 'string' || !Array.isArray(t.fields) || !Array.isArray(t.templates) || !t.templates.length) bad(`noteType "${t && t.id}" needs id, fields[], templates[]`);
    for (let i = 0; i < t.templates.length; i++) {
      const tp = t.templates[i];
      if (!Number.isInteger(tp.ord) || typeof tp.prompt !== 'string' || typeof tp.answer !== 'string') bad(`template in "${t.id}" needs ord, prompt, answer`);
      if (tp.ord !== i) bad(`template ords in "${t.id}" must count from 0 in order`);
      if (!t.fields.includes(tp.prompt) || !t.fields.includes(tp.answer)) bad(`template ${tp.ord} in "${t.id}" names a field the type does not have`);
    }

    if (t.kind != null && t.kind !== 'cloze') bad(`noteType "${t.id}" has unknown kind "${t.kind}"`);
    if (t.display != null) {
      if (typeof t.display !== 'object') bad(`display in "${t.id}" must be an object of field → role`);
      for (const [f, role] of Object.entries(t.display)) {
        if (!t.fields.includes(f)) bad(`display in "${t.id}" names unknown field "${f}"`);
        if (!DISPLAY_ROLES.includes(role)) bad(`display role "${role}" for "${f}" is not one of ${DISPLAY_ROLES.join(', ')}`);
      }
    }
    if (t.labels != null) {
      if (typeof t.labels !== 'object') bad(`labels in "${t.id}" must be an object of field → label`);
      for (const f of Object.keys(t.labels)) if (!t.fields.includes(f)) bad(`labels in "${t.id}" names unknown field "${f}"`);
    }
    types.set(t.id, t);
  }
  const guids = new Set();

  const imageFields = new Map();
  for (const [id, t] of types) imageFields.set(id, Object.entries(t.display || {}).filter(([, role]) => role === 'image').map(([f]) => f));
  let carriesImage = false;
  for (const n of p.notes) {
    if (!n || typeof n.guid !== 'string' || !n.guid || /[\s#/]/.test(n.guid)) bad('every note needs a guid without spaces, "#" or "/"');
    if (guids.has(n.guid)) bad(`duplicate guid ${n.guid}`);
    guids.add(n.guid);
    if (!types.has(n.type)) bad(`note ${n.guid} has unknown type "${n.type}"`);
    if (!n.fields || typeof n.fields !== 'object') bad(`note ${n.guid} has no fields`);
    
    const type = types.get(n.type);
    for (const tp of type.templates) {
      for (const f of [tp.prompt, tp.answer]) {
        const v = n.fields[f];
        if (typeof v !== 'string' || !v.trim()) bad(`note ${n.guid} has no "${f}"`, 'blank-card');
      }
    }
    if (type.kind === 'cloze' && !clozeOrds(String(n.fields[type.templates[0].prompt] || '')).length) bad(`note ${n.guid} is a fill-in-the-blank card with no blank in "${type.templates[0].prompt}"`, 'blank-card');
    for (const f of Object.keys(n.fields)) {
      const v = n.fields[f];
      if (typeof v === 'string' && v.length > FIELD_VALUE_MAX) bad(`note ${n.guid}: "${f}" is ${v.length} characters; a field is at most ${FIELD_VALUE_MAX}`, 'too-big');
    }
    for (const f of imageFields.get(n.type) || []) {
      const v = n.fields[f];
      if (v == null || v === '') continue;
      carriesImage = true;
      if (typeof v !== 'string' || !/^(data:image\/(jpeg|png|webp|gif|svg\+xml);base64,|https:\/\/)/.test(v)) bad(`note ${n.guid}: "${f}" is an image field and must be a data:image/… URI or an https: URL`);
      if (v.length > IMAGE_VALUE_MAX) bad(`note ${n.guid}: "${f}" is ${v.length} characters; an image value is at most ${IMAGE_VALUE_MAX} until the store moves (PACK-FORMAT.md)`);
    }
  }

  if (p.retired != null) {
    if (!Array.isArray(p.retired)) bad('retired must be an array');
    for (const r of p.retired) {
      if (!r || typeof r !== 'object' || typeof r.guid !== 'string' || !r.guid) bad('every retired card needs a guid');
      if (!r.fields || typeof r.fields !== 'object') bad(`retired card ${r.guid} has no fields`);
    }
  }
  const serialised = JSON.stringify(p).length;
  if (carriesImage && serialised > IMAGE_PACK_MAX) bad(`a pack carrying images is at most ${IMAGE_PACK_MAX} characters serialised until the store moves (PACK-FORMAT.md)`, 'too-big');
  if (serialised > TEXT_PACK_MAX) bad(`a pack is at most ${TEXT_PACK_MAX} characters serialised`, 'too-big');
  if (p.milestones) {
    if (!Array.isArray(p.milestones)) bad('milestones must be an array');
    for (const m of p.milestones) if (!m || typeof m.id !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(m.due || '')) bad('every milestone needs an id and an ISO due date');
  }
  return true;
}

function repairRetired(pack) {
  if (!pack || !Array.isArray(pack.retired) || !pack.retired.length) return { pack, repaired: 0 };
  const firstField = (typeId) => {
    const t = (pack.noteTypes || []).find((x) => x && x.id === typeId);
    return t && Array.isArray(t.fields) && t.fields.length ? t.fields[0] : '';
  };
  let repaired = 0;
  const rows = [];
  for (const row of pack.retired) {

    if (!row || typeof row !== 'object' || typeof row.guid !== 'string' || !row.guid) { repaired++; continue; }
    if (row.fields && typeof row.fields === 'object') { rows.push(row); continue; }
    repaired++;
    const first = firstField(row.type);
    const key = String(row.key == null ? '' : row.key);
    rows.push({ ...row, fields: first && key ? { [first]: key } : {} });
  }
  return repaired ? { pack: { ...pack, retired: rows }, repaired } : { pack, repaired: 0 };
}

function compareVersions(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) < (pb[i] || 0) ? -1 : 1; }
  return 0;
}

function catalogInstallState(pageRow, installedRow) {
  const pageVersion = pageRow && pageRow.version;
  if (typeof pageVersion !== 'string' || !pageVersion) return 'installed';
  if (!installedRow) return 'install';
  const installedVersion = installedRow.version;
  if (typeof installedVersion !== 'string' || !installedVersion) return 'installed';
  return compareVersions(pageVersion, installedVersion) > 0 ? 'update' : 'installed';
}

const cardId = (packId, guid, ord) => `${packId}/${guid}#${ord}`;

const CLOZE_RE = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
function clozeOrds(text) {
  const ords = new Set();
  for (const m of String(text || '').matchAll(CLOZE_RE)) ords.add(parseInt(m[1], 10));
  return [...ords].sort((a, b) => a - b);
}

function clozeSegments(text) {
  const out = [];
  let last = 0;
  const s = String(text || '');
  for (const m of s.matchAll(CLOZE_RE)) {
    if (m.index > last) out.push({ text: s.slice(last, m.index) });
    out.push({ text: m[2], cloze: parseInt(m[1], 10), hint: m[3] || '' });
    last = m.index + m[0].length;
  }
  if (last < s.length) out.push({ text: s.slice(last) });
  return out;
}

function clozeFilled(text) { return String(text || '').replace(CLOZE_RE, '$2'); }

function deriveCards(pack) {
  const byType = new Map(pack.noteTypes.map((t) => [t.id, t]));
  const cards = [];
  for (const n of pack.notes) {
    const t = byType.get(n.type);
    if (t.kind === 'cloze') {

      for (const ord of clozeOrds(n.fields[t.templates[0].prompt])) {
        cards.push({ id: cardId(pack.id, n.guid, ord), pack: pack.id, guid: n.guid, ord,
                     lesson: n.lesson || '', deck: `${pack.id}::${n.lesson || '—'}::${n.type}` });
      }
      continue;
    }
    for (const tp of t.templates) {
      cards.push({ id: cardId(pack.id, n.guid, tp.ord), pack: pack.id, guid: n.guid, ord: tp.ord,
                   lesson: n.lesson || '', deck: `${pack.id}::${n.lesson || '—'}::${n.type}` });
    }
  }
  return cards;
}

function lessonKeys(pack) {
  const keys = new Set();
  for (const n of pack.notes || []) keys.add(n.lesson || '');
  return [...keys].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
}

function initialOptions(pack, meta) {
  const keys = lessonKeys(pack);
  if (keys.length < 2) return {};
  if (meta.lessons === 'none') return { lessonsOut: keys };
  if (meta.lessons === 'first') return { lessonsOut: keys.slice(1) };
  return {};
}

function directionCardIds(pack, typeId, ord) {
  const type = (pack.noteTypes || []).find((item) => item.id === typeId);
  if (!type || type.kind === 'cloze') return [];
  const live = new Set((pack.notes || []).filter((item) => item.type === typeId).map((item) => item.guid));
  return deriveCards(pack).filter((card) => card.ord === ord && live.has(card.guid)).map((card) => card.id);
}

function planUpdate(installed, candidate) {
  validatePack(candidate);
  if (!installed) return { apply: true, reason: 'install', changed: 0, added: candidate.notes.length, removed: 0, suspend: [], unsuspend: deriveCards(candidate).map((c) => c.id) };
  if (installed.id !== candidate.id) return { apply: false, reason: 'different pack id — installs beside, does not replace', changed: 0, added: 0, removed: 0, suspend: [], unsuspend: [] };
  if (compareVersions(candidate.version, installed.version) <= 0) return { apply: false, reason: `installed ${installed.version} is not older than ${candidate.version}`, changed: 0, added: 0, removed: 0, suspend: [], unsuspend: [] };

  const oldCards = new Set(deriveCards(installed).map((c) => c.id));
  const newCards = new Set(deriveCards(candidate).map((c) => c.id));
  const oldNotes = new Map(installed.notes.map((n) => [n.guid, n]));
  let changed = 0, added = 0, removed = 0;
  for (const n of candidate.notes) {
    const o = oldNotes.get(n.guid);
    if (!o) { added++; continue; }
    if (JSON.stringify(o.fields) !== JSON.stringify(n.fields) || o.type !== n.type) changed++;
  }
  const newGuids = new Set(candidate.notes.map((n) => n.guid));
  for (const g of oldNotes.keys()) if (!newGuids.has(g)) removed++;

  const suspend = [...oldCards].filter((id) => !newCards.has(id));
  const unsuspend = [...newCards].filter((id) => !oldCards.has(id));
  return { apply: true, reason: 'update', changed, added, removed, suspend, unsuspend };
}

function makePackStore(adapter) {
  let state = { installed: [], data: {} };
  const persist = (next = state) => adapter.set(PACKS_KEY, JSON.stringify(next));

  return {

    repaired: 0,
    repairSaved: true,

    load() {
      try { const raw = adapter.get(PACKS_KEY); if (raw) state = JSON.parse(raw); } catch { state = { installed: [], data: {} }; }
      if (!state || !Array.isArray(state.installed) || typeof state.data !== 'object') state = { installed: [], data: {} };

      let repaired = 0;
      const data = {};
      for (const id of Object.keys(state.data || {})) {
        const fix = repairRetired(state.data[id]);
        repaired += fix.repaired;
        data[id] = fix.pack;
      }
      this.repaired = repaired;
      if (!repaired) { this.repairSaved = true; return; }
      state = { ...state, data };
      this.repairSaved = !!persist(state);
    },
    list() { return state.installed.map((row) => ({ ...row, options: { ...(row.options || {}) } })); },
    get(id) { return state.data[id] || null; },
    has(id) { return !!state.data[id]; },

    install(pack, meta = {}) {

      const current = this.get(pack.id);
      const plan = planUpdate(meta.replace && current ? { ...current, version: '0.0.0' } : current, pack);
      if (!plan.apply) return plan;
      const now = meta.now || Date.now();
      const next = { installed: state.installed.map((r) => ({ ...r })), data: { ...state.data } };
      const row = next.installed.find((r) => r.id === pack.id);
      const carry = row ? carryLessonChoice(current, pack, row.options) : null;   
      const entry = { id: pack.id, version: pack.version, title: pack.title, url: pack.url || meta.url || null,
                      installedAt: row ? row.installedAt : now, updatedAt: now, language: pack.language || null,
                      options: row ? carry.options : initialOptions(pack, meta) };
      if (row) Object.assign(row, entry); else next.installed.push(entry);
      next.data[pack.id] = pack;
      if (!persist(next)) return { ...plan, ok: false, apply: false, msg: 'This device could not save the deck. Export my progress, under You then Settings, keeps a copy; then free some storage and try again.' };
      state = next;
      return { ...plan, ok: true, lessonsAdded: carry ? carry.added.length : 0 };
    },

    setOptions(id, patch) {
      const next = { installed: state.installed.map((r) => ({ ...r, options: { ...(r.options || {}) } })), data: { ...state.data } };
      const row = next.installed.find((r) => r.id === id);
      if (!row) return { ok: false, msg: 'This deck is not installed.' };
      for (const [key, value] of Object.entries(patch || {})) {
        if (value == null) delete row.options[key]; else row.options[key] = value;
      }
      if (!persist(next)) return { ok: false, msg: 'This device could not save the deck options. Free some storage and try again.' };
      state = next;
      return { ok: true, msg: 'Deck options saved.' };
    },

    remove(id) {
      const next = { installed: state.installed.filter((r) => r.id !== id), data: { ...state.data } };
      delete next.data[id];
      if (!persist(next)) return false;
      state = next;
      return true;
    },

    deck() { return deckFrom(state.installed.map((r) => state.data[r.id])); },
  };
}

function deckFrom(packs) {
  const notes = [], cards = [], noteTypes = {}, out = {};
  for (const p of packs) {
    if (!p) continue;
    out[p.id] = p;
    for (const t of p.noteTypes) noteTypes[`${p.id}/${t.id}`] = t;
    for (const n of p.notes) notes.push({ ...n, pack: p.id, packGuid: `${p.id}/${n.guid}` });
    for (const c of deriveCards(p)) cards.push(c);
  }
  return { notes, cards, noteTypes, packs: out };
}


function carryLessonChoice(oldPack, newPack, options) {
  const o = { ...(options || {}) };
  if (!Array.isArray(o.lessonsOut)) return { options: o, added: [] };
  const before = new Set(lessonKeys(oldPack || { notes: [] }));
  const added = lessonKeys(newPack).filter((k) => !before.has(k));
  const out = o.lessonsOut.map((k) => String(k == null ? '' : k));
  o.lessonsOut = out.concat(added.filter((k) => !out.includes(k)));
  return { options: o, added };
}


const SOON_DAYS = 3;

function owedRepeat(st, store, now = Date.now()) {
  return !!st && st.state === 'review' && st.reps === 1 && !!st.last && st.last.k === 0
    && (st.last.g === 2 || st.last.g === 3) && store.dayKey(st.last.t) === store.dayKey(now);
}

function sittingWork(cards, store, opts = {}) {
  const schedules = opts.schedules !== false;
  const seen = new Set(); let showings = 0;
  for (const c of cards) {
    if (!c) continue;
    const id = c.id || c;
    if (seen.has(id)) continue;
    seen.add(id);
    const st = store.state(id);
    showings += 1 + (schedules && (!st || st.state === 'new') ? 1 : 0);
  }
  return { cards: seen.size, showings };
}
function buildQueue(deck, store, opts = {}) {
  const now = opts.now ?? Date.now();
  const lesson = opts.lesson ?? null;
  const pack = opts.pack ?? null;
  const p = store.prefs;

  const ctx = opts.ctx || {};
  const states = ctx.states || store.allStates();
  const today = ctx.today || store.countsToday(now);
  const budget = ctx.budget || store.intakeBudget(now);

  const deckOptions = opts.deckOptions || {};
  const optionsFor = (id) => deckOptions[id] || {};
  const isPaused = (id) => !!optionsFor(id).paused;

  const outOf = (id) => { const list = optionsFor(id).lessonsOut; return Array.isArray(list) && list.length ? new Set(list.map((k) => String(k == null ? '' : k))) : null; };
  const outSets = {};
  const inRotation = (c) => {
    if (lesson != null) return true;
    if (!(c.pack in outSets)) outSets[c.pack] = outOf(c.pack);
    return !outSets[c.pack] || !outSets[c.pack].has(String(c.lesson == null ? '' : c.lesson));
  };

  const isSuspended = typeof store.isSuspended === 'function' ? (id) => store.isSuspended(id) : () => false;

  const isSkipped = typeof store.isSkippedToday === 'function' ? (id) => store.isSkippedToday(id, now) : () => false;

  const pool = deck.cards.filter((c) =>
    (!pack || c.pack === pack) && (lesson == null || c.lesson === lesson) && !isSuspended(c.id) && !isSkipped(c.id) && !isPaused(c.pack));

  const used = ctx.reviewsUsed != null ? ctx.reviewsUsed
    : (typeof store.reviewLimitUsed === 'function' ? store.reviewLimitUsed(store.dayKey(now)) : today.reviews);
  let reviewsLeft = Math.max(0, p.maxReviewsPerDay - used);
  let newLeft = Math.max(0, budget.perDay - today.newCards);

  const allowanceLeft = newLeft;

  if (!p.newCardsIgnoreReviewLimit && reviewsLeft <= 0) newLeft = 0;
  if (opts.ahead) { newLeft = opts.ahead; reviewsLeft = 0; }
  const DAY = 86400e3;
  const horizon = opts.aheadDays
    ? store.dayStart(store.addDays(store.dayKey(now), opts.aheadDays + 1)) - 1
    : now;
  if (opts.aheadDays) { reviewsLeft = Number.MAX_SAFE_INTEGER; newLeft = 0; }
  let soon = 0;   

  const cardsAnsweredToday = new Set();
  if (p.burySiblings) {

    const k = store.dayKey(now), dayStartMs = store.dayStart(k);
    for (let i = store.log.length - 1; i >= 0; i--) {
      const e = store.log[i];
      if (e.t < dayStartMs) break;
      if (store.dayKey(e.t) === k) cardsAnsweredToday.add(e.c);
    }
  }

  const noteKey = (c) => `${c.pack || ''}/${c.guid}`;
  const siblingsOf = new Map();
  for (const c of deck.cards) {
    const k = noteKey(c);
    let a = siblingsOf.get(k); if (!a) { a = []; siblingsOf.set(k, a); } a.push(c.id);
  }
  const unburied = (c) => !p.burySiblings ||
    !(siblingsOf.get(noteKey(c)) || []).some((id) => id !== c.id && cardsAnsweredToday.has(id));

  const due = [], learn = [], learnInter = [], fresh = [], laterToday = [], owed = [];
  const todayK = store.dayKey(now);
  const dayEnd = store.dayStart(store.addDays(todayK, 1)) - 1;
  const soonEnd = store.dayStart(store.addDays(todayK, SOON_DAYS + 1)) - 1;   
  const todayStartMs = store.dayStart(todayK);
  let outOfRotation = 0;   
  for (const c of pool) {
    const s = states.get(c.id) || { state: 'new' };
    if (s.state === 'new') { if (inRotation(c)) fresh.push(c); else outOfRotation++; continue; }
    if (s.due != null && s.due > now && s.due <= soonEnd) soon++;

    if (owedRepeat(s, store, now)) { owed.push(c); continue; }
    if (s.due == null || s.due > horizon) { if (s.due != null && s.due <= dayEnd) laterToday.push(c); continue; }
    if (s.state === 'review') due.push({ c, due: s.due });
    else (s.last && store.dayKey(s.last.t) === todayK ? learn : learnInter).push({ c, due: s.due });
  }

  const lastAnswer = store.log.length ? store.log[store.log.length - 1].t : null;
  const gapDays = lastAnswer == null ? 0 : Math.max(0, Math.round((store.dayStart(todayK) - store.dayStart(store.dayKey(lastAnswer))) / DAY));
  const backlog = due.filter((x) => x.due < todayStartMs).length + learnInter.filter((x) => x.due < todayStartMs).length;
  const allowance = Math.max(0, p.maxReviewsPerDay - used);
  const intakePaused = !opts.ahead && gapDays >= 3 && backlog > allowance;
  if (intakePaused) newLeft = 0;
  const learnAheadMs = (p.learnAheadMinutes ?? 20) * 60000;
  if (!due.length && !learn.length && !learnInter.length && !owed.length && Math.min(fresh.length, newLeft) === 0) {
    for (const c of pool) {
      const s = states.get(c.id);
      if (!s || s.state === 'new' || s.state === 'review') continue;
      if (s.due != null && s.due > now && s.due <= now + learnAheadMs) learn.push({ c, due: s.due });
    }
  }
  due.sort((a, b) => a.due - b.due);
  learn.sort((a, b) => a.due - b.due);
  
  const learningLater = laterToday.filter((c) => !learn.some((x) => x.c === c)).length;

  const seenNote = new Set();
  const oncePerNote = (c) => { const k = noteKey(c); if (seenNote.has(k)) return false; seenNote.add(k); return true; };

  owed.forEach((c) => seenNote.add(noteKey(c)));

  learnInter.sort((a, b) => a.due - b.due);

  let buried = 0, sameNote = 0;
  const unburiedCounted = (c) => { const ok = unburied(c); if (!ok) buried++; return ok; };
  const oncePerNoteCounted = (c) => { const ok = oncePerNote(c); if (!ok) sameNote++; return ok; };

  const learnQ = learn.map((x) => x.c).filter(unburiedCounted).filter(oncePerNoteCounted);
  const cappable = learnInter.map((x) => x.c).concat(due.map((x) => x.c))
    .filter(unburiedCounted).filter(oncePerNoteCounted);
  const overCap = Math.max(0, cappable.length - reviewsLeft);
  const capped = cappable.slice(0, reviewsLeft);

  if (!p.newCardsIgnoreReviewLimit && !opts.ahead) newLeft = Math.min(newLeft, Math.max(0, reviewsLeft - capped.length));
  const dueQ = owed.concat(learnQ, capped);

  const perPackUsed = (today.perPack || {});
  const perPackLeft = {};
  const underPackCap = (c) => {
    const cap = optionsFor(c.pack).newPerDay;
    if (opts.ahead || !Number.isFinite(cap)) return true;
    if (!(c.pack in perPackLeft)) perPackLeft[c.pack] = Math.max(0, cap - ((perPackUsed[c.pack] || {}).newCards || 0));
    if (perPackLeft[c.pack] <= 0) return false;
    perPackLeft[c.pack]--;
    return true;
  };
  const freshQ = fresh.filter(unburied).filter(oncePerNote).filter(underPackCap).slice(0, newLeft);

  const out = [];
  const gap = freshQ.length ? Math.max(1, Math.floor(dueQ.length / freshQ.length)) : 0;
  let di = 0, ni = 0;
  while (di < dueQ.length || ni < freshQ.length) {
    for (let i = 0; i < gap && di < dueQ.length; i++) out.push(dueQ[di++]);
    if (ni < freshQ.length) out.push(freshQ[ni++]);
    if (!gap) while (di < dueQ.length) out.push(dueQ[di++]);
  }

  const newHeldByLimit = newLeft === 0 && allowanceLeft > 0 && !intakePaused
    && !opts.ahead && !opts.aheadDays && !p.newCardsIgnoreReviewLimit;

  const newCutByLimit = newLeft < allowanceLeft && !intakePaused
    && !opts.ahead && !opts.aheadDays && !p.newCardsIgnoreReviewLimit;

  return {
    queue: out,
    newLeft, reviewsLeft, budget, gapDays, backlog, intakePaused, newHeldByLimit, newCutByLimit,

    counts: { fresh: fresh.length, newToday: freshQ.length, toStudyToday: out.length, due: due.length, learn: learn.length + learnInter.length + owed.length, soon, learningLater, buried, overCap, sameNote, outOfRotation },
  };
}

function forecast(deck, store, days, now = Date.now(), ctx = {}, deckOptions = {}) {
  const states = ctx.states || store.allStates();   
  const out = Array.from({ length: days }, () => 0);
  const first = store.dayKey(now);
  const keys = Array.from({ length: days }, (_, i) => store.addDays(first, i));
  const isSuspended = typeof store.isSuspended === 'function' ? (id) => store.isSuspended(id) : () => false;
  const isPaused = (id) => !!((deckOptions[id] || {}).paused);
  for (const c of deck.cards) {
    if (isSuspended(c.id) || isPaused(c.pack)) continue;
    const st = states.get(c.id);
    if (!st || st.state === 'new' || st.due == null) continue;
    let index = keys.indexOf(store.dayKey(st.due));
    if (index < 0 && st.due < store.dayStart(first)) index = 0;
    if (index >= 0 && index < days) out[index]++;
  }
  return out;
}

const RETIRED_CLOZE_RE = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
function retiredNoteOrds(type, note) {
  if (type.kind !== 'cloze') return (type.templates || []).map((form) => form.ord);
  const prompt = type.templates && type.templates[0] ? type.templates[0].prompt : null;
  const ords = new Set();
  for (const m of String((note.fields || {})[prompt] || '').matchAll(RETIRED_CLOZE_RE)) ords.add(parseInt(m[1], 10));
  return [...ords].sort((a, b) => a - b);
}

function lessonProgress(deck, store, opts = {}) {
  const states = (opts.ctx && opts.ctx.states) || store.allStates();
  const isSuspended = typeof store.isSuspended === 'function' ? (id) => store.isSuspended(id) : () => false;
  const isRetired = typeof store.isRetired === 'function' ? (id) => store.isRetired(id) : () => false;
  const choices = opts.cardDirections || {};
  const directionOff = new Set();
  for (const c of deck.cards) {
    const packChoices = choices[c.pack] || {};
    const active = packChoices[String(c.deck || '').split('::').pop()];   
    if (Array.isArray(active) && !active.includes(c.ord)) directionOff.add(c.id);
  }
  const retiredNotes = new Set();
  for (const [id, pack] of Object.entries(deck.packs || {})) for (const note of pack.retired || []) retiredNotes.add(`${id}/${note.guid}`);
  const listed = new Set();
  const rows = new Map();
  const rowFor = (pack, lesson) => {
    const key = `${pack}|${lesson}`;
    let r = rows.get(key);
    if (!r) { r = { pack, lesson, total: 0, fresh: 0, learning: 0, review: 0, suspended: 0, retired: 0, directionOff: 0, heldOut: 0 }; rows.set(key, r); }
    return r;
  };
  for (const c of deck.cards) {
    listed.add(c.id);
    const r = rowFor(c.pack, c.lesson);
    if (isRetired(c.id) || retiredNotes.has(`${c.pack}/${c.guid}`)) { r.suspended++; r.retired++; continue; }
    if (isSuspended(c.id)) {
      r.suspended++;
      if (directionOff.has(c.id)) r.directionOff++; else r.heldOut++;
      continue;
    }
    r.total++;
    const s = states.get(c.id);
    if (!s || s.state === 'new') r.fresh++;
    else if (s.state === 'review') r.review++;
    else r.learning++;
  }
  for (const [id, pack] of Object.entries(deck.packs || {})) {
    const types = new Map((pack.noteTypes || []).map((item) => [item.id, item]));
    for (const note of pack.retired || []) {
      const type = types.get(note.type);
      if (!type) continue;
      for (const ord of retiredNoteOrds(type, note)) {
        const cardId = `${id}/${note.guid}#${ord}`;
        if (listed.has(cardId)) continue;
        listed.add(cardId);
        const r = rowFor(id, note.lesson || '');
        r.suspended++; r.retired++;
      }
    }
  }
  return [...rows.values()].sort((a, b) =>
    a.pack.localeCompare(b.pack) || a.lesson.localeCompare(b.lesson, undefined, { numeric: true }));
}

function intakeFloor(deck, store, now = Date.now(), packId = null, ctx = {}) {
  const states = ctx.states || store.allStates();
  const isSuspended = typeof store.isSuspended === 'function' ? (id) => store.isSuspended(id) : () => false;
  const today = new Date(store.dayKey(now));
  let binding = null;
  for (const [id, pack] of Object.entries(deck.packs || {})) {
    if (packId && id !== packId) continue;
    for (const m of pack.milestones || []) {
      const due = new Date(m.due);
      const daysLeft = Math.round((due - today) / 86400e3);
      if (daysLeft < 0) continue;
      const covered = deck.cards.filter((c) => c.pack === pack.id && (m.lessons || []).includes(c.lesson) && !isSuspended(c.id));
      const unseen = covered.filter((c) => { const s = states.get(c.id); return !s || s.state === 'new'; }).length;
      const floor = daysLeft === 0 ? unseen : Math.ceil(unseen / daysLeft);
      const row = { pack: pack.id, packTitle: pack.title, milestone: m, daysLeft, covered: covered.length, unseen, floor };
      if (!binding || row.floor > binding.floor) binding = row;
    }
  }
  return binding;
}

function pruneUnseenNew(queue, store, pack, lesson) {
  const key = String(lesson == null ? '' : lesson);
  const kept = [];
  let removed = 0;
  for (const c of queue) {
    const ofLesson = c && c.pack === pack && String(c.lesson == null ? '' : c.lesson) === key;
    if (ofLesson && store.state(c.id).state === 'new') removed++; else kept.push(c);
  }
