  return { queue: kept, removed };
}



const CAVEAT =
  'Reported by each student’s own device, from a file they chose to hand you. Treat it as you ' +
  'would a submitted worksheet: evidence of what was done, not proof. Nothing here detects ' +
  'dishonesty and nothing here is a grade.';

const mem = () => { const m = new Map(); return { get: (k) => (m.has(k) ? m.get(k) : null), set: (k, v) => { m.set(k, v); return true; } }; };
const DAY = 86400e3;

function readExport(text, label) {
  const parsed = typeof text === 'string' ? JSON.parse(text) : text;
  if (!parsed || parsed.format !== 'bw08-review-log' || !Array.isArray(parsed.log)) throw new Error('not a progress export from this app');
  const store = makeStore(mem()); store.load();
  const res = store.importAll(JSON.stringify(parsed));   
  return { label: label || 'export', store, log: store.log, packs: Array.isArray(parsed.packs) ? parsed.packs : [], exported: parsed.exported || null, entries: res.total };
}

const PACK_ID_SHAPE = /^[a-z0-9][a-z0-9-]{0,63}$/;   
function packsFromEntries(entries) {
  const latest = new Map();
  for (const e of entries || []) {
    if (!e || !e.v) continue;
    const id = String(e.c).split('/')[0];
    if (!PACK_ID_SHAPE.test(id)) continue;
    const cur = latest.get(id);
    if (!cur || e.t > cur.t) latest.set(id, { t: e.t, version: String(e.v) });
  }
  return [...latest].map(([id, x]) => ({ id, version: x.version })).sort((a, b) => a.id.localeCompare(b.id));
}

function summarizeClass(exports, deck, opts = {}) {
  const now = opts.now ?? Date.now();
  const leechThreshold = opts.leechThreshold ?? 8;
  const dayKey = (ms) => exports[0] ? exports[0].store.dayKey(ms) : new Date(ms).toISOString().slice(0, 10);
  const todayKey = dayKey(now);
  const sevenAgo = now - 7 * DAY;

  const students = exports.map((ex, i) => {
    const log = ex.log;
    const days = new Set(), days7 = new Set();
    let reviews7 = 0, ms = 0, first = null, last = null;
    const introduced = new Set();
    for (const e of log) {
      const k = dayKey(e.t); days.add(k);
      if (e.t >= sevenAgo) { reviews7++; days7.add(k); }
      ms += e.e || 0;
      if (e.k === 0) introduced.add(e.c);
      if (first == null || e.t < first) first = e.t;
      if (last == null || e.t > last) last = e.t;
    }
    return {
      index: i, label: ex.label,
      reviews: log.length, reviews7d: reviews7, daysActive: days.size, daysActive7d: days7.size,
      cardsIntroduced: introduced.size, minutes: Math.round(ms / 60000),

      firstActiveOn: first == null ? null : dayKey(first), lastActiveOn: last == null ? null : dayKey(last),
      stoppedDays: last == null ? null : Math.max(0, Math.round((new Date(todayKey) - new Date(dayKey(last))) / DAY)),
      packs: ex.packs,
    };
  });

  const byCard = new Map(deck.cards.map((c) => [c.id, c]));
  const noteOf = new Map(deck.notes.map((n) => [`${n.pack}/${n.guid}`, n]));

  const referenced = new Set();
  for (const ex of exports) {
    for (const p of ex.packs || []) if (p && p.id) referenced.add(p.id);
    for (const e of ex.log || []) { const s = String(e.c), i = s.indexOf('/'); if (i > 0) referenced.add(s.slice(0, i)); }
  }
  const missingPacks = [...referenced].filter((id) => !(deck.packs && deck.packs[id]));
  let unmatchedReviews = 0;
  const acc = new Map(); 
  for (const ex of exports) {
    const states = ex.store.allStates();
    
    const firstGrade = new Map();
    for (const e of [...ex.log].sort((a, b) => a.t - b.t)) if (!firstGrade.has(e.c)) firstGrade.set(e.c, e.g);
    for (const [cardId, st] of states) {
      if (st.reps === 0) continue;
      if (!byCard.has(cardId)) { unmatchedReviews += st.reps; continue; }
      let a = acc.get(cardId);
      if (!a) { a = { seen: 0, firstAgain: 0, reviews: 0, lapses: [], leeches: 0 }; acc.set(cardId, a); }
      a.seen++; a.reviews += st.reps; a.lapses.push(st.lapses);
      if (firstGrade.get(cardId) === 1) a.firstAgain++;
      if (st.lapses >= leechThreshold) a.leeches++;
    }
  }
  const items = [...acc.entries()].map(([cardId, a]) => {
    const c = byCard.get(cardId), n = noteOf.get(`${c.pack}/${c.guid}`) || { fields: {} };
    return {
      cardId, pack: c.pack, guid: c.guid, ord: c.ord, lesson: c.lesson, fields: n.fields, type: n.type,
      nStudents: a.seen, nReviews: a.reviews,
      firstAgainRate: a.seen ? a.firstAgain / a.seen : 0,
      meanLapses: a.lapses.reduce((s, x) => s + x, 0) / a.lapses.length,
      pctLeech: a.seen ? a.leeches / a.seen : 0,
    };
  });

  items.sort((x, y) => (y.firstAgainRate - x.firstAgainRate) || (y.meanLapses - x.meanLapses) || (y.nStudents - x.nStudents));

  const lessons = new Map();
  for (const c of deck.cards) {
    const k = `${c.pack}|${c.lesson}`;
    let L = lessons.get(k); if (!L) { L = { pack: c.pack, lesson: c.lesson, cards: 0, ids: [] }; lessons.set(k, L); }
    L.cards++; L.ids.push(c.id);
  }
  const coverage = [...lessons.values()].map((L) => {
    const perStudent = exports.map((ex) => {
      const states = ex.store.allStates();
      const seen = L.ids.filter((id) => { const s = states.get(id); return s && s.reps > 0; }).length;
      return L.cards ? seen / L.cards : 0;
    });
    const buckets = { none: 0, some: 0, most: 0, all: 0 };
    for (const f of perStudent) { if (f === 0) buckets.none++; else if (f < 0.5) buckets.some++; else if (f < 1) buckets.most++; else buckets.all++; }
    return { pack: L.pack, lesson: L.lesson, cards: L.cards, students: exports.length, buckets, perStudent };
  }).sort((a, b) => a.pack.localeCompare(b.pack) || a.lesson.localeCompare(b.lesson, undefined, { numeric: true }));

  const versions = Object.create(null);
  let unmatchedPacks = 0;
  for (const ex of exports) for (const p of ex.packs || []) {
    if (!p || typeof p.id !== 'string' || !PACK_ID_SHAPE.test(p.id) || typeof p.version !== 'string' || p.version.length > 40) { unmatchedPacks++; continue; }
    versions[p.id] = versions[p.id] || Object.create(null);
    versions[p.id][p.version] = (versions[p.id][p.version] || 0) + 1;
  }

  return { generatedAt: now, students: students.length, caveat: CAVEAT, studentsList: students, items, coverage, versions, missingPacks, unmatchedReviews, unmatchedPacks };
}


const SYNC_KEY = 'bw08.sync.v1';
const clientId = (e) => `${e.c}|${e.t}`;

const rowToEntry = (r) => ({ c: r.card, t: Number(r.t), g: r.g, k: r.k, s: r.s, d: r.d, i: r.i, u: r.u == null ? null : Number(r.u), e: r.e, ...(r.v ? { v: String(r.v) } : {}) });

const runOwnPush = (state) => {
  if (state.running) return state.running;
  if (!state.queued.size) return Promise.resolve(0);
  state.running = (async () => {
    let sent = 0;
    while (state.queued.size) {
      const id = state.queued.keys().next().value;
      const pack = state.queued.get(id);
      const waiters = state.waiters.get(id) || [];
      state.queued.delete(id);
      state.waiters.delete(id);
      try {
        await state.transport.upsert('user_packs', [{ pack_id: pack.id, version: pack.version, pack, updated_at: new Date().toISOString() }], 'user_id,pack_id');
        if (state.onSent) state.onSent();
        for (const waiter of waiters) waiter.resolve(1);
        sent++;
      } catch (error) {
        for (const waiter of waiters) waiter.reject(error);
        throw error;
      }
    }
    return sent;
  })().finally(() => { state.running = null; });
  return state.running;
};

const queueOwnPush = (state, pack) => {
  state.queued.set(pack.id, pack);
  if (state.timer) clearTimeout(state.timer);
  const promise = new Promise((resolve, reject) => {
    const waiters = state.waiters.get(pack.id) || [];
    waiters.push({ resolve, reject });
    state.waiters.set(pack.id, waiters);
  });
  state.timer = setTimeout(() => {
    state.timer = null;
    runOwnPush(state).catch(() => {});
  }, state.delay);
  return promise;
};

const flushOwnPush = (state) => {
  if (state.timer) { clearTimeout(state.timer); state.timer = null; }
  return runOwnPush(state);
};

const PULL_OVERLAP_MS = 60000;   

function makeSync(store, transport, opts = {}) {
  const batch = opts.batch || 500;
  const pageSize = opts.pullLimit || 500;
  const adapter = opts.adapter || { get: () => null, set: () => true };
  let st = { mark: null, above: [], below: [], cursor: null, packCursor: null, erasedSeen: 0 };   
  let compareNextPush = false;   
  const ownPush = { transport, delay: opts.packDebounce == null ? 2000 : opts.packDebounce, queued: new Map(), waiters: new Map(), timer: null, running: null, onSent: null };
  try { const raw = adapter.get(SYNC_KEY); if (raw) st = { ...st, ...JSON.parse(raw) }; } catch (e) {  }

  let detachedFromServer = !!st.detached;
  
  if (typeof st.mark === 'number') st.mark = { t: st.mark, clientId: '' };
  let above = new Set(Array.isArray(st.above) ? st.above : []);
  let below = new Set(Array.isArray(st.below) ? st.below : []);
  const known = new Set(store.log.map(clientId));
  let lastNoted = [];   
  const compareEntry = (e, mark) => e.t - mark.t || clientId(e).localeCompare(mark.clientId);

  if (Array.isArray(st.sent)) {
    const old = new Set(st.sent);
    const ordered = store.log.slice().sort((a, b) => a.t - b.t || clientId(a).localeCompare(clientId(b)));
    let mark = null;
    for (const e of ordered) {
      if (!old.has(clientId(e))) break;
      mark = { t: e.t, clientId: clientId(e) };
    }
    st.mark = mark;
    above = new Set(ordered.filter((e) => old.has(clientId(e)) && (mark == null || compareEntry(e, mark) > 0)).map(clientId));
    delete st.sent;
  }

  const persist = () => {
    st.above = [...above];
    st.below = [...below];
    return adapter.set(SYNC_KEY, JSON.stringify(st));
  };

  const reachedServer = () => !!(st.reached || st.mark || st.cursor || above.size || below.size || Number(st.erasedSeen));
  ownPush.onSent = () => { if (!st.reached) { st.reached = true; persist(); } };

  const detachLocally = () => {
    detachedFromServer = true;
    above.clear(); below.clear(); known.clear(); lastNoted = [];
    if (ownPush.timer) { clearTimeout(ownPush.timer); ownPush.timer = null; }
    ownPush.queued.clear();
    for (const [id, waiters] of [...ownPush.waiters]) { ownPush.waiters.delete(id); for (const waiter of waiters) waiter.resolve(0); }
    st = { mark: null, above: [], below: [], cursor: null, packCursor: null, erasedSeen: 0, detached: true };
    return persist();
  };

  const toRow = (e) => ({ c: e.c, t: e.t, g: e.g, k: e.k, s: e.s, d: e.d, i: e.i, u: e.u, e: e.e, v: e.v || null });   
  const atOrBefore = (e) => st.mark != null && compareEntry(e, st.mark) <= 0;
  const noteLocalChanges = () => {
    const beforeAbove = above.size, beforeBelow = below.size;
    const beforeMark = st.mark == null ? '' : `${st.mark.t}|${st.mark.clientId}`;
    const live = new Set();
    lastNoted = [];
    for (const e of store.log) {
      const id = clientId(e);
      live.add(id);
      if (!known.has(id)) {
        if (atOrBefore(e) && below.size >= 2000) continue;
        known.add(id); lastNoted.push(id);
        if (atOrBefore(e)) below.add(id);
      }
    }
    for (const id of [...above]) if (!live.has(id)) above.delete(id);
    for (const id of [...below]) if (!live.has(id)) below.delete(id);
    const afterMark = st.mark == null ? '' : `${st.mark.t}|${st.mark.clientId}`;
    if (beforeAbove !== above.size || beforeBelow !== below.size || beforeMark !== afterMark) return persist();
    return true;
  };
  const pendingRows = () => store.log.filter((e) => atOrBefore(e) ? below.has(clientId(e)) : !above.has(clientId(e)));
  const acknowledge = (rows) => {
    rows.forEach((e) => {
      const id = clientId(e);
      known.add(id);
      below.delete(id);
      above.add(id);
    });
    const ordered = store.log.slice().sort((a, b) => a.t - b.t || clientId(a).localeCompare(clientId(b)));
    for (const e of ordered) {
      if (st.mark != null && compareEntry(e, st.mark) <= 0) continue;
      const id = clientId(e);
      if (below.has(id) || !above.has(id)) break;
      st.mark = { t: e.t, clientId: id };
      above.delete(id);
    }
    
    if (st.mark != null && above.size) {
      const byId = new Map(ordered.map((e) => [clientId(e), e]));
      for (const id of [...above]) { const e = byId.get(id); if (e && compareEntry(e, st.mark) <= 0) above.delete(id); }
    }
  };
  const cursorAfter = (a, b) => !b || Date.parse(a.receivedAt) > Date.parse(b.receivedAt) || (Date.parse(a.receivedAt) === Date.parse(b.receivedAt) && a.clientId.localeCompare(b.clientId) > 0);

  return {
    
    matchErase(value) {
      const point = Date.parse(value);
      const seen = Number(st.erasedSeen) || 0;
      if (!Number.isFinite(point) || point <= seen) return { changed: false, saved: true, erasedAt: seen };
      const removed = store.eraseBefore(point);
      if (removed !== true) return { changed: false, saved: false, partial: removed === 'partial', erasedAt: point };
      above.clear(); below.clear(); known.clear(); lastNoted = [];
      for (const e of store.log) known.add(clientId(e));
      st = { mark: null, above: [], below: [], cursor: null, packCursor: null, erasedSeen: point };
      if (!persist()) return { changed: true, saved: false, erasedAt: point };
      compareNextPush = true;
      return { changed: true, saved: true, erasedAt: point };
    },
    eraseState() { return { erasedSeen: Number(st.erasedSeen) || 0 }; },
    
    pending() {
      noteLocalChanges();
      return pendingRows();
    },

    async push() {
      if (detachedFromServer) return { pending: 0, batches: 0, uploaded: 0, saved: true, shortfall: 0, detached: true };
      const restoreTracking = () => {
        let held = { mark: null, above: [], below: [], cursor: null, packCursor: null };
        try { const raw = adapter.get(SYNC_KEY); if (raw) held = { ...held, ...JSON.parse(raw) }; } catch (e) {  }
        if (typeof held.mark === 'number') held.mark = { t: held.mark, clientId: '' };
        st = held;
        above = new Set(Array.isArray(st.above) ? st.above : []);
        below = new Set(Array.isArray(st.below) ? st.below : []);
        for (const id of lastNoted) known.delete(id); lastNoted = [];   
      };
      let saved = noteLocalChanges();
      if (!saved) restoreTracking();
      const todo = pendingRows();
      let batches = 0, uploaded = 0;
      for (let i = 0; i < todo.length; i += batch) {
        const rows = todo.slice(i, i + batch);
        const n = await transport.rpc('append_reviews', { p_rows: rows.map(toRow), p_seen: st.erasedSeen ? new Date(st.erasedSeen).toISOString() : null });
        acknowledge(rows);
        batches++; uploaded += Number(n) || 0;
        if (!persist()) { saved = false; restoreTracking(); }
      }
      const shortfall = compareNextPush ? Math.max(0, todo.length - uploaded) : 0;
      compareNextPush = false;
      return { pending: todo.length, batches, uploaded, saved, shortfall };
    },

    async pull() {
      const restoreTracking = () => {
        let held = { mark: null, above: [], below: [], cursor: null, packCursor: null };
        try { const raw = adapter.get(SYNC_KEY); if (raw) held = { ...held, ...JSON.parse(raw) }; } catch (e) {  }
        if (typeof held.mark === 'number') held.mark = { t: held.mark, clientId: '' };
        st = held;
        above = new Set(Array.isArray(st.above) ? st.above : []);
        below = new Set(Array.isArray(st.below) ? st.below : []);
        for (const id of lastNoted) known.delete(id); lastNoted = [];   
      };
      let pages = 0, rowsSeen = 0, added = 0, skipped = 0, saved = noteLocalChanges();
      if (!saved) restoreTracking();
      let trackingFailed = !saved;
      const cursorMs = st.cursor ? Date.parse(st.cursor.receivedAt) : NaN;   
      let scan = Number.isFinite(cursorMs) ? { receivedAt: new Date(cursorMs - PULL_OVERLAP_MS).toISOString(), clientId: '' } : null;
      let skipTies = !!scan;
      const importPage = (page) => {

        const fresh = page.filter((r) => !known.has(`${r.card}|${Number(r.t)}`));
        const entries = fresh.map(rowToEntry);
        let res;
        try { res = entries.length ? store.importAll(JSON.stringify({ format: 'bw08-review-log', version: 1, log: entries }), { lenient: true }) : { added: 0, rejected: 0 }; }
        catch (error) { error.storage = true; throw error; }
        fresh.forEach((r) => known.add(`${r.card}|${Number(r.t)}`));

        if (entries.length) acknowledge(entries);
        const last = page[page.length - 1];
        scan = { receivedAt: last.received_at, clientId: String(last.client_id) };
        if (cursorAfter(scan, st.cursor)) st.cursor = { ...scan };
        pages++; rowsSeen += fresh.length; added += res.added; skipped += res.rejected;
        if (!trackingFailed && !persist()) {
          saved = false;
          trackingFailed = true;
          
          restoreTracking();
        } else if (trackingFailed) restoreTracking();
        if (opts.onPage) opts.onPage({ pages, rows: rowsSeen, added, skipped });
      };
      while (true) {
        if (scan && !skipTies) {
          while (true) {
            const ties = await transport.select('review_log', { select: 'card,t,g,k,s,d,i,u,e,v,received_at,client_id', order: 'received_at.asc,client_id.asc', filters: [['received_at', 'eq', scan.receivedAt], ['client_id', 'gt', scan.clientId]], limit: pageSize });
            if (ties.length) importPage(ties);
            if (ties.length < pageSize) break;
          }
        }
        skipTies = false;
        const filters = scan ? [['received_at', 'gt', scan.receivedAt]] : [];
        const rows = await transport.select('review_log', { select: 'card,t,g,k,s,d,i,u,e,v,received_at,client_id', order: 'received_at.asc,client_id.asc', filters, limit: pageSize });
        if (!rows.length) break;
        importPage(rows);
      }
      return { added, total: store.log.length, pages, rows: rowsSeen, skipped, saved };
    },

    pushPack(pack) {
      if (!pack || detachedFromServer) return Promise.resolve(0);
      return queueOwnPush(ownPush, pack);
    },
    
    flushOwnPacks() {
      if (detachedFromServer) return Promise.resolve(0);
      return flushOwnPush(ownPush);
    },
    async pullPacks() {
      const rows = await transport.select('user_packs', { select: 'pack_id,version,pack,updated_at', order: 'updated_at.asc' });
      return rows.map((r) => r.pack);
    },

    peekClass: (code) => transport.rpc('peek_class', { p_code: code }).then((r) => (Array.isArray(r) ? r[0] : r)),
    
    myProfile: () => transport.select('profiles', { select: 'user_id,display_name,erased_at', order: 'created_at.asc', filters: [] }).then((r) => (r && r[0]) || null),
    setDisplayName: (name) => transport.upsert('profiles', [{ display_name: String(name || '').trim().slice(0, 80) }], 'user_id'),
    createClass: (title, endsOn) => transport.rpc('create_class', { p_title: title, p_ends_on: endsOn }).then((r) => (Array.isArray(r) ? r[0] : r)),
    joinClass: (code, label) => transport.rpc('join_class', { p_code: code, p_label: label }).then((r) => (Array.isArray(r) ? r[0] : r)),
    resetClassCode: (classId) => transport.rpc('reset_class_code', { p_class: classId }),
    
    sharePack: (pack) => transport.rpc('share_pack', { p_pack: pack }).then((r) => (Array.isArray(r) ? r[0] : r)),
    unsharePack: (packId) => transport.rpc('unshare_pack', { p_pack_id: packId }).then((n) => Number(n) || 0),
    sharedPack: (code, full) => fetchSharedPack(transport, code, full),
    myClasses: () => transport.select('classes', { select: 'id,code,title,instructor_id,ends_on,created_at', order: 'created_at.asc', filters: [] }),
    enrollments: (classId) => transport.select('enrollments', { select: 'class_id,user_id,status,label,consented_at,joined_at,updated_at', order: 'joined_at.asc', filters: [['class_id', 'eq', classId]] }),
    setEnrollment: (classId, userId, status) => transport.update('enrollments', { status, updated_at: new Date().toISOString() }, [['class_id', 'eq', classId], ['user_id', 'eq', userId]]),
    leaveClass: (classId) => transport.update('enrollments', { status: 'left', updated_at: new Date().toISOString() }, [['class_id', 'eq', classId]]),
    classPacks: (classId) => transport.select('class_packs', { select: 'class_id,pack_id,version,pack,updated_at', order: 'pack_id.asc', filters: [['class_id', 'eq', classId]] }),
    publishClassPack: (classId, pack) => pack.id === 'mine'
      ? Promise.reject(new Error('Your own cards are yours; a class deck must be a published deck.'))
      : transport.upsert('class_packs', [{ class_id: classId, pack_id: pack.id, version: pack.version, pack, updated_at: new Date().toISOString() }], 'class_id,pack_id'),
    
    async classReviews(afterCursor) {
      const out = [];
      let scan = afterCursor ? (typeof afterCursor === 'object' ? { receivedAt: afterCursor.receivedAt, clientId: afterCursor.clientId || '' } : { receivedAt: String(afterCursor), clientId: '' }) : null;
      let skipTies = false;   
      while (true) {
        if (scan && !skipTies) {
          while (true) {
            const ties = await transport.select('review_log', { select: 'user_id,card,t,g,k,s,d,i,u,e,v,received_at,client_id', order: 'received_at.asc,client_id.asc', filters: [['received_at', 'eq', scan.receivedAt], ['client_id', 'gt', scan.clientId]], limit: pageSize });
            if (ties.length) { out.push(...ties); const last = ties[ties.length - 1]; scan = { receivedAt: last.received_at, clientId: String(last.client_id) }; }
            if (ties.length < pageSize) break;
          }
        }
        skipTies = false;
        const rows = await transport.select('review_log', { select: 'user_id,card,t,g,k,s,d,i,u,e,v,received_at,client_id', order: 'received_at.asc,client_id.asc', filters: scan ? [['received_at', 'gt', scan.receivedAt]] : [], limit: pageSize });
        if (!rows.length) break;
        out.push(...rows);
        const last = rows[rows.length - 1];
        scan = { receivedAt: last.received_at, clientId: String(last.client_id) };
      }
      return out;
    },

    async eraseReviews() { const n = await transport.rpc('erase_my_reviews', {}); return Number(n) || 0; },

    async deleteMe() {
      await transport.rpc('delete_me', {});
      return detachLocally();
    },

    detach() { return detachLocally(); },
    isDetached() { return detachedFromServer; },
    
    async accountGone(profile) {
      if (detachedFromServer) return true;
      if (profile) return false;
      if (!reachedServer()) return false;
      const seen = await transport.select('review_log', { select: 'card,t', order: 'received_at.asc', filters: [], limit: 1 });
      if (seen.length) return false;
      const decks = await transport.select('user_packs', { select: 'pack_id,updated_at', order: 'updated_at.asc', limit: 1 });
      return !decks.length;
    },

    reset() { detachedFromServer = false; above.clear(); below.clear(); known.clear(); st = { mark: null, above: [], below: [], cursor: null, packCursor: null }; return persist(); },
    state() { return { sent: above.size + (st.mark == null ? 0 : store.log.filter((e) => atOrBefore(e) && !below.has(clientId(e))).length), cursor: st.cursor, mark: st.mark }; },
  };
}

const fetchSharedPack = (transport, code, full = false) =>
  transport.rpc('get_shared_pack', { p_code: String(code || '').trim(), p_full: !!full }).then((r) => (Array.isArray(r) ? (r[0] || null) : (r || null)));

const fetchCatalogPack = (transport, id) =>
  transport.rpc('get_catalog_pack', { p_id: String(id || '').trim() }).then((r) => (Array.isArray(r) ? (r[0] || null) : (r || null)));

function timeoutSignal(ms) {
  if (globalThis.__kurikaeshiFetchTimeout) ms = globalThis.__kurikaeshiFetchTimeout;
  if (typeof AbortController !== 'function') return undefined;
  const c = new AbortController();
  setTimeout(() => c.abort(), ms);
  return c.signal;
}
function withTimeout(promise, ms) {
  if (globalThis.__kurikaeshiFetchTimeout) ms = globalThis.__kurikaeshiFetchTimeout;
  let timer;
  return Promise.race([
    Promise.resolve(promise),
    new Promise((resolve, reject) => { timer = setTimeout(() => reject(new Error('Timeout')), ms); }),
  ]).finally(() => clearTimeout(timer));
}

function neonTransport(baseUrl, getToken) {
  const base = String(baseUrl).replace(/\/+$/, '');

  const headers = async (extra) => { const t = await withTimeout(getToken(), 10000); return { ...(t ? { Authorization: 'Bearer ' + t } : {}), 'Content-Type': 'application/json', Accept: 'application/json', ...extra }; };
  const q = (filters) => (filters || []).map(([c, op, v]) => `${encodeURIComponent(c)}=${op}.${encodeURIComponent(v)}`).join('&');
  const check = async (res, what) => {

    if (res.ok) { const text = await res.text(); return text.trim() ? JSON.parse(text) : null; }
    let msg = res.status + ' ' + res.statusText;
    try { const j = await res.json(); msg = j.message || j.hint || j.details || JSON.stringify(j); } catch (e) {  }
    throw new Error(what + ': ' + msg);
  };
  return {
    async rpc(name, args) {
      const res = await /* network: user-initiated */ fetch(`${base}/rpc/${name}`, { method: 'POST', headers: await headers(), body: JSON.stringify(args || {}), signal: timeoutSignal(10000) });
      return check(res, name);
    },
    async select(table, o) {
      const parts = [];
      if (o.select) parts.push('select=' + encodeURIComponent(o.select));
      if (o.order) parts.push('order=' + encodeURIComponent(o.order));
      if (Number.isFinite(o.limit)) parts.push('limit=' + encodeURIComponent(o.limit));
      const f = q(o.filters); if (f) parts.push(f);
      const res = await /* network: user-initiated */ fetch(`${base}/${table}?${parts.join('&')}`, { headers: await headers(), signal: timeoutSignal(10000) });
      return check(res, 'read ' + table);
    },
    async upsert(table, rows, conflict) {
      const res = await /* network: user-initiated */ fetch(`${base}/${table}?on_conflict=${encodeURIComponent(conflict)}`, {
        method: 'POST', headers: await headers({ Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(rows), signal: timeoutSignal(10000),
      });
      return check(res, 'write ' + table);
    },
    async update(table, patch, filters) {
      const res = await /* network: user-initiated */ fetch(`${base}/${table}?${q(filters)}`, {
        method: 'PATCH', headers: await headers({ Prefer: 'return=representation' }), body: JSON.stringify(patch), signal: timeoutSignal(10000),
      });
      const rows = await check(res, 'update ' + table);
      return Array.isArray(rows) ? rows.length : 0;
    },
    async del(table, filters) {
      const res = await /* network: user-initiated */ fetch(`${base}/${table}?${q(filters)}`, { method: 'DELETE', headers: await headers({ Prefer: 'return=representation' }), signal: timeoutSignal(10000) });
      const rows = await check(res, 'delete ' + table);
      return Array.isArray(rows) ? rows.length : 0;
    },
  };
}

function derivedCardCount(p) {
  const types = new Map((Array.isArray(p.noteTypes) ? p.noteTypes : []).map((t) => [t.id, t]));
  let n = 0;
  for (const note of (Array.isArray(p.notes) ? p.notes : [])) {
    const t = types.get(note.type);
    if (t && t.kind === 'cloze') { const f = String((note.fields || {})[(t.templates && t.templates[0] && t.templates[0].prompt) || ''] || ''); n += new Set([...f.matchAll(/\{\{c(\d+)::/g)].map((m) => m[1])).size; }
    else n += Math.max(t && Array.isArray(t.templates) ? t.templates.length : 1, 1);
  }
  return n;
}

function memoryTransport(server, user) {
  server.reviews = server.reviews || new Map();     
  server.packs = server.packs || new Map();          
  server.profiles = server.profiles || new Map();    
  server.shared = server.shared || new Map();        
  server.catalog = server.catalog || new Map();      
  server.classes = server.classes || new Map();      
  server.classPacks = server.classPacks || new Map();
  server.enrollments = server.enrollments || new Map();   
  server.erasures = server.erasures || new Map();
  server.clock = server.clock || 0;
  const stamp = () => new Date(1e12 + (++server.clock) * 1000).toISOString();

  const requireUser = () => { if (!user) throw new Error('missing authentication credentials: required authorization bearer token in JWT format'); };
  const classForCode = (code) => [...server.classes.values()].find((row) => row.code === String(code || '').trim().toUpperCase()) || null;
  const canReadClass = (row) => row.instructor_id === user || server.enrollments.has(`${row.id}|${user}`);
  const instructorCanRead = (student, card) => {
    const packId = String(card || '').split('/')[0];
    for (const enrollment of server.enrollments.values()) {
      if (enrollment.user_id !== student || enrollment.status !== 'active' || !enrollment.consented_at) continue;
      const course = server.classes.get(enrollment.class_id);
      if (course && course.instructor_id === user && server.classPacks.has(`${course.id}|${packId}`)) return true;
    }
    return false;
  };
  const compare = (a, b) => {
    const da = Date.parse(a), db = Date.parse(b);
    if (!Number.isNaN(da) && !Number.isNaN(db) && /\d{4}-\d\d-\d\dT/.test(String(a))) return da - db;
    return a < b ? -1 : a > b ? 1 : 0;
  };
  const matches = (row, filters) => (filters || []).every(([c, op, v]) => op === 'gt' ? compare(row[c], v) > 0 : op === 'gte' ? compare(row[c], v) >= 0 : op === 'lt' ? compare(row[c], v) < 0 : op === 'lte' ? compare(row[c], v) <= 0 : op === 'neq' ? compare(row[c], v) !== 0 : op === 'eq' ? compare(row[c], v) === 0 : true);
  return {
    failNext: null,
    async rpc(name, args) {
      requireUser();
      if (this.failNext) { const e = this.failNext; this.failNext = null; throw new Error(e); }
      if (name === 'append_reviews') {
        const rows = args.p_rows;
        if (!Array.isArray(rows)) throw new Error('rows must be an array');
        if (rows.length > 500) throw new Error('at most 500 rows per call');
        const receivedAt = stamp();
        const erasedAt = server.erasures.get(user) || 0;
        const seen = args.p_seen ? Date.parse(args.p_seen) : NaN;   
        const observed = Number.isFinite(seen) && seen >= erasedAt;
        let n = 0;
        for (const r of rows) {
          if (!/^[^#\s]+#\d+$/.test(r.c) || r.g < 1 || r.g > 4 || r.k < 0 || r.k > 2) throw new Error('bad row');
          if (Number(r.t) < erasedAt && !observed) continue;
          const client_id = `${r.c}|${r.t}`;
          const key = `${user}|${client_id}`;
          if (server.reviews.has(key)) continue;
          server.reviews.set(key, { user_id: user, client_id, card: r.c, t: r.t, g: r.g, k: r.k, s: r.s, d: r.d, i: r.i, u: r.u, e: r.e, v: r.v || null, received_at: receivedAt });
          n++;
        }
        return n;
      }
      if (name === 'delete_me') {
        for (const k of [...server.reviews.keys()]) if (k.startsWith(user + '|')) server.reviews.delete(k);
        for (const k of [...server.packs.keys()]) if (k.startsWith(user + '|')) server.packs.delete(k);
        for (const [k, r] of [...server.shared]) if (r.owner_id === user) server.shared.delete(k);
        for (const [k, r] of [...server.enrollments]) if (r.user_id === user) server.enrollments.delete(k);
        for (const [id, course] of [...server.classes]) if (course.instructor_id === user) {
          server.classes.delete(id);
          for (const [k, row] of [...server.enrollments]) if (row.class_id === id) server.enrollments.delete(k);
          for (const [k, row] of [...server.classPacks]) if (row.class_id === id) server.classPacks.delete(k);
        }
        server.profiles.delete(user);
        server.erasures.delete(user);
        return null;
      }
      if (name === 'share_pack') {
        const p = args.p_pack; if (!p || typeof p !== 'object' || !p.id || !p.title) throw new Error('pack needs an id and a title');
        if (p.id !== 'mine') throw new Error('only your own cards can be shared by code');   
        const n = derivedCardCount(p);   
        let row = [...server.shared.values()].find((r) => r.owner_id === user && r.pack_id === p.id);
        if (!row) { row = { code: 'SHR' + String(server.shared.size + 1).padStart(5, '0'), owner_id: user, pack_id: p.id }; server.shared.set(row.code, row); }
        Object.assign(row, { title: p.title, cards: n, pack: p, updated_at: stamp() });
        return [{ code: row.code, cards: n }];
      }
      if (name === 'get_shared_pack') { const r = server.shared.get(String(args.p_code || '').trim().toUpperCase()); return r ? [{ title: r.title, cards: r.cards, updated_at: r.updated_at, pack: args.p_full ? r.pack : null }] : []; }
      
      if (name === 'get_catalog_pack') { const r = server.catalog.get(String(args.p_id || '').trim()); return r && (r.access === 'open' || r.access === 'account') ? [{ title: r.title, cards: r.cards, updated_at: r.updated_at || stamp(), pack: r.pack }] : []; }
      if (name === 'unshare_pack') { let n = 0; for (const [k, r] of [...server.shared]) if (r.owner_id === user && r.pack_id === args.p_pack_id) { server.shared.delete(k); n++; } return n; }
      if (name === 'erase_my_reviews') {
        server.erasures.set(user, Date.now());
        let n = 0; for (const k of [...server.reviews.keys()]) if (k.startsWith(user + '|')) { server.reviews.delete(k); n++; } return n;
      }
      if (name === 'instructor_may_read') return instructorCanRead(args.p_student, args.p_card);
      if (name === 'create_class') {
        const id = 'class-' + String(server.classes.size + 1);
        const code = 'CLS' + String(server.classes.size + 1).padStart(3, '0');
        const row = { id, code, title: String(args.p_title || ''), instructor_id: user, ends_on: args.p_ends_on || null, created_at: stamp() };
        server.classes.set(id, row);
        return [row];
      }
      if (name === 'peek_class') {
        const row = classForCode(args.p_code);
        if (!row) return [];
        const profile = server.profiles.get(row.instructor_id);
        return [{ id: row.id, code: row.code, title: row.title, ends_on: row.ends_on, instructor: profile ? profile.display_name : '' }];
      }
      if (name === 'join_class') {
        const row = classForCode(args.p_code);
        if (!row) throw new Error('no class has that code');
        const key = `${row.id}|${user}`;
        const prior = server.enrollments.get(key);
        const joined = prior && prior.joined_at ? prior.joined_at : stamp();
        const enrollment = { class_id: row.id, user_id: user, status: 'pending', label: String(args.p_label || ''), consented_at: stamp(), joined_at: joined, updated_at: stamp() };
        server.enrollments.set(key, enrollment);
        return [{ joined_class: row.id, class_title: row.title, join_status: enrollment.status }];
      }
      if (name === 'reset_class_code') { const row = server.classes.get(args.p_class); if (!row || row.instructor_id !== user) throw new Error('not your class'); row.code = 'NEW' + String(++server.clock).padStart(3, '0'); return row.code; }
      throw new Error('unknown rpc ' + name);
    },
    async select(table, o) {
      requireUser();
      let rows;
      if (table === 'classes') rows = [...server.classes.values()].filter(canReadClass);
      else if (table === 'enrollments') rows = [...server.enrollments.values()].filter((row) => { const course = server.classes.get(row.class_id); return row.user_id === user || !!(course && course.instructor_id === user); });
      else if (table === 'class_packs') rows = [...server.classPacks.values()].filter((row) => { const course = server.classes.get(row.class_id); return !!(course && (course.instructor_id === user || server.enrollments.has(`${course.id}|${user}`))); });
      else if (table === 'review_log') rows = [...server.reviews.values()].filter((r) => r.user_id === user || instructorCanRead(r.user_id, r.card));
      else if (table === 'profiles') {
        const saved = server.profiles.get(user);
        const erased = server.erasures.get(user);
        rows = saved || erased ? [{ ...(saved || { user_id: user, display_name: '', created_at: stamp() }), erased_at: erased ? new Date(erased).toISOString() : null }] : [];
      } else { const src = table === 'user_packs' ? server.packs : new Map(); rows = [...src.values()].filter((r) => r.user_id === user); }
      rows = rows.filter((row) => matches(row, o.filters));
      if (o.order) {
        const terms = o.order.split(',').map((part) => { const bits = part.split('.'); return { col: bits[0], dir: bits[1] || 'asc' }; });
        rows.sort((a, b) => { for (const term of terms) { const n = compare(a[term.col], b[term.col]); if (n) return n * (term.dir === 'desc' ? -1 : 1); } return 0; });
      }
      if (Number.isFinite(o.limit)) rows = rows.slice(0, o.limit);
      return rows;
    },
    async upsert(table, rows) {
      requireUser();
      if (table === 'profiles') { for (const r of rows) server.profiles.set(user, { user_id: user, ...r, created_at: stamp() }); return; }
      if (table === 'class_packs') {
        for (const r of rows) {
          if (r.pack_id === 'mine' || !/^[a-z0-9][a-z0-9-]{0,63}$/.test(r.pack_id)) throw new Error('invalid class deck id');
          const course = server.classes.get(r.class_id); if (!course || course.instructor_id !== user) throw new Error('not your class');
          server.classPacks.set(`${r.class_id}|${r.pack_id}`, { ...r });
        }
        return;
      }
      for (const r of rows) server.packs.set(`${user}|${r.pack_id}`, { user_id: user, ...r, updated_at: r.updated_at || stamp() });
    },
    async update(table, patch, filters) {
      requireUser();
      const source = table === 'enrollments' ? server.enrollments : table === 'classes' ? server.classes : new Map();
      let n = 0;
      for (const [key, row] of source) {
        const course = table === 'enrollments' ? server.classes.get(row.class_id) : row;
        const visible = table === 'enrollments' ? row.user_id === user || !!(course && course.instructor_id === user) : row.instructor_id === user;
        if (!visible || !matches(row, filters)) continue;
        source.set(key, { ...row, ...patch }); n++;
      }
      return n;
    },
    async del(table, filters) {
      requireUser();
      const source = table === 'user_packs' ? server.packs : table === 'class_packs' ? server.classPacks : new Map();
      let n = 0;
      for (const [key, row] of source) {
        const owned = table === 'user_packs' ? row.user_id === user : !!(server.classes.get(row.class_id) && server.classes.get(row.class_id).instructor_id === user);
        if (owned && matches(row, filters)) { source.delete(key); n++; }
      }
      return n;
    },
  };
}



const OWN_PACK_ID = 'mine';

const REQUIRED = { basic: ['front', 'back'], both: ['front', 'back'], vocab: ['word', 'meaning'], cloze: ['text'] };

function newOwnPack(language = '') {
  return {
    format: 'kurikaeshi-pack', formatVersion: 1,
    id: OWN_PACK_ID, version: '1.0.0', title: 'My cards', language: language || '',
    publisher: { name: '', role: 'self' }, attribution: '', licence: '', milestones: [],
    noteTypes: OWN_NOTE_TYPES.map((t) => ({ ...t, fields: [...t.fields], templates: t.templates.map((x) => ({ ...x })) })),
    notes: [],
  };
}

function withOwnTypes(pack) {
  const own = OWN_NOTE_TYPES.map((t) => ({ ...t, fields: [...t.fields], display: { ...t.display }, templates: t.templates.map((x) => ({ ...x })) }));
  const ids = new Set(own.map((t) => t.id));
  const kept = (pack.noteTypes || []).filter((t) => !ids.has(t.id));
  return { ...pack, noteTypes: [...own, ...kept] };

function packVerdict(local, incoming, localTombstone) {
  if (!local && !incoming) return 'none';
  const lt = local ? (local.updated || '') : (localTombstone || '');
  const rt = incoming ? (incoming.updated || '') : '';
  if (incoming && rt > lt) return 'adopt';
  if (lt > rt) return 'keep';
  return 'same';
}

function bumpVersion(v) {
  const [a, b, c] = String(v).split('.').map((n) => parseInt(n, 10) || 0);
  return `${a}.${b}.${c + 1}`;
}

function newGuid() {
  const g = globalThis.crypto;
  if (g && g.randomUUID) return 'c-' + g.randomUUID().replace(/-/g, '').slice(0, 16);
  return 'c-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function noteProblem(type, fields) {
  const req = REQUIRED[type];
  if (!req) return { field: 'type', code: 'type_required' };
  for (const f of req) if (!fields || !String(fields[f] || '').trim()) return { field: f, code: 'field_empty' };
  if (type === 'cloze') {
    const segments = String(fields.text || '').matchAll(/\{\{c\d+::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g);
    let found = false;
    for (const segment of segments) {
      found = true;
      if (!String(segment[1] || '').trim()) return { field: 'text', code: 'cloze_empty' };
    }
    if (!found) return { field: 'text', code: 'cloze_missing' };
  }
  return null;
}

const firstField = (pack, type) => (pack.noteTypes.find((t) => t.id === type) || { fields: [''] }).fields[0];
const findRetired = (pack, type, key) => (pack.retired || []).find((r) => r.type === type && r.key === key) || null;
const dropRetired = (pack, guids) => { const rest = (pack.retired || []).filter((r) => !guids.has(r.guid)); return rest.length ? rest : undefined; };

function findDuplicate(pack, type, fields, guid = null) {
  if (!pack) return null;
  const nt = (pack.noteTypes || []).find((t) => t.id === type);
  if (!nt || !nt.fields.length) return null;
  const first = nt.fields[0];
  const value = String((fields || {})[first] || '').trim();
  if (!value) return null;
  return (pack.notes || []).find((note) => note.guid !== guid && note.type === type && String((note.fields || {})[first] || '').trim() === value) || null;
}

function upsertNote(pack0, { guid, type, lesson, fields, tags }) {
  const problem = noteProblem(type, fields);
  if (problem) { const error = new Error(problem.code); error.field = problem.field; throw error; }
  const pack = withOwnTypes(pack0);
  const nt = pack.noteTypes.find((t) => t.id === type);
  if (!nt) throw new Error(`no such card type "${type}"`);
  const clean = {};
  for (const f of nt.fields) clean[f] = String((fields || {})[f] || '').trim();
  const back = guid ? null : findRetired(pack, type, clean[nt.fields[0]]);
  const prior = guid ? pack.notes.find((n) => n.guid === guid) : null;
  const now = Date.now();
  const note = { guid: guid || (back && back.guid) || newGuid(), type, lesson: String(lesson || '').trim(), tags: Array.from(new Set(['mine', ...((tags != null ? tags : prior && prior.tags) || [])])), fields: clean, updated: now };
  const notes = pack.notes.filter((n) => n.guid !== note.guid);
  const idx = pack.notes.findIndex((n) => n.guid === note.guid);
  if (idx >= 0) notes.splice(idx, 0, note); else notes.push(note);
  const next = { ...pack, version: bumpVersion(pack.version), updated: new Date(now).toISOString(), notes, retired: dropRetired(pack, new Set([note.guid])) };
  validatePack(next);
  return next;
}

function retireNote(pack0, guid) {
  if (!pack0.notes.some((n) => n.guid === guid)) throw new Error('no such card');
  const pack = withOwnTypes(pack0);
  const note = pack.notes.find((n) => n.guid === guid);
  const key = String((note.fields || {})[firstField(pack, note.type)] || '').trim();
  const now = Date.now();
  const retired = [...(pack.retired || []).filter((r) => r.guid !== guid), { guid, type: note.type, key, lesson: note.lesson || '', tags: [...(note.tags || [])], fields: { ...(note.fields || {}) }, at: now }];
  return { ...pack, version: bumpVersion(pack.version), updated: new Date(now).toISOString(), notes: pack.notes.filter((n) => n.guid !== guid), retired };
}

function restoreNote(pack0, guid) {

  const problem = noteProblem(item.type, item.fields);
  if (problem) { const error = new Error(problem.code); error.field = problem.field; throw error; }
  const now = Date.now();
  const note = { guid: item.guid, type: item.type, lesson: String(item.lesson || '').trim(), tags: [...(item.tags || ['mine'])], fields: { ...item.fields }, updated: now };
  const next = { ...pack, version: bumpVersion(pack.version), updated: new Date(now).toISOString(), notes: [...pack.notes.filter((n) => n.guid !== guid), note], retired: dropRetired(pack, new Set([guid])) };
  validatePack(next);
  return next;
}

function describeChange(current, next) {
  if (!next.notes.length) return { apply: false, empty: true, reason: 'the last card was retired; the pack goes with it' };
  return planUpdate(current, next);
}

function findNotes(pack, query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return pack.notes.slice();
  return pack.notes.filter((n) => Object.entries(n.fields).some(([name, value]) => {
    const shown = n.type === 'cloze' && name === 'text' ? clozeFilled(String(value || '')) : String(value || '');
    return shown.toLowerCase().includes(q);

}

function addNotes(pack0, list) {

  }

const SEPARATORS = { comma: ',', semicolon: ';', tab: '\t', space: ' ', pipe: '|', colon: ':' };

function readDirectives(text) {
  const lines = String(text).replace(/^﻿/, '').split(/\r\n|\n|\r/);
  const directives = {};
  let i = 0;
  for (; i < lines.length; i++) {
    const l = lines[i];
    if (l.trim() === '') continue;
    if (!l.startsWith('#')) break;
    const m = l.slice(1).match(/^([a-z][a-z ]*?):(.*)$/i);
    if (m) directives[m[1].trim().toLowerCase()] = m[2].trim();
  }
  return { directives, body: lines.slice(i).join('\n'), bodyLine: i + 1 };
}

function separatorFromDirective(v) {
  if (v == null) return null;
  const s = String(v).trim();
  if (SEPARATORS[s.toLowerCase()]) return SEPARATORS[s.toLowerCase()];
  if (s.length === 1) return s;
  if (s === '\\t') return '\t';
  return null;
}

function detectSeparator(body) {
  const lines = body.split('\n').filter((l) => l.trim() !== '').slice(0, 20);
  if (!lines.length) return '\t';
  let best = '\t', bestScore = -1;
  for (const c of ['\t', ',', ';', '|']) {
    const counts = lines.map((l) => countOutsideQuotes(l, c));
    const present = counts.filter((n) => n > 0).length;
    if (!present) continue;
    
    const consistent = counts.every((n) => n === counts[0]) ? 1 : 0;
    const score = present * 10 + consistent;
    if (score > bestScore) { best = c; bestScore = score; }
  }
  return best;
}
function countOutsideQuotes(line, ch) {
  let n = 0, q = false;
  for (const x of line) { if (x === '"') q = !q; else if (!q && x === ch) n++; }
  return n;
}

function splitRows(body, sep) {
  const rows = [];
  let row = [], field = '', q = false, i = 0;
  const s = body;
  while (i < s.length) {
    const c = s[i];
    if (q) {
      if (c === '"') {
        if (s[i + 1] === '"') { field += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"' && field === '') { q = true; i++; continue; }
    if (c === sep) { row.push(field); field = ''; i++; continue; }
    if (c === '\n') {
      row.push(field); field = '';
      if (row.some((f) => f.trim() !== '')) rows.push(row);
      row = []; i++; continue;
    }
    field += c; i++;
  }
  row.push(field);
  if (row.some((f) => f.trim() !== '')) rows.push(row);
  return rows;
}

}

function defaultMapping(nCols, typeFields, columns, skip = []) {
  const map = [];
  const used = new Set();
  const omitted = new Set(skip.filter((i) => Number.isInteger(i) && i >= 0));
  for (let i = 0; i < nCols; i++) {
    let f = null;
    if (!omitted.has(i) && columns && columns[i]) {

      if (hit && !used.has(hit)) f = hit;

  }

        var packIds = Object.create(null); packs.forEach(function (p) { if (/^[a-z0-9][a-z0-9-]{0,63}$/.test(String(p.pack_id))) packIds[p.pack_id] = true; });
        var active = Object.create(null); enr.forEach(function (e) { if (e.status === 'active') active[e.user_id] = e.label || 'student'; });
        sync.classReviews(null).then(function (rows) {
          // The policy already limits rows to this instructor's active students and class decks;
          // this narrows them to ONE class, since an instructor may teach several.
          var byUser = {};
          rows.forEach(function (r) {
            var pid = String(r.card).split('/')[0];
            if (!active[r.user_id] || !packIds[pid]) return;
            (byUser[r.user_id] = byUser[r.user_id] || []).push(rowToEntry(r));
          });
          var exports = Object.keys(byUser).map(function (uid) {
            return readExport(JSON.stringify({ format: 'bw08-review-log', version: 1, packs: packsFromEntries(byUser[uid]), log: byUser[uid] }), active[uid] + ' · ' + uid.slice(-4));
          });
          if (!exports.length) { setMsg('cl-status', 'Nothing to read yet: no approved student has synced a review of this class’s decks.', false); rp.disabled = false; rp.textContent = 'Open the class view'; return; }
          loadedExports = exports;
          var unreadable = 0;
          loadedPacks = packs.map(function (p) { return p.pack; }).filter(function (pk) { try { validatePack(pk); return true; } catch (e) { unreadable++; return false; } });
          show('s-class'); renderClass();
          if (unreadable) toast(unreadable === 1 ? 'One of this class’s decks could not be read, so its cards are not named below.' : unreadable + ' of this class’s decks could not be read, so their cards are not named below.');
        }).catch(function (e) { fail(e); rp.disabled = false; rp.textContent = 'Open the class view'; });
      });
    }).catch(function (e) {
      body.innerHTML = '<div class="prose"><div class="msg bad">' + esc(friendlyError(e)) + '</div><button class="ghost" id="cd-back" type="button"><span>Back to classes</span></button></div>';
      $('cd-back').addEventListener('click', function () { classesView.open = null; renderClasses(); });
    });
  }

  document.addEventListener('input', function (ev) {
    var target = ev.target;
    if (!target || screen !== 's-cards') return;
    if (target.id === 'qa-front') cardsView.quick.front = target.value;
    else if (target.id === 'qa-mid') cardsView.quick.mid = target.value;
    else if (target.id === 'qa-back') cardsView.quick.back = target.value;
    else if (cardsView.editing && /^f-/.test(target.id || '')) {
      cardsView.editing.fields = cardsView.editing.fields || {};
      if (target.id === 'f-lesson') cardsView.editing.lesson = target.value;
      else if (target.id === 'f-lang') cardsView.editing.lang = target.value;
      else if (target.id !== 'f-type') cardsView.editing.fields[target.id.slice(2)] = target.value;
      cardsView.editing.dirty = true;
    } else if (cardsView.importing) {
      if (target.id === 'im-text') cardsView.importing.text = target.value;
      else if (target.id === 'im-lesson') cardsView.importing.lesson = target.value;
      cardsView.importing.dirty = true;
    }
  });
  document.addEventListener('click', function (ev) {
    var target = ev.target && ev.target.closest ? ev.target.closest('#mc-cancel, #im-cancel') : null;
    if (!target) return;
    var dirty = cardsView.editing ? cardsView.editing.dirty : cardsView.importing && cardsView.importing.dirty;
    if (!dirty) return;
    ev.preventDefault(); ev.stopImmediatePropagation();
    confirmSheet({ anchor: target, title: 'Discard the unfinished card text?', action: 'Discard changes', cancel: 'Keep editing', onConfirm: function () {
      cardsView.editing = null; cardsView.importing = null; renderCards();
    } });
  }, true);


  /* ── wiring ────────────────────────────────────────────────────── */
  ['today', 'decks', 'cards'].forEach(function (t) { $('tab-' + t).addEventListener('click', function () { goTab(t); }); });
  Array.prototype.forEach.call(document.querySelectorAll('.go-you'), function (b) { b.addEventListener('click', goYou); });
  $('d-back').addEventListener('click', function () { goTab('decks'); });
  $('br-back').addEventListener('click', function () { renderDeck(openDeck); show('s-deck'); });

  $('ad-back').addEventListener('click', function () { goTab('decks'); });
  $('ct-back').addEventListener('click', function () { renderAdd(); show('s-add'); });
  $('ps-back').addEventListener('click', function () { if (pasteFrom === 'first') { renderFirst(); show('s-first'); } else { renderAdd(); show('s-add'); } });
  document.addEventListener('click', function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest('#ld-choose')) clearDeckLink();
  }, true);

  $('yo-back').addEventListener('click', function () { goTab(youFrom); });
  var toYou = function () { renderYou(); show('s-you'); };
  $('ac-back').addEventListener('click', toYou);
  $('se-back').addEventListener('click', toYou);
  $('st-back').addEventListener('click', toYou);
  $('sl-back').addEventListener('click', function () { renderStats(); show('s-stats'); });
  $('ab-back').addEventListener('click', toYou);
  $('cl-back').addEventListener('click', function () {
    if (classesView.join || classesView.create || classesView.open) { classesView.join = null; classesView.create = false; classesView.open = null; renderClasses(); return; }
    toYou();
  });
  // Leaving the class view forgets the loaded exports: they are someone else's data.
  $('cv-back').addEventListener('click', function () { toYou(); });
  $('mc-back').addEventListener('click', function () {
    var ed = cardsView.editing, im = cardsView.importing;
    if ((ed && ed.dirty) || (im && im.dirty)) {
      confirmSheet({ anchor: $('mc-back'), title: 'Discard the unfinished card text?', action: 'Discard changes', cancel: 'Keep editing', onConfirm: function () {
        cardsView.editing = null; cardsView.importing = null; renderCards();
      } });
      return;
    }
    cardsView.importing = null;
    if (ed && ed.back === 'review' && session) { leaveEditor(ed, false); return; }
    cardsView.editing = null; renderCards();
  });
  $('r-card').addEventListener('click', function (ev) {
    if (ev.target.closest('button,a,input')) return;
    if (!revealed) reveal();
  });

  if (window.speechSynthesis && typeof window.speechSynthesis.addEventListener === 'function') {
    window.speechSynthesis.addEventListener('voiceschanged', function () {
      if (screen === 's-review' && session && card) drawCard();
    });
  }
  var reviewSpeechWatch = new MutationObserver(function () {
    if ($('s-review').hidden) cancelSay();
  });
  reviewSpeechWatch.observe($('s-review'), { attributes: true, attributeFilter: ['hidden'] });


  $('r-more').addEventListener('click', function () {
    openReviewMore($('r-more'));
  });
  $('r-stop').addEventListener('click', function () { finish('stopped'); });
  $('r-undo').addEventListener('click', useUndoSlot);

  // Keyboard, for anyone reviewing at a desk: space reveals, 1 to 4 grade; Esc closes a sheet.
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !$('sheet').hidden) { ev.preventDefault(); closeSheet(false); return; }
    if (ev.key === 'Tab' && !$('sheet').hidden) {
      // the sheet is modal: Tab cycles its actions and never leaves it
      var acts = sheetFocusables();
      if (!acts.length) { ev.preventDefault(); $('sheet').focus(); return; }   // nothing to cycle: focus stays on the sheet
      var i = acts.indexOf(document.activeElement);
      var next = ev.shiftKey ? (i <= 0 ? acts.length - 1 : i - 1) : (i < 0 || i === acts.length - 1 ? 0 : i + 1);
      ev.preventDefault(); acts[next].focus(); return;
    }
    if ($('s-review').hidden) return;
    if ((ev.key === ' ' || ev.key === 'Enter') && ev.target && ev.target.nodeType === 1 && ev.target.closest('button,a,input,textarea,select')) return;
    var tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (ev.target && ev.target.nodeType === 1 && ev.target.hasAttribute('contenteditable'))) return;
    // Escape stops the session from the review surface whatever the shortcut switch says: the
    // switch governs the single-character shortcuts only (review of P07).
    if (ev.key === 'Escape') { ev.preventDefault(); finish('stopped'); return; }
    if (store.prefs.keyboardShortcuts === false) return;
    if (revealed && ev.key >= '1' && ev.key <= '4') { ev.preventDefault(); answer(parseInt(ev.key, 10)); return; }
    if ((ev.key === 'z' || ev.key === 'Z') && session.answered > 0) { ev.preventDefault(); undoAnswer(); return; }
    if ((ev.key === 'h' || ev.key === 'H') && $('r-hint')) { ev.preventDefault(); hintShown = true; drawCard(); return; }
  });

  // 2026-09-13: both handlers take their event now and write down what it carried. The sentence a
  // learner reads is unchanged; what changed is that afterwards somebody can say what happened.
  // Writing the record down is guarded: a throw inside a handler for throws would raise another
  // error event and go round for ever, and the sentence a learner needs must come out either way.
  window.addEventListener('error', function (ev) {
    try { recordProblem('an error nothing caught', null, ev); } catch (ignore) { /* the sentence below still shows */ }
    toast('The app hit a problem. Reload to try again.', { label: 'Reload', on: function () { location.reload(); } });
  });
  window.addEventListener('unhandledrejection', function (ev) {
    try { recordProblem('a promise nothing caught', null, ev); } catch (ignore) { /* as above */ }
    toast('The app hit a problem. Reload to try again.', { label: 'Reload', on: function () { location.reload(); } });
  });
  window.addEventListener('storage', function (ev) {
    if ([LOG_KEY, PREVIEW_KEY, PREFS_KEY, SUSPENDED_KEY, RETIRED_KEY, SKIPPED_KEY, PACKS_KEY, ACCOUNT_KEY].indexOf(ev.key) < 0) return;
    if (store.load({ legacyPackId: LEGACY_PACK_ID }) === false) storageBroken = true;
    packStore.load();
    // Another tab can write back a deck carrying the old rows; what this load put right is said here too.
    if (packStore.repaired) { repairedRows += packStore.repaired; repairedSaved = packStore.repairSaved; }
    try { account = JSON.parse(adapter.get(ACCOUNT_KEY) || '{}') || {}; } catch (e) { account = {}; }
    refreshDeck(); indexNotes();
    var missing = (openDeck && !packStore.has(openDeck)) || (session && session.scope && session.scope.pack && !packStore.has(session.scope.pack));
    if (missing) { session = null; openDeck = null; renderDecks(); show('s-decks'); toast('That deck was removed in another tab.'); return; }
    if (screen === 's-today') renderToday();
    else if (screen === 's-decks') renderDecks();
    else if (screen === 's-deck' && openDeck) renderDeck(openDeck);
    else if (screen === 's-cards') renderCards();
    else if (screen === 's-you') renderYou();
    showStorageProblem();
  });

  window.addEventListener('popstate', function (ev) {
    var sh = $('sheet');
    if (!sh.hidden && !sh.classList.contains('closing')) { closeSheet(false, true); return; }
    if (screen === 's-review' && session && !poppingReview) {
      // A sheet on the review screen collapses its own entry by stepping back onto the review
      // screen's entry (P02): that pop lands on s-review and is not a Back out of the session.
      // A pop that lands anywhere else is the learner's Back, which is a stop (P05).
      if ((ev.state || {}).screen === 's-review') return;
      poppingReview = true;
      finish('stopped');
      poppingReview = false;
      return;
    }
    var st = ev.state || {};
    var id = SCREENS.indexOf(st.screen) >= 0 ? st.screen : 's-today';
    if (id === 's-deck' && st.id) renderDeck(st.id);
    else if (id === 's-browse' && st.id) { openDeck = st.id; renderBrowse(); }
    else if (id === 's-today') renderToday();
    else if (id === 's-decks') renderDecks();
    else if (id === 's-cards') renderCards();
    else if (id === 's-you') renderYou();
    else if (id === 's-settings') renderSettings();
    else if (id === 's-stats') renderStats();
    else if (id === 's-slipping') renderSlipping();
    else if (id === 's-about') renderAbout();
    else if (id === 's-account') renderAccount();
    else if (id === 's-classes') renderClasses();
    else if (id === 's-class') renderClass();
    else if (id === 's-add') renderAdd();
    else if (id === 's-catalog') renderCatalog();
    else if (id === 's-first') renderFirst();
    show(id, { fromHistory: true });
  });
  var lastResumeAt = Date.now(), lastResumeDay = store.dayKey(Date.now()), resumeTimer = null;
  function resumeApp() {
    if (document.visibilityState && document.visibilityState !== 'visible') return;
    if (resumeTimer) clearTimeout(resumeTimer);
    resumeTimer = setTimeout(function () {
      resumeTimer = null;
      if (screen === 's-review' && session) return;
      var now = Date.now(), day = store.dayKey(now);
      if (day === lastResumeDay && now - lastResumeAt <= 60000) return;
      lastResumeAt = now; lastResumeDay = day;
      if (screen === 's-today') renderToday();
      else if (screen === 's-decks') renderDecks();
      else if (screen === 's-deck' && openDeck) renderDeck(openDeck);
      syncSoon();
    }, 100);
  }
  document.addEventListener('visibilitychange', resumeApp);
  window.addEventListener('pageshow', resumeApp);
  window.addEventListener('online', function () {
    if (sync && account.signedIn && !syncing) syncNow().catch(function () { /* Account carries the detail. */ });
  });

  window.addEventListener('pagehide', function () {
    if (!exportUrl) return;
    URL.revokeObjectURL(exportUrl);
    exportUrl = null;
  });

  window.addEventListener('pagehide', clearClassView);
  window.addEventListener('pagehide', function () { if (sync && account.signedIn) sync.flushOwnPacks().catch(function () { /* the next signed-in sync tries again */ }); });

  /* ── boot ──────────────────────────────────────────────────────── */
  (function boot() {
    try {
      probeStorage();
      var qs = location.search || '';
      var dm = qs.match(/[?&]deck=([^&#]+)/);
      var saved = savedDeckLink();
      renderToday(); show('s-today', { replace: true });
      if (dm && !/[?&]code=/.test(qs)) {
        // A link whose percent-encoding is malformed is a bad link, not a broken app: decode
        // defensively so the value reaches openDeckLink and is reported there, rather than
        // throwing into the boot guard below, which would replace Today with the recovery screen.
        var v = decodeQueryPart(dm[1]);
        if (v === null) {
          clearDeckLink();
          history.replaceState(history.state || {}, '', appUrl());
          bootAccount();
          showInvalidDeckLink();
          return;
        }
        bootAccount();
        openDeckLink(v);
        return;
      }
      if (bootAccount()) return;
      if (saved) { openDeckLink(saved); return; }
      if (!packStore.list().length) { renderFirst(); show('s-first', { instant: true }); }
    } catch (e) {
      $('app').className = '';
      $('tabbar').hidden = true;
      SCREENS.forEach(function (s) { $(s).hidden = s !== 's-first'; });
      $('fo-body').innerHTML = '<div class="centre"><h1 class="sr-only" id="fo-title" tabindex="-1">Start Kurikaeshi</h1><p class="msg bad">The app could not start. Reload to try again.</p><div class="stack"><button class="primary" id="boot-reload" type="button">Reload</button></div></div>';
      $('boot-reload').addEventListener('click', function () { location.reload(); });
      screen = 's-first';
      history.replaceState({ screen: 's-first', id: null }, '', location.href);
    }
  })();
})();

<script>
if ('serviceWorker' in navigator) {
  var APP_V = "0.8.4";
  var hadController = !!navigator.serviceWorker.controller;
  var pending = false, timer = null, viaHook = false;

  // The app's own toast element, driven from outside the app's closure because its toast() is not
  // exposed on window. If a later build does expose window.__kurikaeshiToast, that is used instead
  // and this markup is never touched.
  function show(msg, label, on, autoHideMs) {
    if (typeof window.__kurikaeshiToast === 'function') {
      try { window.__kurikaeshiToast(msg, label ? { label: label, on: on } : null); return 'hook'; } catch (e) {}
    }
    var t = document.getElementById('toast');
    if (!t) return false;
    t.innerHTML = '';
    var sp = document.createElement('span'); sp.textContent = msg; t.appendChild(sp);
    if (label) {
      var b = document.createElement('button');
      b.type = 'button'; b.id = 'sw-update-act'; b.textContent = label;
      b.addEventListener('click', on);
      t.appendChild(b);
    }
    t.hidden = false; t.classList.remove('out');
    requestAnimationFrame(function () { t.classList.add('in'); });
    if (autoHideMs) setTimeout(hide, autoHideMs);
    return 'element';
  }
  function hide() {
    var t = document.getElementById('toast'); if (!t) return;
    t.classList.remove('in'); t.classList.add('out');
    setTimeout(function () { if (!t.classList.contains('in')) { t.hidden = true; t.classList.remove('out'); } }, 150);
  }
  // "The offer is already made." If the app took the message through its own hook it owns the
  // presentation from there, so this stops asking rather than stacking a second notice on top.
  function onScreen() {
    if (viaHook) return true;
    var b = document.getElementById('sw-update-act'); return !!b && document.contains(b);
  }

  // Nothing may interrupt unless interrupting costs nothing. The app answers that for itself; the
  // fallback is the review check, for a shell too old to answer.
  function quiet() {
    var d = document.getElementById('s-done'); if (d && !d.hidden) return false;
    try { if (typeof window.__kurikaeshiUpdateSafe === 'function') return !!window.__kurikaeshiUpdateSafe(); } catch (e) {}
    var r = document.getElementById('s-review'); return !(r && !r.hidden);
  }
  function offer() {
    if (!pending || onScreen() || !quiet()) return;
    var how = show('Kurikaeshi updated', 'Reload', function () {
      try { sessionStorage.setItem('kurikaeshi.updated', '1'); } catch (e) {}
      hide(); location.reload();
    }, 0);
    if (!how) return;
    viaHook = how === 'hook';
    if (timer) { clearInterval(timer); timer = null; }
  }

  // A new worker takes over (skipWaiting + claim in sw.js) while the OLD page is still on screen.
  // The first-ever install had no controller before it, so it is not an update and says nothing.
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || pending) return;
    pending = true;
    window.__kurikaeshiUpdatePending = true;
    offer();
    if (!onScreen() && !timer) timer = setInterval(offer, 5000);
  });
  // If the learner leaves and comes back, that is a moment where a notice costs nothing, and it is
  // also the second chance if one of the app's own toasts replaced this one.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) offer(); });

  // After a reload the learner asked for, say which version they are now on and get out of the way.
  addEventListener('load', function () {
    var moved = false;
    try { moved = !!sessionStorage.getItem('kurikaeshi.updated'); if (moved) sessionStorage.removeItem('kurikaeshi.updated'); } catch (e) {}
    if (moved) setTimeout(function () { show('Kurikaeshi is up to date', null, null, 4000); }, 800);
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
  });
}
</script>
