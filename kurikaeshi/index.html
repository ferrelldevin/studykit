<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Spaced-repetition study cards for any course. Runs on your phone, works offline, keeps nothing anywhere but your own browser.">
<meta name="theme-color" content="#2f4a7d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111320" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kurikaeshi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Kurikaeshi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Same palette as the specification page — 藍 indigo — so the two read as one product.
   This one is a UI, not a document: fixed regions, state encoded in form, thumb-first. */
:root {
  --paper:#f6f6f9; --surface:#ffffff; --surface-2:#eceef4;
  --ink:#1b1d2a; --ink-soft:#4a4d60; --ink-mute:#6f7288;
  --rule:#d8dae4; --indigo:#2f4a7d; --indigo-lo:#dfe5f2; --indigo-ink:#ffffff;
  --again:#a8402a; --again-lo:#f6e3de;
  --hard:#8a6d3b;  --hard-lo:#f5ecdc;
  --good:#2f4a7d;  --good-lo:#dfe5f2;
  --easy:#46664b;  --easy-lo:#e0ebe1;
  --shadow:0 1px 2px rgba(27,29,42,.06), 0 10px 28px -14px rgba(27,29,42,.25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#111320; --surface:#191c2b; --surface-2:#212537;
    --ink:#e6e7ef; --ink-soft:#b3b6c8; --ink-mute:#878ba4;
    --rule:#2f3448; --indigo:#9db3dd; --indigo-lo:#23304c; --indigo-ink:#0f1220;
    --again:#e08a72; --again-lo:#3a2119;
    --hard:#d6b077;  --hard-lo:#332818;
    --good:#9db3dd;  --good-lo:#23304c;
    --easy:#9cc0a2;  --easy-lo:#1e2c21;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --paper:#111320; --surface:#191c2b; --surface-2:#212537;
  --ink:#e6e7ef; --ink-soft:#b3b6c8; --ink-mute:#878ba4;
  --rule:#2f3448; --indigo:#9db3dd; --indigo-lo:#23304c; --indigo-ink:#0f1220;
  --again:#e08a72; --again-lo:#3a2119;
  --hard:#d6b077;  --hard-lo:#332818;
  --good:#9db3dd;  --good-lo:#23304c;
  --easy:#9cc0a2;  --easy-lo:#1e2c21;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
/* Load-bearing, not boilerplate. `.screen` sets display:flex, which beats the UA stylesheet's
   display:none for [hidden] — so without this rule every screen renders at once, stacked. The
   artifact host happens to ship this reset; a plain file and GitHub Pages do not, which is
   exactly where this app has to run. */
[hidden]{display:none!important}
html,body{height:100%}
body { background:var(--paper); color:var(--ink); font-family:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:17px; line-height:1.55; margin:0; -webkit-font-smoothing:antialiased; overflow:hidden; }
/* Fonts follow the PACK's language, declared on the card, not a class the app hard-codes. */
[lang^="ja"]{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

#app{height:100%;max-width:34rem;margin:0 auto;display:flex;flex-direction:column;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:0 1.1rem 2rem}

/* ── Top bar ─────────────────────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:.6rem;padding:.65rem 1.1rem;border-bottom:1px solid var(--rule);background:var(--surface);flex:none}
.bar h1{font-family:Spectral,Georgia,serif;font-size:1.05rem;font-weight:600;margin:0;letter-spacing:-.01em}
.bar h1 small{font-size:.85em;font-weight:500;color:var(--ink-soft);margin-left:.3em}
.bar .sp{margin-left:auto}
.iconbtn{padding:.35rem .6rem;border-radius:999px;border:1px solid var(--rule);font-size:.78rem;color:var(--ink-soft);background:var(--surface)}
.iconbtn:hover{border-color:var(--indigo);color:var(--indigo)}

/* ── Counts ──────────────────────────────────────────────────────────── */
.counts{display:flex;gap:.4rem;flex:none;padding:.55rem 1.1rem;border-bottom:1px solid var(--rule);background:var(--surface)}
.count{flex:1;text-align:center;padding:.3rem .2rem;border-radius:6px;background:var(--surface-2)}
.count b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1.15rem;font-variant-numeric:tabular-nums;line-height:1.2}
.count span{font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute)}
.count.new b{color:var(--indigo)} .count.due b{color:var(--easy)} .count.lrn b{color:var(--hard)}

/* ── Home ────────────────────────────────────────────────────────────── */
.lede{font-family:Spectral,Georgia,serif;font-size:1.02rem;color:var(--ink-soft);margin:1rem 0 .4rem}
.legend{font-size:.76rem;color:var(--ink-mute);margin:.5rem 0 0;line-height:1.4}
.empty{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1rem;margin:.6rem 0}
.empty p{margin:0 0 .8rem}
.primary{display:block;width:100%;padding:.95rem 1rem;border-radius:10px;background:var(--indigo);color:var(--indigo-ink);font-weight:700;font-size:1.02rem;text-align:center;box-shadow:var(--shadow);margin:.9rem 0 .3rem;min-height:48px}
.primary[disabled]{opacity:.45;cursor:default;box-shadow:none}
.floor{border-left:3px solid var(--hard);background:var(--surface);padding:.55rem .8rem;margin:.6rem 0;font-size:.88rem;border-radius:0 6px 6px 0}
.floor.ok{border-left-color:var(--easy)}
.packhdr{display:flex;align-items:baseline;gap:.6rem;width:100%;padding:.55rem .2rem .3rem;text-align:left;border-bottom:1px solid var(--rule);margin-top:1rem}
.packhdr h2{font-family:Spectral,Georgia,serif;font-size:1.1rem;margin:0;font-weight:600;flex:1;min-width:0}
.packhdr .v{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-mute);white-space:nowrap}
.packhdr[aria-pressed="true"] h2{color:var(--indigo)}
.lessons{display:flex;flex-direction:column;gap:.4rem;margin:.6rem 0 .2rem}
.lesson{display:flex;align-items:center;gap:.7rem;width:100%;padding:.65rem .8rem;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:left;min-height:48px}
.lesson:hover{border-color:var(--indigo)}
.lesson .nm{font-weight:600;min-width:2.6rem;font-family:"IBM Plex Mono",monospace;font-size:.85rem;white-space:nowrap}
.lesson .bars{flex:1;display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--surface-2);min-width:0}
.lesson .bars i{display:block}
.lesson .bars .b-new{background:var(--indigo-lo)}
.lesson .bars .b-lrn{background:var(--hard)}
.lesson .bars .b-rev{background:var(--easy)}
.lesson .tally{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.lesson[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-lo)}

/* ── Review ──────────────────────────────────────────────────────────── */
/* The card region is a fixed box and does NOT resize when the answer appears; a layout that
   reflows on reveal causes mis-taps, and a mis-tap is a corrupted review (SPEC.md 7.2). */
.cardwrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1rem 1.1rem;overflow-y:auto;text-align:center;gap:.5rem}
.tag{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute)}
/* Roles, not subjects: the pack says which field is which (PACK-FORMAT.md). */
.r-glyph{font-size:clamp(5rem,26vw,8.5rem);line-height:1.05;font-weight:500}
.r-glyph.long{font-size:clamp(2.4rem,12vw,3.6rem);line-height:1.2}
.r-headline{font-family:Spectral,Georgia,serif;font-size:clamp(1.4rem,7vw,2rem);line-height:1.25;max-width:22ch}
.ans .r-headline{font-size:clamp(1.6rem,8vw,2.2rem);line-height:1.2;font-weight:600}
.ans .r-glyph{font-size:clamp(2rem,10vw,3rem);font-weight:500;line-height:1.2}
.r-text{font-family:Spectral,Georgia,serif;font-size:1.15rem;color:var(--ink);max-width:26ch}
.r-also{font-size:.85rem;color:var(--ink-mute);max-width:30ch;line-height:1.35}
.r-meta{font-size:.78rem;color:var(--ink-mute)}
.divider{width:2.2rem;height:1px;background:var(--rule);margin:.5rem 0}
.ans{display:flex;flex-direction:column;gap:.35rem;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-top:.2rem}
.chip{font-size:1rem;padding:.25rem .6rem;border-radius:4px;background:var(--surface-2);color:var(--ink-soft)}
.chip b{font-family:"IBM Plex Mono",monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);margin-right:.4rem;font-weight:500}
.chip b[lang]{font-family:"Noto Sans JP",sans-serif;text-transform:none}
.leechflag{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--again);border:1px solid var(--again);padding:.1rem .4rem;border-radius:3px}

/* The answer band is a fixed-height region. "Show answer" and the four grades occupy the
   same band, so nothing above them moves between the two states. */
.band{flex:none;padding:.7rem 1.1rem calc(.9rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);background:var(--surface);min-height:5.6rem;display:flex;align-items:stretch;gap:.4rem}
.reveal{flex:1;border-radius:10px;background:var(--indigo);color:var(--indigo-ink);font-weight:700;font-size:1rem;min-height:56px;box-shadow:var(--shadow)}
.grades{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.grade{border-radius:10px;border:1px solid var(--rule);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:56px;padding:.3rem .1rem}
.grade .g{font-weight:700;font-size:.92rem}
.grade .i{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.glegend{font-size:.7rem;color:var(--ink-mute);text-align:center;margin:.35rem 0 0;line-height:1.3}
.grade[data-g="1"]{background:var(--again-lo);border-color:var(--again)} .grade[data-g="1"] .g{color:var(--again)}
.grade[data-g="2"]{background:var(--hard-lo);border-color:var(--hard)}   .grade[data-g="2"] .g{color:var(--hard)}
.grade[data-g="3"]{background:var(--good-lo);border-color:var(--good)}   .grade[data-g="3"] .g{color:var(--good)}
.grade[data-g="4"]{background:var(--easy-lo);border-color:var(--easy)}   .grade[data-g="4"] .g{color:var(--easy)}

/* ── Done / empty ────────────────────────────────────────────────────── */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.4rem;gap:.5rem}
.done h2{font-family:Spectral,Georgia,serif;font-size:1.8rem;margin:0;font-weight:600}
.done p{color:var(--ink-soft);margin:.2rem 0;max-width:30ch}

/* ── Settings / stats ────────────────────────────────────────────────── */
h2.sec{font-family:Spectral,Georgia,serif;font-size:1.3rem;margin:1.4rem 0 .3rem;font-weight:600}
.field{display:block;margin:1rem 0}
.field .lbl{font-weight:600;display:block}
.field .hint{font-size:.85rem;color:var(--ink-mute);margin-top:.1rem}
.field input[type=range]{width:100%;margin-top:.5rem;accent-color:var(--indigo);min-height:32px}
.field .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--indigo);font-weight:500}
.rows{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface);margin:.7rem 0}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.55rem .8rem;border-bottom:1px solid var(--rule);font-size:.92rem}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-soft)} .row .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
.tagchip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.05em;padding:.05rem .35rem;border-radius:3px;border:1px solid var(--rule);color:var(--ink-mute);margin-left:.3rem;vertical-align:middle}
.tagchip.meas{color:var(--easy);border-color:var(--easy)}
.tagchip.seed{color:var(--hard);border-color:var(--hard)}
.note{font-size:.85rem;color:var(--ink-mute);margin:.7rem 0}
.danger{border:1px solid var(--again);color:var(--again);border-radius:8px;padding:.6rem 1rem;width:100%;min-height:44px;margin-top:.4rem;font-weight:600;background:var(--surface)}
.ghost{border:1px solid var(--rule);border-radius:8px;padding:.6rem 1rem;width:100%;min-height:44px;margin-top:.4rem;background:var(--surface);color:var(--ink-soft);font-weight:600}
.ghost:hover{border-color:var(--indigo);color:var(--indigo)}
.ghost.small{width:auto;min-height:38px;padding:.4rem .8rem;font-size:.85rem;font-weight:600;margin:.2rem .3rem .2rem 0}
.textin{width:100%;font:inherit;font-size:.95rem;padding:.55rem .7rem;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);margin-top:.4rem;min-height:44px}
textarea.textin{font-family:"IBM Plex Mono",monospace;font-size:.75rem;min-height:5rem}
.status{font-size:.85rem;margin:.4rem 0;padding:.45rem .7rem;border-radius:6px;background:var(--surface-2);color:var(--ink-soft)}
.status.bad{background:var(--again-lo);color:var(--again)}
.packrow{border:1px solid var(--rule);border-radius:8px;padding:.7rem .8rem;margin:.5rem 0;background:var(--surface)}
.packrow .t{font-weight:600}
.packrow .m{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-mute);margin:.15rem 0 .4rem;word-break:break-all}
.exportbox{border:1px solid var(--rule);border-radius:8px;padding:.7rem;margin:.5rem 0;background:var(--surface);display:flex;flex-direction:column;gap:.45rem}
.exportbox .cnt{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-mute)}
.exportbox textarea{width:100%;font-family:"IBM Plex Mono",monospace;font-size:.7rem;border:1px solid var(--rule);border-radius:6px;padding:.5rem;background:var(--surface-2);color:var(--ink-soft);resize:vertical}
.exportbox .dl{font-size:.8rem;color:var(--ink-mute);text-align:center}
/* ── Class view ──────────────────────────────────────────────────────── */
.caveat{border-left:3px solid var(--hard);background:var(--surface);padding:.7rem .9rem;margin:1rem 0;font-size:.9rem;border-radius:0 6px 6px 0}
.cv-table{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.cv-table th{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--rule);background:var(--surface-2)}
.cv-table td{padding:.45rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top}
.cv-table tr:last-child td{border-bottom:0}
.cv-table td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cv-table td.bad{color:var(--again);font-weight:600}
.cv-table td.warn{color:var(--hard)}
.cv-wrap{overflow-x:auto;margin:.5rem 0 1rem}
.cv-table tr.grp td{font-family:Spectral,Georgia,serif;font-weight:600;font-size:.92rem;background:var(--surface-2)}
.cv-table th br+*{font-weight:400}
.cv-items td:first-child{white-space:nowrap}
.bkt{display:inline-flex;height:10px;border-radius:4px;overflow:hidden;width:100%;background:var(--surface-2)}
.bkt i{display:block;height:100%}
.bkt .b0{background:var(--again)} .bkt .b1{background:var(--hard)} .bkt .b2{background:var(--indigo)} .bkt .b3{background:var(--easy)}
.legend{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink-mute);margin:.2rem 0 .8rem}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;vertical-align:-1px;margin:0 .2rem 0 .6rem}
footer.attr{flex:none;padding:.6rem 1.1rem calc(.7rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);font-size:.7rem;color:var(--ink-mute);line-height:1.4;background:var(--surface)}
footer.attr a{color:var(--ink-mute)}
/* own cards, account, classes — reuse the settings vocabulary, add only what those screens need */
.bigcode{font-family:"IBM Plex Mono",monospace;font-size:2rem;letter-spacing:.25em;text-align:center;padding:.6rem;border:1px dashed var(--rule);border-radius:8px;margin:.6rem 0;user-select:all;-webkit-user-select:all}
select.textin{appearance:auto;-webkit-appearance:auto}
.field input.textin,.field textarea.textin,.field select.textin{margin-top:.3rem}
textarea.textin.plain{font-family:inherit;font-size:.95rem;min-height:3.2rem}
.packrow .t[lang]{font-size:1.15rem}
.packrow .acts{display:flex;flex-wrap:wrap;gap:.4rem}
.packrow .acts .ghost.small{margin:0}
.rows.plain .v{text-align:left;font-family:inherit;font-variant-numeric:normal;flex:1}
.rows.plain .k{flex:none;min-width:5.5rem}
.chk{display:flex;gap:.6rem;align-items:flex-start;margin:.9rem 0;font-size:.92rem;cursor:pointer}
.chk input{width:1.25rem;height:1.25rem;margin-top:.05rem;flex:none;accent-color:var(--indigo)}
#h-sync{font-family:"IBM Plex Mono",monospace;font-size:.72rem}
ruby{ruby-position:over}
.r-hint{font-size:.92rem;color:var(--ink-mute);font-style:italic;margin-top:.5rem;text-align:center;padding:0 1rem}
.r-cloze{font-family:Spectral,Georgia,serif;font-size:1.3rem;line-height:1.7;text-align:center;padding:0 1rem;max-width:32rem}
.r-cloze .blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--indigo);color:var(--indigo);padding:0 .3em;font-family:"IBM Plex Mono",monospace;font-size:.85em}
.r-cloze mark.filled{background:var(--surface-2);color:var(--indigo);font-weight:600;border-radius:3px;padding:0 .15em;box-decoration-break:clone}
rt{font-size:.5em;color:var(--ink-mute);font-weight:400;letter-spacing:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">

  <!-- ── HOME ──────────────────────────────────────────────────────── -->
  <section class="screen" id="s-home">
    <div class="bar">
      <h1>Kurikaeshi <small lang="ja">繰り返し</small></h1>
      <span class="sp"></span>
      <button class="iconbtn" id="go-stats" type="button">Progress</button>
      <button class="iconbtn" id="go-settings" type="button">Settings</button>
    </div>
    <div class="counts">
      <div class="count new"><b id="h-new">0</b><span>New</span></div>
      <div class="count lrn"><b id="h-lrn">0</b><span>Learning</span></div>
      <div class="count due"><b id="h-due">0</b><span>Due</span></div>
    </div>
    <div class="scroll">
      <p class="legend" id="h-legend"></p>
      <p class="lede" id="h-lede">Loading your queue…</p>
      <button class="primary" id="start" type="button">Start</button>
      <p class="note" id="h-budget"></p>
      <p class="note" id="h-sync" hidden></p>
      <div id="h-floor"></div>
      <div id="h-packs"></div>
      <button class="ghost" id="h-mycards" type="button">Write your own cards</button>
      <p class="note">Tap a pack or a lesson to study it alone. Otherwise the daily cap is global
        across everything, which is the honest way to hold a time budget.</p>
    </div>
    <footer class="attr" id="attr"></footer>
  </section>

  <!-- ── REVIEW ────────────────────────────────────────────────────── -->
  <section class="screen" id="s-review" hidden>
    <div class="bar">
      <button class="iconbtn" id="r-back" type="button">Done for now</button>
      <span class="sp"></span>
      <button class="iconbtn" id="r-edit" type="button" hidden>Edit</button>
      <button class="iconbtn" id="r-undo" type="button" disabled>Undo</button>
      <span class="tag" id="r-left"></span>
    </div>
    <div class="cardwrap" id="r-card" aria-live="polite" aria-atomic="true"></div>
    <div class="band" id="r-band"></div>
  </section>

  <!-- ── DONE ──────────────────────────────────────────────────────── -->
  <section class="screen" id="s-done" hidden>
    <div class="bar"><h1>Kurikaeshi <small lang="ja">繰り返し</small></h1></div>
    <div class="done">
      <h2 id="d-title">Queue clear</h2>
      <p id="d-body"></p>
      <div style="width:100%;max-width:22rem">
        <button class="primary" id="d-home" type="button">Back to packs</button>

//
// PROVENANCE, because a scheduler that is quietly wrong is the worst failure this app can have.
// Every formula below is transcribed from the Open Spaced Repetition project's own algorithm
// documentation, read at the issuer 2026-09-05:
//   https://github.com/open-spaced-repetition/awesome-fsrs/wiki/The-Algorithm
// NO third-party source code was copied. ts-fsrs (MIT, v5.4.2) implements the same algorithm
// and a UMD build exists on jsDelivr, but loading it would put the network on the cold-start
// path — and offline correctness is SPEC.md's top-ranked quality attribute. Implementing the
// published formulas keeps the page working with the network gone. The licence was checked
// anyway, so the choice is a design call and not an accident: ts-fsrs is MIT and could be used.
//
// VERSION. FSRS-6, 21 parameters. The issuer's own benchmark repo names an FSRS-7 as newer —
// "FSRS-7 has been designed to work with fractional interval lengths" — but no prose
// specification and no JavaScript implementation of it exists at the issuer as of this date.
// FSRS-6 is what is fully specified and therefore what is implemented. FSRS-7 is a known
// future migration, recorded rather than guessed at.
//
// VERIFICATION. test-engine.mjs checks this against the authors' own published first-review
// vector: for a brand-new card, the four possible first ratings must produce stability
// [0.212, 1.2931, 2.3065, 8.2956] and difficulty [6.4133, 5.11217071, 2.11810397, 1].

// ts-fsrs constant.ts, fsrs-rs inference.rs), read 2026-09-05. w[20] is the trainable decay,
// which is the headline change of FSRS-6 — earlier versions fixed it as a constant.
const W = [

  0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542,

// supports as written, tagged so the gate can find it and so nobody mistakes it for a
// documented value. A failed card must come back inside the same sitting, and FSRS alone would
// schedule a newly lapsed card hours out. Anki solves this with learning steps, and its manual
// DOES state the shipped default — Studying: "By default, there are two steps: 1 minute and
// 10 minutes" (an earlier version of this comment said otherwise; external review, round 4 corrected
// it). This app keeps only the first step: one minute after Again, and the first Hard, Good
// or Easy graduates on the spot at the FSRS interval shown on the button, rather than through
// a ten-minute second step. That is the deviation, and it is mine.

// `Math.max(this.param.w[g - 1], 0.1)`, read at the issuer 2026-09-05). The reference algorithm

// The ceiling is not in the published formula; it lives one level up in both reference
// dispatchers — ts-fsrs: `next_s_min = s / Math.exp(w_17 * w_18)` then
// `clamp(next_s_min, S_MIN, s_after_fail)`; fsrs-rs: `new_s.min(last_s / (w[17]*w[18]).exp())`

// file used a plain min(sf, s), which is looser than the reference; corrected on review.
function stabilityOnFailure(d, s, r, w) {

// same-day Again can.

 * commits. Returns { 1:{s,d,ivl}, 2:…, 3:…, 4:… } with ivl in days.
 *

 *             the reference passes an integer `t` from a calendar-date difference, and dispatches

// issuer 2026-09-05. A brand-new card taking each of the four possible first ratings.
const TEST_VECTORS = [
  { name: 'first review, Again', memory: null, elapsedDays: 0, grade: 1, expect: { s: 0.212, d: 6.4133 }, tol: 1e-5 },
  { name: 'first review, Hard',  memory: null, elapsedDays: 0, grade: 2, expect: { s: 1.2931, d: 5.11217071 }, tol: 1e-5 },
  { name: 'first review, Good',  memory: null, elapsedDays: 0, grade: 3, expect: { s: 2.3065, d: 2.11810397 }, tol: 1e-5 },
  { name: 'first review, Easy',  memory: null, elapsedDays: 0, grade: 4, expect: { s: 8.2956, d: 1 }, tol: 1e-5 },

//
// This file and fsrs.js are the two pieces that survive a move to React Native. Everything
// that touches a screen lives in app.template.html and is expected to be rewritten; this is
// not. That is why persistence goes through an injected adapter rather than calling
// localStorage directly — on the web the adapter wraps localStorage, on a phone it wraps
// AsyncStorage or SQLite, and nothing below changes.
//
// SPEC.md invariant 2: history is append-only, state is DERIVED. deriveState is a real fold

const PREFS_KEY = 'bw08.prefs.v1';
const SUSPENDED_KEY = 'bw08.suspended.v1';

//   u due epoch ms after this review · e elapsed ms the learner spent
const KINDS = { learn: 0, review: 1, relearn: 2 };

  minutesPerDay: 15,
  // UNBACKED — my seed. Anki's manual publishes no shipped numeric default for this; the
  // figure comes from its rule of thumb that 20 new cards a day lands near 200 reviews a day,
  // which the manual itself states without derivation. A ceiling, not a target.
  maxReviewsPerDay: 200,
  desiredRetention: 0.9,
  // SPEC.md A6, backed: the review limit also caps new cards. It is the only automatic brake
  // on runaway load, so it ships on and is not offered as a toggle in the normal path.
  newCardsIgnoreReviewLimit: false,
  burySiblings: true,

  // show learning cards up to 20 minutes early by default."
