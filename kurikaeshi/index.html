  }
  function renderHome() {
    var b = queueFor(filter);
    $('h-new').textContent = Math.min(b.counts.fresh, b.newLeft);
    $('h-lrn').textContent = b.counts.learn;
    $('h-due').textContent = b.counts.due;

    var total = b.queue.length;
    var where = filter.lesson ? ' · ' + filter.lesson : (filter.pack ? ' · ' + (DECK.packs[filter.pack] || {}).title : '');
    $('start').disabled = total === 0;
    var anyPack = packStore.list().length > 0;
    $('start').textContent = total
      ? 'Start today’s ' + total + (total === 1 ? ' card' : ' cards') + esc(where)
      : (anyPack ? 'Nothing due right now' : 'Install a pack to begin');
    $('h-lede').textContent = total
      ? 'Everything below is scheduled for today. Finishing it is the whole job.'
      : (anyPack ? 'Queue clear. Coming back tomorrow is the point — the schedule does the rest.'
                 : 'No packs yet. A pack is one course’s cards — install the one your instructor sent, or the public one below.');
    // What the three numbers mean, on the screen that shows them; and today's date, so a
    // phone whose clock is wrong is visibly wrong rather than silently rescheduling everything.
    $('h-legend').textContent = 'New: never seen · Learning: seen, not yet held · Due: scheduled for today · Today is ' +
      new Date().toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    renderSyncLine();
    var op = ownPack();
    $('h-mycards').textContent = op ? 'Your cards · ' + op.notes.length : 'Write your own cards';

    var sec = b.budget.secondsPerCard, ratio = b.budget.ratio;
    $('h-budget').innerHTML =
      store.prefs.minutesPerDay + ' minutes a day → <b>' + (sec.measured && ratio.measured ? '' : 'about ') + b.budget.perDay + ' new cards</b>. ' +
      'From your own pace: ' + sec.value.toFixed(1) + 's per card' +
      (sec.measured ? '<span class="tagchip meas">measured</span>' : '<span class="tagchip seed">seed</span>') +
      ' and ' + ratio.value.toFixed(1) + ' reviews per new card' +
      (ratio.measured ? '<span class="tagchip meas">measured</span>' : '<span class="tagchip seed">seed</span>') +
      (sec.measured && ratio.measured ? '' : ' <span class="hint">A seed is a starting guess until your own pace has been measured.</span>');

    // The intake FLOOR (SPEC.md B1): a dated milestone in a pack says how many new cards a day
    // you must take to have seen its material in time — distinct from the ceiling above.
    // Scoped to the chosen pack: another course's deadline is not this learner's (external review, round 1).
    var fl = intakeFloor(DECK, store, Date.now(), filter.pack);
    var fh = $('h-floor');
    if (!fl) fh.innerHTML = '';
    else if (fl.unseen === 0) fh.innerHTML = '<div class="floor ok"><b>' + esc(fl.milestone.label) + '</b> in ' + fl.daysLeft + ' day' + (fl.daysLeft === 1 ? '' : 's') + ' — every card it covers has been seen.</div>';
    else if (fl.floor <= b.budget.perDay) fh.innerHTML = '<div class="floor ok"><b>' + esc(fl.milestone.label) + '</b> in ' + fl.daysLeft + ' day' + (fl.daysLeft === 1 ? '' : 's') + ' covers ' + fl.unseen + ' cards you have not seen: ' + fl.floor + ' new a day reaches them, inside your ' + b.budget.perDay + '.</div>';
    else fh.innerHTML = '<div class="floor"><b>' + esc(fl.milestone.label) + '</b> in ' + fl.daysLeft + ' day' + (fl.daysLeft === 1 ? '' : 's') + ' covers ' + fl.unseen + ' cards you have not seen. That needs <b>' + fl.floor + ' new a day</b>, above your ' + b.budget.perDay + '. More minutes, lower retention on this pack, or accept not seeing all of it — the app will not silently under-serve.</div>';

    // Packs, then their lessons. One card per note per day; the cap is global unless filtered.
    var host = $('h-packs');
    host.innerHTML = '';
    if (!anyPack) {
      // The instructor's file is the first action and the big button; the public pack is the
      // second, in plain style — a student who skips the sentence must not land in another
      // course (external review, round 4).
      host.innerHTML =
        '<div class="empty"><p>Your instructor’s pack comes as a file.</p>' +
        '<button class="primary" id="h-getfile" type="button">Install the pack your instructor sent</button>' +
        '<p class="note">No file? The public JAPN 309 kanji pack (Kanji Look and Learn, lessons 1–8) is one tap, and can be removed later.</p>' +
        '<button class="ghost" id="h-getpublic" type="button">Install the public JAPN 309 pack</button></div>';
      $('h-getfile').addEventListener('click', function () {
        renderSettings(); show('s-settings');
        $('pk-file').click();
      });
      $('h-getpublic').addEventListener('click', function () {
        renderSettings(); show('s-settings');
        $('pk-url').value = PUBLIC_PACK_URL;
        $('pk-fetch').click();   // the one user-initiated fetch, on the learner's tap
      });
    }
    var rows = lessonProgress(DECK, store);
    packStore.list().forEach(function (p) {
      var hdr = document.createElement('button');
      hdr.className = 'packhdr'; hdr.type = 'button';
      hdr.setAttribute('aria-pressed', filter.pack === p.id && !filter.lesson ? 'true' : 'false');
      var pk = DECK.packs[p.id] || {};
      hdr.innerHTML = '<h2' + (pk.language ? ' lang="' + esc(pk.language) + '"' : '') + '>' + esc(p.title) + '</h2><span class="v">v' + esc(p.version) + '</span>';
      hdr.addEventListener('click', function () {
        filter = (filter.pack === p.id && !filter.lesson) ? { pack: null, lesson: null } : { pack: p.id, lesson: null };
        renderHome();
      });
      host.appendChild(hdr);
      var list = document.createElement('div'); list.className = 'lessons';
      rows.filter(function (r) { return r.pack === p.id; }).forEach(function (row) {
        var L = row.lesson || '—', tot = row.total || 1;
        var el = document.createElement('button');
        el.className = 'lesson'; el.type = 'button';
        var on = filter.pack === p.id && filter.lesson === row.lesson;
        el.setAttribute('aria-pressed', on ? 'true' : 'false');
        el.setAttribute('aria-label', L + ': ' + (tot - row.fresh) + ' of ' + tot + ' cards started' + (row.suspended ? ', ' + row.suspended + ' retired' : ''));
        el.innerHTML =
          '<span class="nm">' + esc(L) + '</span>' +
          '<span class="bars">' +
            '<i class="b-rev" style="width:' + (row.review / tot * 100) + '%"></i>' +
            '<i class="b-lrn" style="width:' + (row.learning / tot * 100) + '%"></i>' +
            '<i class="b-new" style="width:' + (row.fresh / tot * 100) + '%"></i>' +
          '</span>' +
          '<span class="tally">' + (tot - row.fresh) + '/' + tot + (row.suspended ? ' <small>+' + row.suspended + ' retired</small>' : '') + '</span>';
        el.addEventListener('click', function () {
          filter = on ? { pack: p.id, lesson: null } : { pack: p.id, lesson: row.lesson };
          renderHome();
        });
        list.appendChild(el);
      });
      host.appendChild(list);
    });

    // Attribution is per pack — whatever each installed pack declares, nothing the app adds.
    var attrs = packStore.list().map(function (p) { var pk = DECK.packs[p.id]; return pk && pk.attribution ? esc(pk.attribution) : ''; }).filter(Boolean);
    var attr = attrs.join(' ') + (attrs.length ? ' ' : '') +
      sendsLine() + ' ' +
      'v' + APP_VERSION + '.';
    var here = (location.href || '').indexOf(PUBLIC_URL) === 0;
    var link = here ? '' : ' <a href="' + PUBLIC_URL + '">Install-ready copy →</a>';
    $('attr').innerHTML = attr + link;
    $('attr2').innerHTML = attr + link;
  }

  /* ── review ────────────────────────────────────────────────────── */
  var current = null, shownAt = 0, revealed = false, previews = null;

  function startSession() {
    var b = queueFor(filter);
    if (!b.queue.length) return;
    session = { queue: b.queue, done: 0, total: b.queue.length };
    show('s-review');
    nextCard();
  }

  function nextCard() {
    if (!session || !session.queue.length) return finish();
    current = session.queue.shift();
    revealed = false;
    shownAt = Date.now();
    $('r-left').textContent = (session.total - session.queue.length) + ' / ' + session.total;
    // Undo reaches only answers given in THIS sitting. On a session's first card it used to pop
    // the previous day's last review and delete a real answer (external review, round 2).
    $('r-undo').disabled = !(session && session.answered > 0);
    drawCard();
  }

  function noteOf(card) { return noteById[card.pack + '/' + card.guid]; }

  // A field rendered by ROLE. The renderer knows six roles and no subjects; the pack's note
  // type says which field is which (PACK-FORMAT.md). A kanji, a formula and a musical interval
  // are all "glyph"; what differs is the text and the language attribute the pack declares.
  // Anki's ruby syntax, as its manual documents it (docs.ankiweb.net/templates/fields.html):
  // "Text[Ruby]" — the reading in brackets rides above the run of text before it, and a space
  // marks where that run starts (the space itself is not shown). Any pack or the learner's own
  // cards may carry it; it renders as <ruby> and nothing else changes. Runs on ESCAPED text.
  function ruby(s) {
    return String(s).replace(/(^|\s)([^\s\[\]<>&]+)\[([^\[\]<>]+)\]/g, function (m, pre, base, rt) {
      return (pre === ' ' ? '' : pre) + '<ruby>' + base + '<rt>' + rt + '</rt></ruby>';
    });
  }
  function renderField(nt, name, value, lang, onAnswer) {
    var role = (nt.display && nt.display[name]) || 'text';
    if (role === 'hidden' || value == null || String(value) === '') return '';
    var label = nt.labels && nt.labels[name];
    var L = lang ? ' lang="' + esc(lang) + '"' : '';
    var v = ruby(esc(value));
    switch (role) {
      case 'glyph': return '<div class="r-glyph' + (String(value).length > 2 ? ' long' : '') + '"' + L + '>' + v + '</div>';
      case 'headline': return '<div class="r-headline"' + (onAnswer ? '' : L) + '>' + v + '</div>';
      case 'also': return '<div class="r-also">' + (label ? esc(label) + ': ' : 'also: ') + v + '</div>';
      case 'hint': return '<div class="r-hint"' + L + '>' + v + '</div>';
      case 'meta': {
        // A meta label may carry a plural: "stroke|strokes" picks by the value. Subject-neutral,
        // declared by the pack, so "1 strokes" cannot come back.
        var lab = label || '';
        if (lab.indexOf('|') >= 0) { var parts = lab.split('|'); lab = String(value) === '1' ? parts[0] : parts[1]; }
        return '<div class="r-meta">' + v + (lab ? ' ' + esc(lab) : '') + '</div>';
      }
      case 'chip': return '<span class="chip"' + L + '>' + (label ? '<b' + (/[^\x00-\x7f]/.test(label) ? L : '') + '>' + esc(label) + '</b>' : '') + v + '</span>';
      default: return '<div class="r-text"' + L + '>' + v + '</div>';
    }
  }

  // A cloze card: the sentence with THIS blank hidden (its hint if it has one) and every other
  // blank shown; on the answer the blank is filled and marked. Anki's syntax, packs.js's parse.
  function clozeHtml(text, ord, filled, lang) {
    var L = lang ? ' lang="' + esc(lang) + '"' : '';
    return '<div class="r-cloze"' + L + '>' + clozeSegments(text).map(function (seg) {
      if (seg.cloze == null) return ruby(esc(seg.text));
      if (seg.cloze !== ord) return ruby(esc(seg.text));
      return filled ? '<mark class="filled">' + ruby(esc(seg.text)) + '</mark>' : '<span class="blank">' + (seg.hint ? esc(seg.hint) : '…') + '</span>';
    }).join('') + '</div>';
  }

  function drawCard() {
    var n = noteOf(current), f = n.fields, st = store.state(current.id);
    var nt = typeOf(n), cloze = nt.kind === 'cloze', tmpl = cloze ? nt.templates[0] : nt.templates[current.ord];
    var pk = DECK.packs[n.pack] || {}, lang = pk.language || '';
    var host = $('r-card');
    $('r-edit').hidden = n.pack !== OWN_PACK_ID;   // Anki: "edit the current note" — only cards that are yours to edit
    var h = '';
    var leech = st.leech ? '<span class="leechflag">needs reformulating</span>' : '';
    h += '<div class="tag">' + esc(n.lesson || pk.title) + ' · ' + esc(nt.name) + ' · ' + esc(tmpl.name) + (cloze ? ' ' + current.ord : '') + ' ' + leech + '</div>';

    // The prompt is the template's prompt field and nothing else — a reading shown beside a
    // word is the answer (SPEC.md 7.3; MC-65: one unknown per card, readings hidden on the ask).
    h += cloze ? clozeHtml(f[tmpl.prompt], current.ord, false, lang) : renderField(nt, tmpl.prompt, f[tmpl.prompt], lang, false);
    // A cue the learner wrote for the question travels with the question (role "hint").
    nt.fields.forEach(function (name) {
      if (name === tmpl.prompt || name === tmpl.answer) return;
      if (((nt.display && nt.display[name]) || 'text') === 'hint') h += renderField(nt, name, f[name], lang, false);
    });

    if (revealed) {
      h += '<div class="divider"></div><div class="ans">';
      // The answer field first, then every other non-hidden field in the type's own order,
      // chips gathered onto one row. The prompt field is not repeated.
      h += cloze ? clozeHtml(f[tmpl.prompt], current.ord, true, lang) : renderField(nt, tmpl.answer, f[tmpl.answer], lang, true);
      var chips = '', rest = '';
      nt.fields.forEach(function (name) {
        if (name === tmpl.prompt || name === tmpl.answer) return;
        var role = (nt.display && nt.display[name]) || 'text';
        if (role === 'hint') return;   // already on the question side
        var piece = renderField(nt, name, f[name], lang, true);
        if (role === 'chip') chips += piece; else rest += piece;
      });
      h += rest.replace(/(<div class="r-also">)/, '$1');
      if (chips) h += '<div class="chips">' + chips + '</div>';
      if (st.reps) h += '<div class="r-meta">seen ' + st.reps + '×' + (st.lapses ? ' · ' + st.lapses + ' lapses' : '') + '</div>';
      h += '</div>';
    }
    host.innerHTML = h;
    drawBand();
  }

  function drawBand() {
    var band = $('r-band');
    if (!revealed) {
      band.innerHTML = '<button class="reveal" id="reveal" type="button">Show answer</button>';
      $('reveal').addEventListener('click', reveal);
      return;
    }
    var labels = { 1: 'Again', 2: 'Hard', 3: 'Good', 4: 'Easy' };
    var h = '<div class="grades">';
    for (var g = 1; g <= 4; g++) {
      h += '<button class="grade" type="button" data-g="' + g + '" aria-label="' + labels[g] +
           ', next in ' + fmtIvl(previews[g].ivl) + '">' +
           '<span class="g">' + labels[g] + '</span>' +
           '<span class="i">' + fmtIvl(previews[g].ivl) + '</span></button>';
    }
    // The four grades, defined where they are pressed. Anki manual, "Studying": Again = forgot;
    // Hard = recalled with serious difficulty; Good = with some effort; Easy = easily.
    band.innerHTML = h + '</div><p class="glegend">Again forgot · Hard barely · Good with effort · Easy at once — timing, not a score</p>';
    Array.prototype.forEach.call(band.querySelectorAll('.grade'), function (b) {
      b.addEventListener('click', function () { answer(parseInt(b.getAttribute('data-g'), 10)); });
    });
  }

  function reveal() {
    revealed = true;
    var st = store.state(current.id);
    // Whole days between the last review's study-day and today's, the way the reference
    // computes `t` — a calendar-date difference, not a fraction of 24 hours.
    var elapsedDays = 0;
    if (st.last) {
      var a = new Date(store.dayKey(st.last.t)), b = new Date(store.dayKey(Date.now()));
      elapsedDays = Math.max(0, Math.round((b - a) / 86400e3));
    }
    previews = FSRS.nextStates(
      st.s == null ? null : { s: st.s, d: st.d },
      elapsedDays,
      store.prefs.desiredRetention,
      store.prefs.maximumInterval
    );
    drawCard();
  }

  function answer(grade) {
    var st = store.state(current.id);
    var next = previews[grade];
    var now = Date.now();
    store.append({
      c: current.id,
      v: (DECK.packs[current.pack] || {}).version || undefined,   // the pack version this answer was given under (class view, question 4)
      t: now,
      g: grade,
      k: st.state === 'new' ? store.KINDS.learn : (grade === 1 ? store.KINDS.relearn : store.KINDS.review),
      s: next.s, d: next.d, i: next.ivl,
      u: now + Math.round(next.ivl * 86400e3),
      e: Math.min(120000, now - shownAt)
    });
    session.done++;
    session.answered = (session.answered || 0) + 1;
    // A lapsed card comes back in the same sitting rather than tomorrow — that is what the
    // learning steps are for, and dropping it to tomorrow wastes the failure.
    if (next.ivl < 1) session.queue.push(current);
    nextCard();
  }

  function finish() {
    var b = queueFor(filter);
    show('s-done');
    var t = store.countsToday();
    // Leaving with cards still waiting is not a clear queue, and the heading must not say it
    // is (external review, round 2: a success heading over a remaining queue is a silent success).
    var left = b.queue.length;
    $('d-title').textContent = left ? 'Stopped for now' : 'Queue clear';
    $('d-body').innerHTML = t.reviews + (t.reviews === 1 ? ' card' : ' cards') + ' today in ' +
      Math.max(1, Math.round(t.ms / 60000)) + ' minutes' +
      (t.newCards ? ', ' + t.newCards + ' of them new' : '') + '.<br>' +
      (left
        ? left + (left === 1 ? ' card is' : ' cards are') + ' still waiting today. The schedule keeps them; come back when you can.'
        : (b.counts.due + b.counts.learn > 0
          ? 'More is due later today.'
          : 'Nothing else is due. Stopping here is correct — the schedule brings it back.'));
    $('d-more').hidden = !(b.counts.fresh > 0);
    renderHome();
    syncSoon();   // signed in: the session's reviews go up now, quietly; a failure shows on the home line
  }

  /* ── stats ─────────────────────────────────────────────────────── */
  // Anki's stats screen shows "an estimated number of reviews that will be due on a given day in
  // the future" (docs.ankiweb.net/stats.html). Here: cards in learning or review whose due day
  // falls on each of the next seven days; anything overdue lands on today. New cards are not
  // forecast — their intake is the budget's, not the schedule's.
  function forecast(days) {
    var states = store.allStates(), out = [];
    for (var i = 0; i < days; i++) out.push(0);
    var start = new Date(); start.setHours(0, 0, 0, 0);
    var t0 = start.getTime(), DAY = 86400e3;
    DECK.cards.forEach(function (c) {
      if (store.isSuspended(c.id)) return;
      var st = states.get(c.id);
      if (!st || st.state === 'new' || st.due == null) return;
      var d = Math.floor((st.due - t0) / DAY);
      if (d < 0) d = 0;
      if (d < days) out[d]++;
    });
    return out;
  }
  function renderStats() {
    var states = store.allStates(), tr = store.trueRetention();
    var n = 0, l = 0, r = 0, mature = 0, leeches = 0, susp = 0;
    DECK.cards.forEach(function (c) {
      if (store.isSuspended(c.id)) { susp++; return; }
      var s = states.get(c.id);
      if (!s || s.state === 'new') { n++; return; }
      if (s.state === 'review') r++; else l++;
      if (s.ivl >= 21) mature++;
      if (s.leech) leeches++;
    });
    var sec = store.measuredSecondsPerCard(), ratio = store.measuredReviewsPerNewCard();
    var t = store.countsToday();
    $('st-body').innerHTML =
      '<h2 class="sec">Today</h2><div class="rows">' +
      row('Cards answered', t.reviews) + row('New introduced', t.newCards) +
      row('Time', Math.round(t.ms / 60000) + ' min') + '</div>' +
      '<h2 class="sec">The collection</h2><div class="rows">' +
      row('Packs installed', packStore.list().length) +
      row('Cards total', DECK.cards.length) +
      row('Not started', n) + row('Learning', l) + row('In review', r) +
      row('Mature (21d+)', mature) +
      row('Flagged for reformulating', leeches) +
      row('Retired by a pack update', susp) + '</div>' +
      '<h2 class="sec">Coming up</h2>' +
      '<p class="note">Reviews the schedule already holds for each of the next seven days. New cards are not counted; their pace is the budget above.</p>' +
      '<div class="rows">' + forecast(7).map(function (n, i) {
        var d = new Date(); d.setDate(d.getDate() + i);
        return row(i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }), n);
      }).join('') + '</div>' +
      '<h2 class="sec">True retention</h2>' +
      '<p class="note">Only cards answered in review state count. Learning answers say nothing ' +
      'about whether the schedule is working, and counting them flatters the number.</p>' +
      '<div class="rows">' +
      row('Reviews judged', tr.seen) +
      // A rate from a handful of reviews is noise; it is said so, and shown whole, never to a tenth.
      row('Recalled', tr.seen < 30 ? (tr.seen ? 'too few to say yet (' + tr.seen + ' of 30)' : '—') : Math.round(tr.rate * 100) + '%') +
      row('Target', (store.prefs.desiredRetention * 100).toFixed(0) + '%') + '</div>' +
      '<h2 class="sec">Your measured pace</h2>' +
      '<div class="rows">' +
      row('Seconds per card', sec.value.toFixed(1) + (sec.measured ? '' : ' (seed)'), sec.measured ? 'meas' : 'seed') +
      row('Reviews per new card', ratio.value.toFixed(1) + (ratio.measured ? '' : ' (seed)'), ratio.measured ? 'meas' : 'seed') +
      '</div>' +
      '<p class="note">A seed is a starting guess, not a fact about you. Both are replaced by ' +
      'your own numbers once there is enough history — seconds per card after 30 answers, ' +
      'the ratio after 20 new cards. The starting ratio of 10 comes from a rule of thumb in ' +
      'Anki’s manual that is stated without derivation and predates the current scheduler, ' +
      'so treat it as a placeholder that expires.</p>';
    show('s-stats');
  }
  function row(k, v, chip) {
    return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v +
      (chip ? '<span class="tagchip ' + chip + '">' + (chip === 'meas' ? 'measured' : 'seed') + '</span>' : '') +
      '</span></div>';
  }

  /* ── packs: install / update / remove ─────────────────────────── */
  // Returns { ok, msg } and touches no DOM. The caller re-renders the settings panel (the pack
  // list changed) and THEN writes the message — the first version wrote the message first and
  // the re-render wiped it, so a student installing a pack saw nothing confirm it.
  function installPackObject(obj, meta) {
    var plan;
    try { plan = packStore.install(obj, meta || {}); }
    catch (e) { return { ok: false, msg: e.message }; }
    if (!plan.apply) return { ok: true, msg: 'Nothing to do: ' + plan.reason + '.' };
    applyPlan(plan);
    refreshDeck(); indexNotes();
    return { ok: true, msg: (plan.reason === 'install' ? 'Installed ' : 'Updated ') + obj.title + ' v' + obj.version +
      (plan.reason === 'update' ? ' — ' + plan.changed + ' changed, ' + plan.added + ' added, ' + plan.removed + ' retired (history kept).' : ' — ' + plan.added + ' notes. It is on your home screen.') };
  }
  // Write a status line into the CURRENT settings panel, after any re-render.
  function flash(res) {
    var st = $('pk-status'); if (!st) return;
    st.hidden = false; st.className = res.ok ? 'status' : 'status bad'; st.textContent = res.msg;
  }
  function installAndShow(obj, meta) {
    var res = installPackObject(obj, meta);
    renderSettings(); renderHome(); flash(res);
    return res;
  }

  function installFromUrl(url) {
    flash({ ok: true, msg: 'Fetching…' });
    // The ONE network call in the app, on the learner's tap, never on the load path. The
    // marker is the contract the assembler and the gate check for.
    /* network: user-initiated */ fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('That address answered ' + r.status + '.'); return r.json(); })
      .then(function (obj) { installAndShow(obj, { url: url }); })
      .catch(function (e) { flash({ ok: false, msg: 'Could not install from that address: ' + e.message }); });
  }

  /* ── settings ──────────────────────────────────────────────────── */
  function renderSettings() {
    var p = store.prefs, b = store.intakeBudget();
    var packsHtml = packStore.list().map(function (r) {
      var pk = DECK.packs[r.id] || {}, own = r.id === OWN_PACK_ID;
      return '<div class="packrow"><div class="t"' + (pk.language ? ' lang="' + esc(pk.language) + '"' : '') + '>' + esc(r.title) + '</div>' +
        '<div class="m">v' + esc(r.version) + ' · ' + (pk.notes ? pk.notes.length : 0) + ' notes' + (own ? ' · your own cards' : (r.url ? ' · ' + esc(r.url) : ' · installed from a file')) + '</div>' +
        // The learner's own pack leaves through My cards (retire keeps history and tells other
        // devices); a plain Remove here would bypass that, so it is not offered.
        (own ? '<button class="ghost small" type="button" data-cards="1">Open My cards</button>'
             : (r.url ? '<button class="ghost small" type="button" data-upd="' + esc(r.id) + '">Check for update</button>' : '') +
               '<button class="ghost small" type="button" data-rm="' + esc(r.id) + '">Remove</button>') +
        '</div>';
    }).join('');
    $('se-body').innerHTML =
      '<label class="field"><span class="lbl">Minutes a day: <span class="val" id="v-min">' + p.minutesPerDay + '</span></span>' +
      '<span class="hint">Set the time, not the card count. Review load is a lagging consequence ' +
      'of intake weeks earlier, and minutes are the thing you can actually feel.</span>' +
      '<input type="range" id="i-min" min="5" max="90" step="5" value="' + p.minutesPerDay + '"></label>' +
      '<p class="note" id="v-derived">→ ' + b.perDay + ' new cards a day at your current pace.</p>' +

      '<label class="field"><span class="lbl">Desired retention: <span class="val" id="v-ret">' +
      (p.desiredRetention * 100).toFixed(0) + '%</span></span>' +
      '<span class="hint">A workload dial, not a quality dial. Anki’s manual: above 90% the ' +
      'workload increases very quickly, and above 97% it can be overwhelming.</span>' +
      '<input type="range" id="i-ret" min="80" max="97" step="1" value="' + (p.desiredRetention * 100) + '"></label>' +
      '<p class="note" id="v-retcost"></p>' +

      '<h2 class="sec">Your cards</h2>' +
      '<p class="note">Write cards of your own — a word list, a chapter, anything. They join the same queue.</p>' +
      '<button class="ghost" id="se-cards" type="button">My cards' + (ownPack() ? ' · ' + ownPack().notes.length : '') + '</button>' +
      '<h2 class="sec">Account</h2>' +
      '<p class="note">' + esc(accountSummary()) + '</p>' +
      '<button class="ghost" id="se-account" type="button">' + (account.signedIn ? 'Account and sync' : (SYNC_READY ? 'Sign in or create an account' : 'Account')) + '</button>' +
      (SYNC_READY ? '<button class="ghost" id="se-classes" type="button">Classes</button>' : '') +

      '<h2 class="sec">Packs</h2>' +
      '<p class="note">A pack is a course’s cards, published by whoever teaches it. Install one ' +
      'from a file they sent you or from an address; updates keep your history.</p>' +
      packsHtml +
      '<div id="pk-status" class="status" hidden></div>' +
      '<input type="text" class="textin" id="pk-url" placeholder="https://…/pack.json" inputmode="url" autocapitalize="off" spellcheck="false">' +
      '<button class="ghost" id="pk-fetch" type="button">Install from address</button>' +
      '<button class="ghost" id="pk-filebtn" type="button">Install from a file</button>' +
      '<input type="file" id="pk-file" accept="application/json,.json" hidden>' +
      '<textarea class="textin" id="pk-paste" placeholder="…or paste a pack’s JSON here"></textarea>' +
      '<button class="ghost" id="pk-pastebtn" type="button">Install pasted pack</button>' +

      '<h2 class="sec">For whoever teaches the course</h2>' +
      '<p class="note">Students hand you their exports; this reads them together and answers four ' +
      'questions. It reads the files here, on this device, and nothing leaves it.</p>' +
      '<button class="ghost" id="go-class" type="button">Open the class view</button>' +

      '<h2 class="sec">Theme</h2>' +
      '<button class="ghost" id="i-theme" type="button">Switch to ' +
        (currentTheme() === 'dark' ? 'light' : 'dark') + '</button>' +

      '<h2 class="sec">Your data</h2>' +
      '<p class="note">' + (account.signedIn
        ? 'Everything lives in this browser and is also synced to your account, so another device signed in as you gets the same record. Clearing site data here loses only what has not synced yet. '
        : 'Everything lives in this browser. Nothing is uploaded, and no account exists unless you sign in. That also means clearing site data clears your progress — so export before you switch phones. ') +
      'Your own cards travel in it too, so a new phone gets them back. Your export is also what you hand to an instructor who asks to see ' +
      'your studying; it is a record of what you did, reported by this device.</p>' +
      '<button class="ghost" id="i-export" type="button">Export my review history</button>' +
      '<div id="se-export" class="exportbox" hidden>' +
        '<div class="cnt"></div>' +
        '<textarea readonly rows="4" spellcheck="false"></textarea>' +
        '<button class="ghost copybtn" type="button">Copy to clipboard</button>' +
        '<a class="dl" download hidden>or save as a file</a>' +
      '</div>' +
      '<button class="ghost" id="i-import" type="button">Import a history file</button>' +
      '<input type="file" id="i-file" accept="application/json" hidden>' +
      '<button class="danger" id="i-reset" type="button">Erase my progress</button>' +
      '<p class="note">There is deliberately no “reset the deck” button that keeps your ' +
      'history but wipes the schedule. Resetting destroys the intervals of every card you ' +
      'actually know, and it is the single thing practitioners agree you should never do.</p>';

    var min = $('i-min'), ret = $('i-ret');
    min.addEventListener('input', function () {
      $('v-min').textContent = min.value;
      store.setPrefs({ minutesPerDay: parseInt(min.value, 10) });
      $('v-derived').textContent = '→ ' + store.intakeBudget().perDay + ' new cards a day at your current pace.';
    });
    ret.addEventListener('input', function () {
      $('v-ret').textContent = ret.value + '%';
      store.setPrefs({ desiredRetention: parseInt(ret.value, 10) / 100 });
      retCost();
    });
    retCost();

    $('pk-fetch').addEventListener('click', function () {
      var u = ($('pk-url').value || '').trim();
      if (!/^https?:\/\//.test(u)) { flash({ ok: false, msg: 'That is not a web address.' }); return; }
      installFromUrl(u);
    });
    $('pk-filebtn').addEventListener('click', function () { $('pk-file').click(); });
    $('pk-file').addEventListener('change', function (ev) {
      var f = ev.target.files && ev.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        var obj;
        try { obj = JSON.parse(String(fr.result)); } catch (e) { flash({ ok: false, msg: 'That file is not JSON.' }); return; }
        installAndShow(obj, {});
      };
      fr.readAsText(f);
    });
    $('pk-pastebtn').addEventListener('click', function () {
      var obj;
      try { obj = JSON.parse($('pk-paste').value); } catch (e) { flash({ ok: false, msg: 'That is not JSON.' }); return; }
      installAndShow(obj, {});
    });
    Array.prototype.forEach.call($('se-body').querySelectorAll('[data-upd]'), function (btn) {
      btn.addEventListener('click', function () {
        var r = packStore.list().filter(function (x) { return x.id === btn.getAttribute('data-upd'); })[0];
        if (r && r.url) installFromUrl(r.url);
      });
    });
    Array.prototype.forEach.call($('se-body').querySelectorAll('[data-rm]'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-rm');
        if (!confirm('Remove this pack from the app? Your review history for its cards is kept, so re-installing it later resumes where you were.')) return;
        packStore.remove(id); refreshDeck(); indexNotes();
        if (filter.pack === id) filter = { pack: null, lesson: null };
        renderSettings(); renderHome();
      });
    });

    $('go-class').addEventListener('click', function () { renderClass(); show('s-class'); });
    $('se-cards').addEventListener('click', function () { renderCards(); show('s-cards'); });
    Array.prototype.forEach.call($('se-body').querySelectorAll('[data-cards]'), function (b) { b.addEventListener('click', function () { renderCards(); show('s-cards'); }); });
    $('se-account').addEventListener('click', function () { renderAccount(); show('s-account'); });
    var sc = $('se-classes'); if (sc) sc.addEventListener('click', function () { renderClasses(); show('s-classes'); });
    $('i-theme').addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      root.style.colorScheme = next;
      store.setPrefs({ theme: next });
      renderSettings();
    });
    // Export is COPY-FIRST, deliberately. A download link is inert inside the artifact viewer,
    // which never grants pages download permission; copy works on both surfaces this app runs
    // on. The file link is shown only where it can work — a framed page hides it.
    $('i-export').addEventListener('click', function () {
      // The envelope carries the installed pack versions and nothing about the learner; the
      // instructor's view uses them to answer "did my correction land" (SPEC.md B2, q4).
      // The export is the way to a new phone without an account (Settings says so), so the
      // learner's own cards travel in it, whole; a course pack does not — it is the instructor's
      // file and reinstalls from there.
      var text = store.exportAll({ packs: packStore.list().map(function (r) { return { id: r.id, version: r.version }; }), ownPack: ownPack() || undefined });
      var box = $('se-export');
      box.hidden = false;
      var ta = box.querySelector('textarea');
      ta.value = text;
      ta.focus(); ta.select();
      box.querySelector('.cnt').textContent =
        JSON.parse(text).log.length + ' reviews · ' + (text.length / 1024).toFixed(0) + ' KB';
      var copy = box.querySelector('.copybtn');
      copy.textContent = 'Copy to clipboard';
      copy.onclick = function () {
        // "Copied" only when a copy happened; otherwise the text is selected and the button says
        // so (external review, round 4).
        var done = function () { copy.textContent = 'Copied'; };
        var fallback = function () {
          ta.select();
          var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          copy.textContent = ok ? 'Copied' : 'Could not copy — the text is selected, copy it by hand';
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      };
      var a = box.querySelector('.dl');
      var framed = true;
      try { framed = window.self !== window.top; } catch (e) { framed = true; }
      if (framed) { a.hidden = true; }
      else {
        try { a.hidden = false; a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = 'kurikaeshi-history.json'; }
        catch (e) { a.hidden = true; }
      }
    });
    $('i-import').addEventListener('click', function () { $('i-file').click(); });
    $('i-file').addEventListener('change', function (ev) {
      var f = ev.target.files && ev.target.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var res = store.importAll(String(fr.result));
          var cards = '';
          try {
            var parsed = JSON.parse(String(fr.result));
            if (parsed.ownPack && parsed.ownPack.id === OWN_PACK_ID) cards = ' ' + adoptOwnPackIfNewer(parsed.ownPack, 'the file');
          } catch (e2) { cards = ' Your own cards in the file could not be read: ' + e2.message; }
          alert('Merged ' + res.added + ' new entries. ' + res.total + ' total.' + cards);
          renderHome();
        } catch (e) { alert('That file is not a Kurikaeshi export: ' + e.message); }
      };
      fr.readAsText(f);
    });
    $('i-reset').addEventListener('click', function () {
      if (SYNC_READY && account.signedIn && sync) {
        // Signed in, the server holds the same log and the next pull would bring it all back
        // (external review, round 5: "claimed destruction, actual restore"). The server copy goes first; the
        // device forgets only once the server confirmed. Own cards and classes stay.
        if (!confirm('Erase every review you have done, here AND in your account on the server? Your own cards and your classes stay. This cannot be undone, and export first if you might want it.')) return;
        var btn = $('i-reset'); busy(btn, 'Erasing…');
        sync.eraseReviews().then(function () {
          store.reset(); saveAccount({ lastSync: Date.now(), lastError: null, lastResult: null });
          renderHome(); show('s-home');
        }).catch(function (e) {
          btn.disabled = false; btn.textContent = 'Erase my progress';
          alert('Nothing was erased: the server could not be reached (' + friendlyError(e) + '). Try again online, so the erase is the same everywhere.');
        });
        return;
      }
      if (!confirm('Erase every review you have done on this device? This cannot be undone, and export first if you might want it.' +
        (SYNC_READY && account.lastSub ? ' You are signed out: what your account holds on the server stays there until you sign in and erase again.' : ''))) return;
      store.reset(); renderHome(); show('s-home');
    });
    show('s-settings');
  }
  /* ── class view — SPEC.md B2 in its file-based form; the numbers come from classview.js ── */
  // Exports loaded this visit. Held in memory only: an instructor's students' data is never
  // written to this device's storage by the app — close the screen and it is gone.
  var loadedExports = [];
  // Packs loaded on this screen only to READ the exports against — the instructor need not
  // install the course pack on her own device, and these are never written to storage
  // (external review, round 2). The deck the class is read against is installed packs plus these.
  var loadedPacks = [];
  function classDeck() {
    var installed = Object.keys(DECK.packs).map(function (k) { return DECK.packs[k]; });
    return deckFrom(installed.concat(loadedPacks));
  }
  function missingNotice(r, cd) {
    if (!r.missingPacks.length) return '';
    var names = r.missingPacks.map(function (id) {
      var vs = Object.keys(r.versions[id] || {});
      return esc(id) + (vs.length ? ' v' + esc(vs.join(', v')) : '');
    }).join('; ');
    return '<p class="status bad">These exports refer to a pack this device does not have: <b>' + names + '</b>. ' +
      'Load that pack file above — the same file you sent the class — to see items and coverage. ' +
      r.unmatchedReviews + ' review' + (r.unmatchedReviews === 1 ? '' : 's') + ' in the exports belong to it.</p>';
  }
  function renderClass() {
    var body = $('cv-body');
    var h = '';
    h += '<div class="caveat"><b>What this is.</b> ' + esc(CAVEAT) + '</div>';
    h += '<p class="note">Two loads. First the course pack — the same file you sent the class; the view needs it to name the items and it is read, not installed. ' +
         'Then the export files your students handed you. Their file names are the only labels shown — the app adds no names and keeps nothing after you leave this screen.</p>';
    h += '<button class="ghost" id="cv-addpack" type="button">Load the course pack…</button>' +
         '<input type="file" id="cv-packfiles" accept="application/json,.json" multiple hidden>' +
         (loadedPacks.length ? '<p class="note">Pack' + (loadedPacks.length === 1 ? '' : 's') + ' loaded for reading: ' + loadedPacks.map(function (p) { return esc(p.title) + ' v' + esc(p.version); }).join('; ') + '.</p>' : '') +
         '<button class="ghost" id="cv-add" type="button">Load export files…</button>' +
         '<input type="file" id="cv-files" accept="application/json,.json" multiple hidden>' +
         '<div id="cv-status" class="status" hidden></div>';
    if (loadedExports.length) {
      var cd = classDeck();
      h += '<p class="note">' + loadedExports.length + ' export' + (loadedExports.length === 1 ? '' : 's') + ' loaded: ' +
           loadedExports.map(function (e) { return esc(e.label); }).join(', ') + '.</p>' +
           '<button class="ghost small" id="cv-clear" type="button">Clear</button>';
      var r = summarizeClass(loadedExports, cd, { now: Date.now(), leechThreshold: store.prefs.leechThreshold });
      h += missingNotice(r, cd);

      // 1. Which items is the class failing?
      h += '<h2 class="sec">1 · Which items is the class failing?</h2>' +
           '<p class="note">Ranked by how often it was wrong on first sight, then how often it keeps being forgotten. Only items at least one student has seen.</p>';
      var top = r.items.filter(function (it) { return it.nStudents > 0; }).slice(0, 25);
      if (!top.length) h += '<p class="note">' + (r.missingPacks.length ? 'Items cannot be named until the pack above is loaded.' : 'No item has been reviewed by anyone yet.') + '</p>';
      else {
        h += '<div class="cv-wrap"><table class="cv-table cv-items"><thead><tr><th>Item</th><th>Lesson</th><th>Seen by</th><th>Wrong first</th><th>Lapses</th><th>Leech</th></tr></thead><tbody>';
        top.forEach(function (it) {
          var nt = cd.noteTypes[it.pack + '/' + it.type] || { fields: [] };   // the reading deck, not the installed one
          var promptField = (nt.templates && nt.templates[it.ord] && nt.templates[it.ord].prompt) || nt.fields[0];
          var lang = (cd.packs[it.pack] || {}).language || '';
          var face = it.fields[promptField] != null ? it.fields[promptField] : it.guid;
          h += '<tr><td' + (lang ? ' lang="' + esc(lang) + '"' : '') + '>' + esc(face) + '</td>' +
               '<td>' + esc(it.lesson || '—') + '</td>' +
               '<td class="n">' + it.nStudents + '</td>' +
               '<td class="n' + (it.firstAgainRate >= 0.5 ? ' bad' : (it.firstAgainRate > 0 ? ' warn' : '')) + '">' + Math.round(it.firstAgainRate * 100) + '%</td>' +
               '<td class="n">' + it.meanLapses.toFixed(1) + '</td>' +
               '<td class="n' + (it.pctLeech > 0 ? ' warn' : '') + '">' + Math.round(it.pctLeech * 100) + '%</td></tr>';
        });
        h += '</tbody></table></div>';
      }

      // 2. Pace — coverage per lesson as a distribution, never a mean
      h += '<h2 class="sec">2 · Is the class on pace?</h2>' +
           '<p class="note">For each lesson, how many students have seen none, some, most, or all of its cards. A distribution, because an average hides the half of the room that has not started.</p>' +
           '<div class="legend"><i class="b0" style="background:var(--again)"></i>none <i style="background:var(--hard)"></i>under half <i style="background:var(--indigo)"></i>most <i style="background:var(--easy)"></i>all</div>';
      h += '<div class="cv-wrap"><table class="cv-table"><thead><tr><th>Lesson</th><th>Cards</th><th style="width:45%">Students</th><th>All</th></tr></thead><tbody>';
      var lastPack = null;
      r.coverage.forEach(function (c) {
        var n = c.students || 1, b = c.buckets;
        // One header row per pack; the lesson cell carries only the lesson. The title in
        // every row wrapped to five lines at phone width and buried the numbers.
        if (c.pack !== lastPack) { h += '<tr class="grp"><td colspan="4">' + esc((cd.packs[c.pack] || {}).title || c.pack) + '</td></tr>'; lastPack = c.pack; }
        h += '<tr><td>' + esc(c.lesson || '—') + '</td>' +
             '<td class="n">' + c.cards + '</td>' +
             '<td><span class="bkt"><i class="b0" style="width:' + (b.none / n * 100) + '%"></i><i class="b1" style="width:' + (b.some / n * 100) + '%"></i><i class="b2" style="width:' + (b.most / n * 100) + '%"></i><i class="b3" style="width:' + (b.all / n * 100) + '%"></i></span></td>' +
             '<td class="n">' + b.all + '/' + c.students + '</td></tr>';
      });
      h += '</tbody></table></div>';

      // 3. Who is not studying — coarse on purpose (§8.3)
      h += '<h2 class="sec">3 · Who has stopped?</h2>' +
           '<p class="note">Days active and reviews in the last seven days, and the date each export last shows activity. Dates, not times — nobody needs to know who studied at 2 a.m.</p>';
      // Four columns, so the verdict — stopped, and for how long — is on screen at phone
      // width instead of behind a scrollbar. It rides the last-active date, coloured.
      h += '<div class="cv-wrap"><table class="cv-table"><thead><tr><th>Export</th><th>Reviews<br>7 d / all</th><th>Days active<br>of 7</th><th>Last active</th></tr></thead><tbody>';
      r.studentsList.slice().sort(function (a, b) { return (b.stoppedDays == null ? 9999 : b.stoppedDays) - (a.stoppedDays == null ? 9999 : a.stoppedDays); }).forEach(function (s) {
        var stopped = s.stoppedDays == null ? 'never started' : (s.stoppedDays === 0 ? 'today' : s.stoppedDays + ' d ago');
        var cls = s.stoppedDays == null || s.stoppedDays >= 7 ? ' bad' : (s.stoppedDays >= 3 ? ' warn' : '');
        h += '<tr><td>' + esc(s.label) + '</td><td class="n">' + s.reviews7d + ' / ' + s.reviews + '</td><td class="n">' + s.daysActive7d + '</td>' +
             '<td class="n' + cls + '">' + (s.lastActiveOn ? esc(s.lastActiveOn) + '<br>' : '') + stopped + '</td></tr>';
      });
      h += '</tbody></table></div>';

      // 4. Versions
      h += '<h2 class="sec">4 · Did my correction land?</h2>' +
           '<p class="note">Which version of each pack every export was made from. A student on an old version has not received your fix.</p>';
      var vk = Object.keys(r.versions);
      // The reason differs by where the exports came from (external review, round 7): a record
      // synced through an account carries no pack version at all; a file export from the current
      // app does, and only an older app's file lacks it.
      if (!vk.length) h += '<p class="note">No pack version is recorded in these reviews: an older app made them, or they were synced before each review carried its pack version.</p>';
      else {
        h += '<div class="cv-wrap"><table class="cv-table"><thead><tr><th>Pack</th><th>Version</th><th>Students</th></tr></thead><tbody>';
        vk.forEach(function (id) {
          var title = (cd.packs[id] || {}).title || id, mine = (cd.packs[id] || {}).version;
          Object.keys(r.versions[id]).sort().forEach(function (v) {
            h += '<tr><td>' + esc(title) + '</td><td class="n' + (mine && v !== mine ? ' warn' : '') + '">' + esc(v) + (mine && v !== mine ? ' (yours: ' + esc(mine) + ')' : '') + '</td><td class="n">' + r.versions[id][v] + '</td></tr>';
          });
        });
        h += '</tbody></table></div>';
      }
      h += '<button class="ghost" id="cv-copy" type="button">Copy this report as JSON</button>';
    }
    body.innerHTML = h;

    $('cv-addpack').addEventListener('click', function () { $('cv-packfiles').click(); });
    $('cv-packfiles').addEventListener('change', function (ev) {
      var files = Array.prototype.slice.call(ev.target.files || []);
      if (!files.length) return;
      var pending = files.length, errors = [];
      files.forEach(function (f) {
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var obj = JSON.parse(String(fr.result));
            var v = validatePack(obj);
            if (v !== true) throw new Error(Array.isArray(v) ? v.join('; ') : String(v));
            loadedPacks = loadedPacks.filter(function (p) { return p.id !== obj.id; }).concat([obj]);
          } catch (e) { errors.push(f.name + ': ' + e.message); }
          if (--pending === 0) {
            renderClass();
            var st2 = $('cv-status');
            if (errors.length) { st2.hidden = false; st2.className = 'status bad'; st2.textContent = 'Not a pack — ' + errors.join(' · '); }
          }
        };
        fr.readAsText(f);
      });
    });
    $('cv-add').addEventListener('click', function () { $('cv-files').click(); });
    $('cv-files').addEventListener('change', function (ev) {
      var files = Array.prototype.slice.call(ev.target.files || []);
      if (!files.length) return;
      var st = $('cv-status'); st.hidden = false; st.className = 'status'; st.textContent = 'Reading ' + files.length + ' file' + (files.length === 1 ? '' : 's') + '…';
      var pending = files.length, errors = [];
      files.forEach(function (f) {
        var fr = new FileReader();
        fr.onload = function () {
          try { loadedExports.push(readExport(String(fr.result), f.name)); }
          catch (e) { errors.push(f.name + ': ' + e.message); }
          if (--pending === 0) {
            renderClass();
            var st2 = $('cv-status');
            if (errors.length) { st2.hidden = false; st2.className = 'status bad'; st2.textContent = 'Skipped — ' + errors.join(' · '); }

        h += enr.length ? enr.map(function (e) {
          var u = esc(e.user_id);
          var acts = e.status === 'pending' ? '<button class="ghost small" data-set="active" data-u="' + u + '" type="button">Approve</button><button class="ghost small" data-set="removed" data-u="' + u + '" type="button">Decline</button>'
            : e.status === 'active' ? '<button class="ghost small" data-set="removed" data-u="' + u + '" type="button">Remove</button>'
            : '';   // removed or left: final — only the student rejoining with the code, a new consent, reopens it
          return '<div class="packrow"><div class="t">' + esc(e.label || 'unnamed') + '</div><div class="m">' + esc(e.status) +
            (e.status === 'removed' ? ' · to share again, they rejoin with the code' : e.status === 'left' ? ' · they left; sharing closed' : '') +
            (e.consented_at ? ' · agreed to share ' + esc(String(e.consented_at).slice(0, 10)) : '') + '</div><div class="acts">' + acts + '</div></div>';
        }).join('') : '<p class="note">Nobody has joined yet.</p>';
        h += '<h2 class="sec">How is the class doing?</h2>' +
          '<p class="note">Reads what approved students chose to share — their reviews of this class’s packs — and answers the four questions. Nothing is kept on this device after you leave the view.</p>' +
          '<button class="primary" id="cd-report" type="button">Open the class view</button>';
      } else {
        var mine = enr.filter(function (e) { return e.user_id === account.sub; })[0];
        h += '<p class="note">' + (mine ? statusWords(mine.status) : 'You are not on this roster.') + '</p>';
        h += '<h2 class="sec">Packs for this class</h2>';
        h += packs.length ? packs.map(function (p) {
          var local = packStore.get(p.pack_id);
          var state = !local ? 'install' : compareVersions(p.version, local.version) > 0 ? 'update' : 'current';
          return '<div class="packrow"><div class="t">' + esc(p.pack.title) + '</div><div class="m">v' + esc(p.version) + ' · ' + (p.pack.notes || []).length + ' notes' +
            (state === 'current' ? ' · installed' : local ? ' · you have v' + esc(local.version) : '') + '</div>' +
            (state === 'current' ? '' : '<button class="ghost small" type="button" data-inst="' + esc(p.pack_id) + '">' + (state === 'install' ? 'Install' : 'Update') + '</button>') + '</div>';
        }).join('') : '<p class="note">Your instructor has not published a pack yet.</p>';
        if (mine && (mine.status === 'pending' || mine.status === 'active')) {
          h += '<h2 class="sec">Leave</h2><p class="note">Leaving closes your instructor’s view of your reviews, including what was shared before; a report they already saved stays theirs. Your progress stays yours.</p>' +
            '<button class="danger" id="cd-leave" type="button">Leave this class</button>';
        }
      }
      h += '<div id="cl-status" class="status" hidden></div><button class="ghost" id="cd-back" type="button">All classes</button>';
      body.innerHTML = h;
      var fail = function (e) { setStatus('cl-status', friendlyError(e), true); };
      $('cd-back').addEventListener('click', function () { classesView.open = null; renderClasses(); });
      var cp = $('cd-copylink'); if (cp) cp.addEventListener('click', function () {
        var done = function () { cp.textContent = 'Copied'; }, failed = function () { cp.textContent = 'Could not copy — select the link above'; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(joinLink(c)).then(done, failed); else failed();
      });
      var rs = $('cd-reset'); if (rs) rs.addEventListener('click', function () {
        if (!confirm('Retire the current code and make a new one?')) return;
        sync.resetClassCode(c.id).then(function (code) {
          c.code = typeof code === 'string' ? code : (code && (code.code || code.reset_class_code)) || c.code; renderClassDetail(c);
        }).catch(fail);
      });
      var pb = $('cd-publish'); if (pb) pb.addEventListener('click', function () {
        var pack = packStore.get($('cd-pick').value); if (!pack) return;
        busy(pb, 'Publishing…');
        sync.publishClassPack(c.id, pack).then(function () { renderClassDetail(c); })
          .catch(function (e) { fail(e); pb.disabled = false; pb.textContent = 'Publish the selected pack to this class'; });
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-set]'), function (btn) {
        btn.addEventListener('click', function () {
          var to = btn.getAttribute('data-set');
          if (to === 'removed' && !confirm('Remove this student? Sharing closes now, including what was shared before. You cannot let them back in; they can rejoin with the code.')) return;
          busy(btn, '…');
          sync.setEnrollment(c.id, btn.getAttribute('data-u'), to).then(function (n) {
            if (!n) setStatus('cl-status', 'The roster did not change: the row may already have moved on (a removed or departed student rejoins with the code).', true);
            renderClassDetail(c);
          }).catch(fail);
        });
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-inst]'), function (btn) {
        btn.addEventListener('click', function () {
          var p = packs.filter(function (x) { return x.pack_id === btn.getAttribute('data-inst'); })[0]; if (!p) return;
          var res = installPackObject(p.pack, {});
          renderHome(); if (res.ok) renderClassDetail(c); else setStatus('cl-status', res.msg, true);
        });
      });
      var lv = $('cd-leave'); if (lv) lv.addEventListener('click', function () {
        if (!confirm('Leave ' + c.title + '? Your instructor’s view of your reviews closes.')) return;
        sync.leaveClass(c.id).then(function (n) {
          // The server answers with the rows it changed; zero rows is not a leaving (external review, round 8).
          if (!n) throw new Error('The class did not record your leaving; nothing changed. Try again, or check the roster status above.');
          classesView.open = null; classesView.msg = 'You left ' + c.title + '.'; renderClasses();
        }).catch(fail);
      });
      var rp = $('cd-report'); if (rp) rp.addEventListener('click', function () {
        busy(rp, 'Reading…');
        var packIds = {}; packs.forEach(function (p) { packIds[p.pack_id] = true; });
        var active = {}; enr.forEach(function (e) { if (e.status === 'active') active[e.user_id] = e.label || 'student'; });
        sync.classReviews(null).then(function (rows) {
          // The policy already limits rows to this instructor's active students and class packs;
          // this narrows them to ONE class, since an instructor may teach several.
          var byUser = {};
          rows.forEach(function (r) {
            var pid = String(r.card).split('/')[0];
            if (!active[r.user_id] || !packIds[pid]) return;
            (byUser[r.user_id] = byUser[r.user_id] || []).push(rowToEntry(r));
          });
          var exports = Object.keys(byUser).map(function (uid) {
            return readExport(JSON.stringify({ format: 'bw08-review-log', version: 1, packs: packsFromEntries(byUser[uid]), log: byUser[uid] }), active[uid] + ' · ' + uid.slice(-4));
          });
          if (!exports.length) { setStatus('cl-status', 'Nothing to read yet: no approved student has synced a review of this class’s packs.', false); rp.disabled = false; rp.textContent = 'Open the class view'; return; }
          loadedExports = exports;
          loadedPacks = packs.map(function (p) { return p.pack; });
          renderClass(); show('s-class');
        }).catch(function (e) { fail(e); rp.disabled = false; rp.textContent = 'Open the class view'; });
      });
    }).catch(function (e) {
      body.innerHTML = '<div class="status bad">' + esc(friendlyError(e)) + '</div><button class="ghost" id="cd-back" type="button">All classes</button>';
      $('cd-back').addEventListener('click', function () { classesView.open = null; renderClasses(); });
    });
  }

  /* ── wiring ────────────────────────────────────────────────────── */
  $('start').addEventListener('click', startSession);
  $('go-stats').addEventListener('click', renderStats);
  $('go-settings').addEventListener('click', renderSettings);
  $('st-back').addEventListener('click', function () { renderHome(); show('s-home'); });
  $('se-back').addEventListener('click', function () { renderHome(); show('s-home'); });
  $('mc-back').addEventListener('click', function () {
    var ed = cardsView.editing; cardsView.importing = null;
    if (ed && ed.back === 'review' && session) { leaveEditor(ed, false); return; }
    cardsView.editing = null; renderHome(); show('s-home');
  });
  $('r-edit').addEventListener('click', function () {
    if (!current) return;
    cardsView.editing = { guid: current.guid, back: 'review' }; renderCards(); show('s-cards');
  });
  $('mc-add').addEventListener('click', function () { cardsView.editing = { guid: null }; renderCards(); });
  $('h-mycards').addEventListener('click', function () { renderCards(); show('s-cards'); });
  $('ac-back').addEventListener('click', function () { renderSettings(); });
  $('cl-back').addEventListener('click', function () {
    if (classesView.join || classesView.create || classesView.open) { classesView.join = null; classesView.create = false; classesView.open = null; renderClasses(); return; }
    renderSettings();
  });
  // Leaving the class view forgets the loaded exports: they are someone else's data.
  $('cv-back').addEventListener('click', function () { loadedExports = []; loadedPacks = []; renderSettings(); });
  $('r-back').addEventListener('click', finish);
  $('d-home').addEventListener('click', function () { renderHome(); show('s-home'); });
  $('d-more').addEventListener('click', function () {
    // Studying ahead is allowed but never suggested as the default: the empty queue is the
    // success state, and an app that cannot let you leave has substituted engagement for
    // learning (SPEC.md 7.9). Same queue rules — siblings still deduped.
    var b = queueFor(filter, 10);
    if (!b.queue.length) return;
    session = { queue: b.queue, done: 0, total: b.queue.length };
    show('s-review'); nextCard();
  });
  $('r-undo').addEventListener('click', function () {
    if (!session || !(session.answered > 0)) return;
    var e = store.undoLast();
    if (!e) return;
    session.answered--;
    if (session.done > 0) session.done--;
    var card = DECK.cards.filter(function (c) { return c.id === e.c; })[0];
    if (card && session) {
      // An Again pushes its card to the END of the queue; undoing that answer must remove the
      // pushed copy, or the card appears twice.
      session.queue = session.queue.filter(function (c) { return c.id !== card.id; });
      session.queue.unshift(card);
    }
    nextCard();
  });

  // Keyboard, for anyone reviewing at a desk: space reveals, 1-4 grade.
  document.addEventListener('keydown', function (ev) {
    if ($('s-review').hidden) return;
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); if (!revealed) reveal(); return; }
    if (revealed && ev.key >= '1' && ev.key <= '4') { ev.preventDefault(); answer(parseInt(ev.key, 10)); }
  });

  renderHome();
  show('s-home');
  bootAccount();   // no-op unless config.json is filled in AND the learner signed in before, or is coming back from the sign-in page
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  // A new service worker takes over (skipWaiting + claim in sw.js) while the OLD page is still
  // on screen; without this a returning visitor saw the previous version until a second load.
  // The reload waits for a moment between cards, never during a review; the first-ever install
  // (no controller before) reloads nothing.
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || window.__kurikaeshiReloaded) return;
    window.__kurikaeshiReloaded = true;
    var busy = function () { var r = document.getElementById('s-review'); return !!r && !r.hidden; };
    if (!busy()) { location.reload(); return; }
    var t = setInterval(function () { if (!busy()) { clearInterval(t); location.reload(); } }, 2000);
  });
  addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
  });
}
</script>
