      return entry;
    },

    // SPEC.md 7.2: an undo that reaches the last answer, always, one tap, no confirm. A
    // mis-tap is a corrupted review and it must be removable, so this is the single
    // deliberate exception to append-only. It removes exactly one entry, the newest.
    undoLast() {
      if (log.length === 0) return null;
      const e = log.pop();
      const a = byCard.get(e.c);
      if (a) { const i = a.lastIndexOf(e); if (i >= 0) a.splice(i, 1); }
      persist();
      return e;
    },

    countsToday(now = Date.now()) {
      const k = dayKey(now);
      let reviews = 0, newCards = 0, ms = 0;
      const seenNew = new Set();
      for (const e of log) {
        if (dayKey(e.t) !== k) continue;
        reviews++;
        ms += e.e || 0;
        if (e.k === KINDS.learn && !seenNew.has(e.c)) { seenNew.add(e.c); newCards++; }
      }
      return { reviews, newCards, ms };
    },

    // MC-68's formula, and its honesty requirement: BOTH denominators are measured, never
    // assumed. Until there is enough history the seeds are used and are LABELLED as seeds —
    // the earlier version of that method card shipped an invented constant as a fact and was
    // wrong by a wide margin.
    intakeBudget(now = Date.now()) {
      const secondsPerCard = this.measuredSecondsPerCard();
      const ratio = this.measuredReviewsPerNewCard();
      const seconds = prefs.minutesPerDay * 60;
      const perDay = Math.max(1, Math.round(seconds / (secondsPerCard.value * ratio.value)));
      return { perDay, secondsPerCard, ratio };
    },

    measuredSecondsPerCard() {
      const times = log.map((e) => e.e).filter((v) => typeof v === 'number' && v > 500 && v < 120000);
      if (times.length < 30) return { value: 10, measured: false, n: times.length };
      times.sort((a, b) => a - b);
      return { value: times[Math.floor(times.length / 2)] / 1000, measured: true, n: times.length };
    },

    measuredReviewsPerNewCard() {
      // The Anki manual's 20-new -> ~200-reviews rule of thumb is a stated-without-derivation
      // figure from the SM-2 era, and the manual publishes no FSRS equivalent. It is the seed
      // and nothing more; the learner's own ratio replaces it as soon as there is one.
      const introduced = new Set(log.filter((e) => e.k === KINDS.learn).map((e) => e.c)).size;
      if (introduced < 20 || log.length < 100) return { value: 10, measured: false, n: introduced };
      return { value: Math.max(1, log.length / introduced), measured: true, n: introduced };
    },

    trueRetention() {
      // Only review-state answers count. Grading a card during learning says nothing about
      // whether the schedule is working, and folding it in flatters the number.
      let seen = 0, kept = 0;
      for (const entries of byCard.values()) {
        let prev = 'new';
        for (const e of entries) {
          if (prev === 'review') { seen++; if (e.g > 1) kept++; }
          prev = e.g === 1 ? 'relearning' : (e.i >= 1 ? 'review' : 'learning');
        }
      }
      return { seen, kept, rate: seen ? kept / seen : null };
    },

    exportAll(extra = {}) {
      // SPEC.md 8.4: the learner can take everything, on demand, in a documented open format,
      // with no request queue. It is their history. `extra` lets the app add what the store
      // does not own — the installed pack versions — so an instructor's view can answer "which
      // version is each student on" (SPEC.md B2, question 4). The envelope carries no name and
      // no identifier of the learner; whoever receives it labels it.
      return JSON.stringify({ format: 'bw08-review-log', version: 1, exported: new Date().toISOString(), ...extra, prefs, log }, null, 1);
    },

    importAll(text) {
      const parsed = JSON.parse(text);
      if (parsed.format !== 'bw08-review-log' || !Array.isArray(parsed.log)) throw new Error('not a BW-08 export');
      // A file is untrusted input. Every entry must have the shape the fold expects, or one
      // malformed row corrupts every derived state that follows it. The id check is the
      // STRUCTURAL contract only — `note#ord`, which burying splits on — not this deck's naming
      // scheme; the store is deck-agnostic and will hold other decks.
      const valid = (e) => e && typeof e.c === 'string' && /^[^#\s]+#\d+$/.test(e.c)
        && Number.isFinite(e.t) && Number.isInteger(e.g) && e.g >= 1 && e.g <= 4
        && Number.isFinite(e.i) && Number.isFinite(e.u);
      const rejected = parsed.log.filter((e) => !valid(e)).length;
      if (rejected) throw new Error(`${rejected} entries are malformed — nothing was imported`);
      // Union by (card, timestamp): re-importing the same file twice is a no-op, which is the
      // idempotency SPEC.md 5.4 gives the client-generated id. Merge, never overwrite.
      const key = (e) => `${e.c}|${e.t}`;
      const have = new Set(log.map(key));
      let added = 0;
      for (const e of parsed.log) if (!have.has(key(e))) { log.push(e); have.add(key(e)); added++; }
      log.sort((a, b) => a.t - b.t);
      persist(); index();
      return { added, total: log.length };
    },

    suspend(ids) { for (const id of ids) suspended.add(id); persistSuspended(); },
    unsuspend(ids) { for (const id of ids) suspended.delete(id); persistSuspended(); },
    isSuspended(id) { return suspended.has(id); },
    get suspendedCount() { return suspended.size; },

    reset() { log = []; byCard.clear(); suspended = new Set(); persist(); persistSuspended(); },
    get log() { return log; },
    KINDS,
    dayKey,
  };
}


// packs.js — packs as first-class objects. NO DOM, NO browser globals.
//
// SPEC.md B1: a pack is versioned, licensed, instructor-owned, and updates without costing the
// learner their history (§4.5). This module owns the format check, the derivation of cards
// from notes × templates (A1 — cards are never shipped), the install/update merge, and the
// registry of what is installed. Transport is injected: today a file or a URL; later the
// class server's pack endpoint, with this file unchanged.

const FORMAT = 'kurikaeshi-pack';
// The name the format carried before 0.3.0, when the app was still called Kanji Queue. Files
// written under it install unchanged — a rename must never orphan a pack a student already has.
const FORMAT_LEGACY = 'kanji-queue-pack';
const FORMAT_VERSION = 1;
const PACKS_KEY = 'bw08.packs.v1';

// One to sixty-four characters. A one-character id is legitimate; the first version demanded
// two and the class-view fixtures found it.
const ID_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
const SEMVER_RE = /^\d+\.\d+\.\d+$/;

// What a field can be, to a renderer that does not know the subject:
//   glyph     one large symbol or short token — a kanji, a formula, a musical interval
//   headline  the main answer, large text
//   text      ordinary prose
//   also      secondary, small and muted (other meanings, a note)
//   chip      a short labelled value, several per line (readings, units, parts of speech)
//   meta      the smallest line (stroke count, source, date)
//   hidden    stored on the note, never shown on a card (an id, a sort key)
//   hint      shown WITH THE PROMPT, before the answer is revealed (a cue the learner wrote)
const DISPLAY_ROLES = ['glyph', 'headline', 'text', 'also', 'chip', 'meta', 'hint', 'hidden'];

/** Throws with a plain reason if the object is not a pack this app can hold. */
function validatePack(p) {
  const bad = (m) => { throw new Error(`not a usable pack: ${m}`); };
  if (!p || typeof p !== 'object') bad('not an object');
  if (p.format !== FORMAT && p.format !== FORMAT_LEGACY) bad(`format is "${p.format}", expected "${FORMAT}"`);
  if (!Number.isInteger(p.formatVersion) || p.formatVersion > FORMAT_VERSION) bad(`formatVersion ${p.formatVersion} is newer than this app understands (${FORMAT_VERSION})`);
  if (typeof p.id !== 'string' || !ID_RE.test(p.id)) bad('id must be lowercase letters, digits and hyphens');
  if (typeof p.version !== 'string' || !SEMVER_RE.test(p.version)) bad('version must be semver like 1.2.0');
  if (typeof p.title !== 'string' || !p.title.trim()) bad('title is required');
  if (!Array.isArray(p.noteTypes) || !p.noteTypes.length) bad('noteTypes must be a non-empty array');
  if (!Array.isArray(p.notes) || !p.notes.length) bad('notes must be a non-empty array');
  const types = new Map();
  for (const t of p.noteTypes) {
    if (!t || typeof t.id !== 'string' || !Array.isArray(t.fields) || !Array.isArray(t.templates) || !t.templates.length) bad(`noteType "${t && t.id}" needs id, fields[], templates[]`);
    for (const tp of t.templates) {
      if (!Number.isInteger(tp.ord) || typeof tp.prompt !== 'string' || typeof tp.answer !== 'string') bad(`template in "${t.id}" needs ord, prompt, answer`);
      if (!t.fields.includes(tp.prompt) || !t.fields.includes(tp.answer)) bad(`template ${tp.ord} in "${t.id}" names a field the type does not have`);
    }
    // Display hints are how a pack tells a subject-agnostic renderer what each field IS. The
    // app knows nothing about kanji; the Japanese pack says "character is the glyph, meaning is
    // the headline, on and kun are chips". A chemistry pack says something else. Optional; an
    // unhinted field renders as plain text.
    if (t.kind != null && t.kind !== 'cloze') bad(`noteType "${t.id}" has unknown kind "${t.kind}"`);
    if (t.display != null) {
      if (typeof t.display !== 'object') bad(`display in "${t.id}" must be an object of field → role`);
      for (const [f, role] of Object.entries(t.display)) {
        if (!t.fields.includes(f)) bad(`display in "${t.id}" names unknown field "${f}"`);
        if (!DISPLAY_ROLES.includes(role)) bad(`display role "${role}" for "${f}" is not one of ${DISPLAY_ROLES.join(', ')}`);
      }
    }
    if (t.labels != null) {
      if (typeof t.labels !== 'object') bad(`labels in "${t.id}" must be an object of field → label`);
      for (const f of Object.keys(t.labels)) if (!t.fields.includes(f)) bad(`labels in "${t.id}" names unknown field "${f}"`);
    }
    types.set(t.id, t);
  }
  const guids = new Set();
  for (const n of p.notes) {
    if (!n || typeof n.guid !== 'string' || !n.guid || /[\s#/]/.test(n.guid)) bad('every note needs a guid without spaces, "#" or "/"');
    if (guids.has(n.guid)) bad(`duplicate guid ${n.guid}`);
    guids.add(n.guid);
    if (!types.has(n.type)) bad(`note ${n.guid} has unknown type "${n.type}"`);
    if (!n.fields || typeof n.fields !== 'object') bad(`note ${n.guid} has no fields`);
  }
  if (p.milestones) {
    if (!Array.isArray(p.milestones)) bad('milestones must be an array');
    for (const m of p.milestones) if (!m || typeof m.id !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(m.due || '')) bad('every milestone needs an id and an ISO due date');
  }
  return true;
}

function compareVersions(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) < (pb[i] || 0) ? -1 : 1; }
  return 0;
}

const cardId = (packId, guid, ord) => `${packId}/${guid}#${ord}`;

// Cloze deletion, in Anki's own syntax (docs.ankiweb.net/editing.html#cloze-deletion): a blank
// is written {{c1::text}} or {{c1::text::hint}}; every distinct number makes one card. Anki's
// manual points at Wozniak's twenty rules (rule 5) for why a learner would want this. A note
// type declares kind: 'cloze' and its one template's prompt names the field the blanks live in.
const CLOZE_RE = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
function clozeOrds(text) {
  const ords = new Set();
  for (const m of String(text || '').matchAll(CLOZE_RE)) ords.add(parseInt(m[1], 10));
  return [...ords].sort((a, b) => a - b);
}
/** The text as segments for a renderer: { text } for plain runs, { text, cloze, hint } for a blank. */
function clozeSegments(text) {
  const out = [];
  let last = 0;
  const s = String(text || '');
  for (const m of s.matchAll(CLOZE_RE)) {
    if (m.index > last) out.push({ text: s.slice(last, m.index) });
    out.push({ text: m[2], cloze: parseInt(m[1], 10), hint: m[3] || '' });
    last = m.index + m[0].length;
  }
  if (last < s.length) out.push({ text: s.slice(last) });
  return out;
}
/** The text with every blank filled — what a list or a search shows. */
function clozeFilled(text) { return String(text || '').replace(CLOZE_RE, '$2'); }

/** Cards = notes × templates. Derived, never stored in a pack. Deck path is
 *  `<pack title>::<lesson>::<type>` so Anki's `::` nesting (A3) still reads right. */
function deriveCards(pack) {
  const byType = new Map(pack.noteTypes.map((t) => [t.id, t]));
  const cards = [];
  for (const n of pack.notes) {
    const t = byType.get(n.type);
    if (t.kind === 'cloze') {
      // One card per blank; the card's ord IS the blank's number, so adding a blank later
      // adds a card and leaves the others' history where it was.
      for (const ord of clozeOrds(n.fields[t.templates[0].prompt])) {
        cards.push({ id: cardId(pack.id, n.guid, ord), pack: pack.id, guid: n.guid, ord,
                     lesson: n.lesson || '', deck: `${pack.id}::${n.lesson || '—'}::${n.type}` });
      }
      continue;
    }
    for (const tp of t.templates) {
      cards.push({ id: cardId(pack.id, n.guid, tp.ord), pack: pack.id, guid: n.guid, ord: tp.ord,
                   lesson: n.lesson || '', deck: `${pack.id}::${n.lesson || '—'}::${n.type}` });
    }
  }
  return cards;
}

/**
 * The §4.5 merge, as data: given the installed pack and a candidate, say what an update would
 * do. Pure, so the UI can show it BEFORE applying and the tests can assert it.
 *   { apply: bool, reason, changed, added, removed, suspend: [cardId], unsuspend: [cardId] }
 */
function planUpdate(installed, candidate) {
  validatePack(candidate);
  if (!installed) return { apply: true, reason: 'install', changed: 0, added: candidate.notes.length, removed: 0, suspend: [], unsuspend: deriveCards(candidate).map((c) => c.id) };
  if (installed.id !== candidate.id) return { apply: false, reason: 'different pack id — installs beside, does not replace', changed: 0, added: 0, removed: 0, suspend: [], unsuspend: [] };
  if (compareVersions(candidate.version, installed.version) <= 0) return { apply: false, reason: `installed ${installed.version} is not older than ${candidate.version}`, changed: 0, added: 0, removed: 0, suspend: [], unsuspend: [] };

  const oldCards = new Set(deriveCards(installed).map((c) => c.id));
  const newCards = new Set(deriveCards(candidate).map((c) => c.id));
  const oldNotes = new Map(installed.notes.map((n) => [n.guid, n]));
  let changed = 0, added = 0, removed = 0;
  for (const n of candidate.notes) {
    const o = oldNotes.get(n.guid);
    if (!o) { added++; continue; }
    if (JSON.stringify(o.fields) !== JSON.stringify(n.fields) || o.type !== n.type) changed++;
  }
  const newGuids = new Set(candidate.notes.map((n) => n.guid));
  for (const g of oldNotes.keys()) if (!newGuids.has(g)) removed++;

  // Cards that exist now and not after: suspend — history kept, never deleted (A9, §4.5).
  // Cards that exist after and not now (new notes, new templates, or a returning guid): make
  // sure they are NOT suspended, so a note that comes back comes back with its history.
  const suspend = [...oldCards].filter((id) => !newCards.has(id));
  const unsuspend = [...newCards].filter((id) => !oldCards.has(id));
  return { apply: true, reason: 'update', changed, added, removed, suspend, unsuspend };
}

/** Registry + data, behind the same adapter the store uses. */
function makePackStore(adapter) {
  let state = { installed: [], data: {} };
  const persist = () => adapter.set(PACKS_KEY, JSON.stringify(state));

  return {
    load() {
      try { const raw = adapter.get(PACKS_KEY); if (raw) state = JSON.parse(raw); } catch { state = { installed: [], data: {} }; }
      if (!state || !Array.isArray(state.installed) || typeof state.data !== 'object') state = { installed: [], data: {} };
    },
    list() { return state.installed.slice(); },
    get(id) { return state.data[id] || null; },
    has(id) { return !!state.data[id]; },

    /** Install or update. Returns the plan that was applied (with suspend/unsuspend lists for
     *  the caller to hand to the review store). Throws on an unusable pack. */
    install(pack, meta = {}) {
      const plan = planUpdate(this.get(pack.id), pack);
      if (!plan.apply) return plan;
      const now = meta.now || Date.now();
      const row = state.installed.find((r) => r.id === pack.id);
      const entry = { id: pack.id, version: pack.version, title: pack.title, url: pack.url || meta.url || null,
                      installedAt: row ? row.installedAt : now, updatedAt: now, language: pack.language || null };
      if (row) Object.assign(row, entry); else state.installed.push(entry);
      state.data[pack.id] = pack;
      persist();
      return plan;
    },

    remove(id) {
      state.installed = state.installed.filter((r) => r.id !== id);
      delete state.data[id];
      persist();
    },

    /** Everything the queue needs, across all installed packs: notes with their pack, cards. */
    deck() { return deckFrom(state.installed.map((r) => state.data[r.id])); },
  };
}

// A deck from any list of packs: the installed ones, or packs loaded only to read a class's
// exports against — which an instructor may never want installed on her own device, and which
// are never written to storage (external review, round 2: a class view joined against the reading
// device's installed packs read a full class as "nothing reviewed yet").
function deckFrom(packs) {
  const notes = [], cards = [], noteTypes = {}, out = {};
  for (const p of packs) {
    if (!p) continue;
    out[p.id] = p;
    for (const t of p.noteTypes) noteTypes[`${p.id}/${t.id}`] = t;
    for (const n of p.notes) notes.push({ ...n, pack: p.id, packGuid: `${p.id}/${n.guid}` });
    for (const c of deriveCards(p)) cards.push(c);
  }
  return { notes, cards, noteTypes, packs: out };
}


// queue.js — what to show today, and in what order. NO DOM, NO browser globals.
//
// Extracted from the page on the review pass because it is engine, not view: the daily
// limits, the review-limit-caps-new-cards brake, sibling burying and the intake spread are
// rules a learner is scheduled by, and rules that live only inside a UI file are rules nobody
// tests. This is the third module that survives a move to React Native, beside fsrs.js and
// store.js.
//
// Every rule here names where it comes from. The one that matters most is A6: Anki's manual,
// quoted in SPEC.md, says "By default, the review limit also applies to new cards, and no new
// cards will be shown when the review limit has been reached." That is the only automatic
// brake on runaway load, and it is enforced here, not documented.

/**
 * @param deck   { cards:[{id,guid,ord,deck}], notes:[{guid,lesson,type}] }
 * @param store  a store from store.js (allStates, countsToday, prefs, intakeBudget, log, dayKey)
 * @param opts   { lesson?: string|null, now?: number, ahead?: number }
 *   ahead — study-ahead mode: ignore the daily caps and take up to `ahead` new cards. Never the
 *   default; the empty queue is the success state (SPEC.md 7.9). Even here siblings are deduped.
 */
function buildQueue(deck, store, opts = {}) {
  const now = opts.now ?? Date.now();
  const lesson = opts.lesson ?? null;
  const pack = opts.pack ?? null;
  const p = store.prefs;
  const states = store.allStates();
  const today = store.countsToday(now);
  const budget = store.intakeBudget(now);

  // Cards carry their pack and lesson (derived in packs.js). A suspended card is out of every
  // queue — terminal safe state — but keeps its history and its place in the pack.
  const isSuspended = typeof store.isSuspended === 'function' ? (id) => store.isSuspended(id) : () => false;
  const pool = deck.cards.filter((c) =>
    (!pack || c.pack === pack) && (!lesson || c.lesson === lesson) && !isSuspended(c.id));

  let reviewsLeft = Math.max(0, p.maxReviewsPerDay - today.reviews);
  let newLeft = Math.max(0, budget.perDay - today.newCards);
  // A6 — the brake. Kept on; the override is not surfaced in the normal settings path because
  // guides routinely tell people to switch it off "to make progress", and doing so removes it.
  if (!p.newCardsIgnoreReviewLimit && reviewsLeft <= 0) newLeft = 0;
  if (opts.ahead) { newLeft = opts.ahead; reviewsLeft = 0; }

  // Burying: a note whose OTHER card was answered today does not show its siblings again
  // today. Anki exposes three switches (new / review / interday-learning siblings); this app
  // ships one, on, covering all three — the two kanji cards of one note should not test the
  // same thing twice in one sitting.
  // Keyed by CARD, then checked against the note minus the card itself. The first version
  // keyed by note and so buried a card on the strength of its own earlier answer — a card
  // returning from a one-minute Again step would vanish until tomorrow if the learner left the
  // session in between. A sibling is another card of the same note, never the card itself.
  const cardsAnsweredToday = new Set();
  if (p.burySiblings) {
    const k = store.dayKey(now);
    for (const e of store.log) if (store.dayKey(e.t) === k) cardsAnsweredToday.add(e.c);
  }
  // A note is identified by pack AND guid. Two packs can legitimately carry the same guid —
  // both derived from the same corpus, or one a fork of the other — and keying on guid alone
  // made them siblings of each other. Found by the pack suite on its first run.
  const noteKey = (c) => `${c.pack || ''}/${c.guid}`;
  const siblingsOf = new Map();
  for (const c of deck.cards) {
    const k = noteKey(c);
    let a = siblingsOf.get(k); if (!a) { a = []; siblingsOf.set(k, a); } a.push(c.id);
  }
  const unburied = (c) => !p.burySiblings ||
    !(siblingsOf.get(noteKey(c)) || []).some((id) => id !== c.id && cardsAnsweredToday.has(id));

  // Three kinds of waiting card. Anki's manual (Deck Options, "Maximum reviews/day"): "Anki
  // includes any learning cards that have crossed the day boundary (interday learning cards)
  // in the review count, so those learning cards will be subject to the review limit." So a
  // card inside TODAY's steps (answered today, due again today) is not capped by that limit;
  // one that crossed the day boundary is, with the reviews.
  const due = [], learn = [], learnInter = [], fresh = [];
  const todayK = store.dayKey(now);
  for (const c of pool) {
    const s = states.get(c.id) || { state: 'new' };
    if (s.state === 'new') { fresh.push(c); continue; }
    if (s.due == null || s.due > now) continue;
    if (s.state === 'review') due.push({ c, due: s.due });
    else (s.last && store.dayKey(s.last.t) === todayK ? learn : learnInter).push({ c, due: s.due });
  }
  // Anki's learn-ahead rule, quoted from the manual (Deck Options, "Learning steps"): "If
  // there's nothing else to study, Anki will show learning cards up to 20 minutes early by
  // default." Without it a card failed on the day's last turn — due again in one minute and
  // inside a step — was invisible to a rebuilt queue, and the done screen called that a clear
  // queue (external review, round 3). Applied only when nothing else is due, as the manual says.
  const learnAheadMs = (p.learnAheadMinutes ?? 20) * 60000;
  if (!due.length && !learn.length && !learnInter.length && Math.min(fresh.length, newLeft) === 0) {
    for (const c of pool) {
      const s = states.get(c.id);
      if (!s || s.state === 'new' || s.state === 'review') continue;
      if (s.due != null && s.due > now && s.due <= now + learnAheadMs) learn.push({ c, due: s.due });
    }
  }
  due.sort((a, b) => a.due - b.due);
  learn.sort((a, b) => a.due - b.due);

  // Within ONE session, at most one card per note. The earlier at-build check only covers
  // siblings answered on a previous visit today; this covers two siblings both due right now.
  const seenNote = new Set();
  const oncePerNote = (c) => { const k = noteKey(c); if (seenNote.has(k)) return false; seenNote.add(k); return true; };

  // Learning cards first (they are inside a step and waiting), then reviews by due date. The
  // review limit slices interday learning cards and reviews; today's own steps are never cut.
  learnInter.sort((a, b) => a.due - b.due);
  const capped = learnInter.map((x) => x.c).concat(due.map((x) => x.c))
    .filter(unburied).filter(oncePerNote).slice(0, reviewsLeft);
  const dueQ = learn.map((x) => x.c).filter(unburied).filter(oncePerNote).concat(capped);
  const freshQ = fresh.filter(unburied).filter(oncePerNote).slice(0, newLeft);

  // Spread new cards through the reviews rather than front-loading them: a session that opens
  // with nine unfamiliar cards in a row is the one that gets abandoned.
  const out = [];
  const gap = freshQ.length ? Math.max(1, Math.floor(dueQ.length / freshQ.length)) : 0;
  let di = 0, ni = 0;
  while (di < dueQ.length || ni < freshQ.length) {
    for (let i = 0; i < gap && di < dueQ.length; i++) out.push(dueQ[di++]);
    if (ni < freshQ.length) out.push(freshQ[ni++]);
    if (!gap) while (di < dueQ.length) out.push(dueQ[di++]);
  }

  return {
    queue: out,
    newLeft, reviewsLeft, budget,
    counts: { fresh: fresh.length, due: due.length, learn: learn.length + learnInter.length },
  };
}

// Per-pack, per-lesson progress for the home screen. Pure, so it is tested with the rest.
// Suspended cards are counted separately rather than hidden: a learner should be able to see
// that a pack update retired cards, not wonder where they went.
function lessonProgress(deck, store) {
  const states = store.allStates();
  const isSuspended = typeof store.isSuspended === 'function' ? (id) => store.isSuspended(id) : () => false;
  const rows = new Map();
  for (const c of deck.cards) {
    const key = `${c.pack}|${c.lesson}`;
    let r = rows.get(key);
    if (!r) { r = { pack: c.pack, lesson: c.lesson, total: 0, fresh: 0, learning: 0, review: 0, suspended: 0 }; rows.set(key, r); }
    if (isSuspended(c.id)) { r.suspended++; continue; }
    r.total++;
    const s = states.get(c.id);
    if (!s || s.state === 'new') r.fresh++;
    else if (s.state === 'review') r.review++;
    else r.learning++;
  }
  return [...rows.values()].sort((a, b) =>
    a.pack.localeCompare(b.pack) || a.lesson.localeCompare(b.lesson, undefined, { numeric: true }));
}

// The intake FLOOR from a pack's milestones (SPEC.md B1): the new cards a day needed to have
// SEEN every card a dated milestone covers before its date. Distinct from the ceiling the
// minute budget allows. Returns the binding milestone and its floor, or null if none is ahead.
// `packId` scopes the floor to one pack: a learner studying one course is not told about
// another course's deadline (external review, round 1). Null means every installed pack.
function intakeFloor(deck, store, now = Date.now(), packId = null) {
  const states = store.allStates();
  const isSuspended = typeof store.isSuspended === 'function' ? (id) => store.isSuspended(id) : () => false;
  const today = new Date(store.dayKey(now));
  let binding = null;
  for (const [id, pack] of Object.entries(deck.packs || {})) {
    if (packId && id !== packId) continue;
    for (const m of pack.milestones || []) {
      const due = new Date(m.due);
      const daysLeft = Math.round((due - today) / 86400e3);
      if (daysLeft < 0) continue;
      const covered = deck.cards.filter((c) => c.pack === pack.id && (m.lessons || []).includes(c.lesson) && !isSuspended(c.id));
      const unseen = covered.filter((c) => { const s = states.get(c.id); return !s || s.state === 'new'; }).length;
      const floor = daysLeft === 0 ? unseen : Math.ceil(unseen / daysLeft);
      const row = { pack: pack.id, packTitle: pack.title, milestone: m, daysLeft, covered: covered.length, unseen, floor };
      if (!binding || row.floor > binding.floor) binding = row;
    }
  }
  return binding;
}

// classview.js — the instructor's view, computed from students' exports. NO DOM.
//
// SPEC.md B2, in its first form: no accounts, no server. Each student exports; the instructor
// imports the exports; this module answers the four questions and nothing else:
//   1. Which items is this class failing?
//   2. Is the class on pace for the next milestone?
//   3. Who is not studying?
//   4. Did my correction land — which pack version is each student on?
//
// What it can honestly claim is decided by MC-84 before a line of UI: an export is a record
// of what a device reports, like a handed-in worksheet — notice and evidence, not proof. The
// CAVEAT below is exported so the UI prints the same sentence the tests check for. It also
// respects the FERPA finding in SPEC.md §2.B2: aggregation does not anonymise data from the
// instructor of that class, so this module does not pretend it does; it simply holds no name.
//
// Reuses the store's fold for every student, so "state", "lapses" and "leech" mean exactly
// what they mean on the student's own screen.


const CAVEAT =
  'Reported by each student’s own device, from a file they chose to hand you. Treat it as you ' +
  'would a submitted worksheet: evidence of what was done, not proof. Nothing here detects ' +
  'dishonesty and nothing here is a grade.';

const mem = () => { const m = new Map(); return { get: (k) => (m.has(k) ? m.get(k) : null), set: (k, v) => { m.set(k, v); return true; } }; };
const DAY = 86400e3;

/** Parse one export. Throws on anything that is not a BW-08 export. */
function readExport(text, label) {
  const parsed = typeof text === 'string' ? JSON.parse(text) : text;
  if (!parsed || parsed.format !== 'bw08-review-log' || !Array.isArray(parsed.log)) throw new Error(`${label || 'file'}: not a BW-08 export`);
  const store = makeStore(mem()); store.load();
  const res = store.importAll(JSON.stringify(parsed));   // validates every entry's shape
  return { label: label || 'export', store, log: store.log, packs: Array.isArray(parsed.packs) ? parsed.packs : [], exported: parsed.exported || null, entries: res.total };
}

/**
 * @param exports  [{ label, store, log, packs }] from readExport
 * @param deck     the instructor's own installed deck (packStore.deck()) — the cards to report on
 * @param opts     { now, leechThreshold }
 */
/** The pack versions a student's reviews were answered under — the latest `v` seen per pack,
 *  so a record synced through an account answers question 4 the way a file export does. */
function packsFromEntries(entries) {
  const latest = new Map();
  for (const e of entries || []) {
    if (!e || !e.v) continue;
    const id = String(e.c).split('/')[0];
    const cur = latest.get(id);
    if (!cur || e.t > cur.t) latest.set(id, { t: e.t, version: String(e.v) });
  }
  return [...latest].map(([id, x]) => ({ id, version: x.version })).sort((a, b) => a.id.localeCompare(b.id));
}

function summarizeClass(exports, deck, opts = {}) {
  const now = opts.now ?? Date.now();
  const leechThreshold = opts.leechThreshold ?? 8;
  const dayKey = (ms) => exports[0] ? exports[0].store.dayKey(ms) : new Date(ms).toISOString().slice(0, 10);
  const todayKey = dayKey(now);
  const sevenAgo = now - 7 * DAY;

  // ---- 3. who is studying ----
  const students = exports.map((ex, i) => {
    const log = ex.log;
    const days = new Set(), days7 = new Set();
    let reviews7 = 0, ms = 0, first = null, last = null;
    const introduced = new Set();
    for (const e of log) {
      const k = dayKey(e.t); days.add(k);
      if (e.t >= sevenAgo) { reviews7++; days7.add(k); }
      ms += e.e || 0;
      if (e.k === 0) introduced.add(e.c);
      if (first == null || e.t < first) first = e.t;
      if (last == null || e.t > last) last = e.t;
    }
    return {
      index: i, label: ex.label,
      reviews: log.length, reviews7d: reviews7, daysActive: days.size, daysActive7d: days7.size,
      cardsIntroduced: introduced.size, minutes: Math.round(ms / 60000),
      // DATE precision on purpose (SPEC.md §8.3): an instructor needs to know a student has
      // stopped, not when they studied at 2 a.m.
      firstActiveOn: first == null ? null : dayKey(first), lastActiveOn: last == null ? null : dayKey(last),
      stoppedDays: last == null ? null : Math.max(0, Math.round((new Date(todayKey) - new Date(dayKey(last))) / DAY)),
      packs: ex.packs,
    };
  });

  // ---- 1. which items ----
  const byCard = new Map(deck.cards.map((c) => [c.id, c]));
  const noteOf = new Map(deck.notes.map((n) => [`${n.pack}/${n.guid}`, n]));
  // Packs the exports refer to that this deck lacks. Without them, items and coverage cannot be
  // named, and the screen must say THAT rather than "nothing reviewed" (external review, round 2: an
  // instructor who had not installed the pack read a full class as a quiet one).
  const referenced = new Set();
  for (const ex of exports) {
    for (const p of ex.packs || []) if (p && p.id) referenced.add(p.id);
    for (const e of ex.log || []) { const s = String(e.c), i = s.indexOf('/'); if (i > 0) referenced.add(s.slice(0, i)); }
  }
  const missingPacks = [...referenced].filter((id) => !(deck.packs && deck.packs[id]));
  let unmatchedReviews = 0;
  const acc = new Map(); // cardId -> { seen, firstAgain, lapses[], leech }
  for (const ex of exports) {
    const states = ex.store.allStates();
    // first grade per card, from the log in time order
    const firstGrade = new Map();
    for (const e of [...ex.log].sort((a, b) => a.t - b.t)) if (!firstGrade.has(e.c)) firstGrade.set(e.c, e.g);
    for (const [cardId, st] of states) {
      if (st.reps === 0) continue;
      if (!byCard.has(cardId)) { unmatchedReviews += st.reps; continue; }
      let a = acc.get(cardId);
      if (!a) { a = { seen: 0, firstAgain: 0, reviews: 0, lapses: [], leeches: 0 }; acc.set(cardId, a); }
      a.seen++; a.reviews += st.reps; a.lapses.push(st.lapses);
      if (firstGrade.get(cardId) === 1) a.firstAgain++;
      if (st.lapses >= leechThreshold) a.leeches++;
    }
  }
  const items = [...acc.entries()].map(([cardId, a]) => {
    const c = byCard.get(cardId), n = noteOf.get(`${c.pack}/${c.guid}`) || { fields: {} };
    return {
      cardId, pack: c.pack, guid: c.guid, ord: c.ord, lesson: c.lesson, fields: n.fields, type: n.type,
      nStudents: a.seen, nReviews: a.reviews,
      firstAgainRate: a.seen ? a.firstAgain / a.seen : 0,
      meanLapses: a.lapses.reduce((s, x) => s + x, 0) / a.lapses.length,
      pctLeech: a.seen ? a.leeches / a.seen : 0,
    };
  });
  // Ranked by what an instructor acts on: how often the class did not know it on first sight,
  // then how often it keeps being forgotten. Ties broken toward more students, so a card one
  // student failed does not outrank one the whole class failed.
  items.sort((x, y) => (y.firstAgainRate - x.firstAgainRate) || (y.meanLapses - x.meanLapses) || (y.nStudents - x.nStudents));

  // ---- 2. pace / coverage, per pack+lesson, as a DISTRIBUTION not a mean ----
  const lessons = new Map();
  for (const c of deck.cards) {
    const k = `${c.pack}|${c.lesson}`;
    let L = lessons.get(k); if (!L) { L = { pack: c.pack, lesson: c.lesson, cards: 0, ids: [] }; lessons.set(k, L); }
    L.cards++; L.ids.push(c.id);
  }
  const coverage = [...lessons.values()].map((L) => {
    const perStudent = exports.map((ex) => {
      const states = ex.store.allStates();
      const seen = L.ids.filter((id) => { const s = states.get(id); return s && s.reps > 0; }).length;
      return L.cards ? seen / L.cards : 0;
    });
    const buckets = { none: 0, some: 0, most: 0, all: 0 };
    for (const f of perStudent) { if (f === 0) buckets.none++; else if (f < 0.5) buckets.some++; else if (f < 1) buckets.most++; else buckets.all++; }
    return { pack: L.pack, lesson: L.lesson, cards: L.cards, students: exports.length, buckets, perStudent };
  }).sort((a, b) => a.pack.localeCompare(b.pack) || a.lesson.localeCompare(b.lesson, undefined, { numeric: true }));

  // ---- 4. versions ----
  const versions = {};
  for (const ex of exports) for (const p of ex.packs || []) {
    versions[p.id] = versions[p.id] || {};
    versions[p.id][p.version] = (versions[p.id][p.version] || 0) + 1;
  }

  return { generatedAt: now, students: students.length, caveat: CAVEAT, studentsList: students, items, coverage, versions, missingPacks, unmatchedReviews };
}

// sync.js — the device's log to the server and back. NO DOM, NO browser globals; the transport
// is injected, so the suite runs against an in-memory server and the page against Neon.
//
// The shape (ADR-0001, SPEC.md §5.4, the decision brief's sync findings): the device is the
// primary store; the server is a replica of an append-only log. Upload is at-least-once with
// the server deduplicating on the entry's own id (card id + the learner's timestamp) through
// append_reviews, whose INSERT … ON CONFLICT DO NOTHING is PostgreSQL's idempotency. Download
// is a union: rows merge into the local log through the same import path a file uses, and
// state is re-derived by folding — nothing is merged, so nothing conflicts. A cursor on the
// server's received_at makes the pull incremental.
//
// Transport contract (implemented by neonTransport for the page and memoryTransport for tests):
//   rpc(name, args)                      -> result of a database function
//   select(table, { select, order, filters }) -> rows        (filters: [[column, op, value]])
//   upsert(table, rows, conflictColumns) -> void
//   update(table, patch, filters)        -> number of rows
//   del(table, filters)                  -> number of rows

const SYNC_KEY = 'bw08.sync.v1';
const clientId = (e) => `${e.c}|${e.t}`;
/** A server row back into a log entry — the page's class report folds rows through the same path a file takes. */
const rowToEntry = (r) => ({ c: r.card, t: Number(r.t), g: r.g, k: r.k, s: r.s, d: r.d, i: r.i, u: r.u == null ? null : Number(r.u), e: r.e, ...(r.v ? { v: String(r.v) } : {}) });

function makeSync(store, transport, opts = {}) {
  const batch = opts.batch || 500;
  const adapter = opts.adapter || { get: () => null, set: () => true };
  let st = { sent: [], cursor: null, packCursor: null };
  try { const raw = adapter.get(SYNC_KEY); if (raw) st = { ...st, ...JSON.parse(raw) }; } catch (e) { /* start clean */ }
  const sent = new Set(st.sent);
  const persist = () => { st.sent = [...sent]; adapter.set(SYNC_KEY, JSON.stringify(st)); };

  const toRow = (e) => ({ c: e.c, t: e.t, g: e.g, k: e.k, s: e.s, d: e.d, i: e.i, u: e.u, e: e.e, v: e.v || null });   // v: the pack version the answer was given under

  return {
    /** Entries the server has not confirmed. */
    pending() { return store.log.filter((e) => !sent.has(clientId(e))); },

    /** Upload every pending entry, `batch` at a time. A batch that fails stays pending and is
     *  retried next time; a batch the server already holds counts as sent (it returned 0). */
    async push() {
      const todo = this.pending();
      let batches = 0, uploaded = 0;
      for (let i = 0; i < todo.length; i += batch) {
        const rows = todo.slice(i, i + batch);
        const n = await transport.rpc('append_reviews', { p_rows: rows.map(toRow) });
        rows.forEach((e) => sent.add(clientId(e)));
        batches++; uploaded += Number(n) || 0;
        persist();
      }
      return { pending: todo.length, batches, uploaded };
    },

    /** Download rows received after the cursor and merge them as a union. */
    async pull() {
      const filters = st.cursor ? [['received_at', 'gt', st.cursor]] : [];
      const rows = await transport.select('review_log', { select: 'card,t,g,k,s,d,i,u,e,v,received_at', order: 'received_at.asc', filters });
      if (!rows.length) return { added: 0, total: store.log.length };
      const res = store.importAll(JSON.stringify({ format: 'bw08-review-log', version: 1, log: rows.map(rowToEntry) }));
      rows.forEach((r) => sent.add(`${r.card}|${Number(r.t)}`));
      st.cursor = rows[rows.length - 1].received_at;
      persist();
      return { added: res.added, total: res.total };
    },

    /** The learner's own packs, whole documents; last write wins by updated_at. */
    async pushPacks(packs) {
      if (!packs.length) return 0;
      await transport.upsert('user_packs', packs.map((p) => ({ pack_id: p.id, version: p.version, pack: p })), 'user_id,pack_id');
      return packs.length;
    },
    async pullPacks() {
      const rows = await transport.select('user_packs', { select: 'pack_id,version,pack,updated_at', order: 'updated_at.asc' });
      return rows.map((r) => r.pack);
    },

    // ---- classes: thin, typed calls; the policies decide what each returns ----
    /** The class a code names, before any consent (SPEC 3.4.2). */
    peekClass: (code) => transport.rpc('peek_class', { p_code: code }).then((r) => (Array.isArray(r) ? r[0] : r)),
    /** The learner's display name: on rosters, and shown to a student before they consent to join a class this learner teaches. */
    myProfile: () => transport.select('profiles', { select: 'user_id,display_name', order: 'created_at.asc', filters: [] }).then((r) => (r && r[0]) || null),
    setDisplayName: (name) => transport.upsert('profiles', [{ display_name: String(name || '').trim().slice(0, 80) }], 'user_id'),
    createClass: (title, endsOn) => transport.rpc('create_class', { p_title: title, p_ends_on: endsOn }).then((r) => (Array.isArray(r) ? r[0] : r)),
    joinClass: (code, label) => transport.rpc('join_class', { p_code: code, p_label: label }).then((r) => (Array.isArray(r) ? r[0] : r)),
    resetClassCode: (classId) => transport.rpc('reset_class_code', { p_class: classId }),
    myClasses: () => transport.select('classes', { select: 'id,code,title,instructor_id,ends_on,created_at', order: 'created_at.asc', filters: [] }),
    enrollments: (classId) => transport.select('enrollments', { select: 'class_id,user_id,status,label,consented_at,joined_at,updated_at', order: 'joined_at.asc', filters: [['class_id', 'eq', classId]] }),
    setEnrollment: (classId, userId, status) => transport.update('enrollments', { status, updated_at: new Date().toISOString() }, [['class_id', 'eq', classId], ['user_id', 'eq', userId]]),
    leaveClass: (classId) => transport.update('enrollments', { status: 'left', updated_at: new Date().toISOString() }, [['class_id', 'eq', classId]]),
    classPacks: (classId) => transport.select('class_packs', { select: 'class_id,pack_id,version,pack,updated_at', order: 'pack_id.asc', filters: [['class_id', 'eq', classId]] }),
    publishClassPack: (classId, pack) => transport.upsert('class_packs', [{ class_id: classId, pack_id: pack.id, version: pack.version, pack, updated_at: new Date().toISOString() }], 'class_id,pack_id'),
    /** Everything the instructor may read, incrementally: the policies filter to her students'
     *  class-pack rows; the client folds them per student for the four questions. */
    classReviews: (afterCursor) => transport.select('review_log', { select: 'user_id,card,t,g,k,s,d,i,u,e,v,received_at', order: 'received_at.asc', filters: afterCursor ? [['received_at', 'gt', afterCursor]] : [] }),

    /** The review log on the server, gone — and only that; then the local sync state, so the
     *  device's own erase is not undone by the next pull. Own cards, classes, enrollments stay. */
    async eraseReviews() { const n = await transport.rpc('erase_my_reviews', {}); sent.clear(); st = { sent: [], cursor: null, packCursor: null }; persist(); return Number(n) || 0; },

    /** Everything the app holds about this account, gone; then the local sync state. */
    async deleteMe() { await transport.rpc('delete_me', {}); sent.clear(); st = { sent: [], cursor: null, packCursor: null }; persist(); },

    /** Forget what was sent (sign-out, or a new account on the same device). */
    reset() { sent.clear(); st = { sent: [], cursor: null, packCursor: null }; persist(); },
    state() { return { sent: sent.size, cursor: st.cursor }; },
  };
}

/** The real transport: Neon's Data API (PostgREST-compatible), the learner's bearer token from
 *  the identity provider. Every call is a consequence of signing in, an explicit act. */
function neonTransport(baseUrl, getToken) {
  const base = String(baseUrl).replace(/\/+$/, '');
  const headers = async (extra) => ({ Authorization: 'Bearer ' + (await getToken()), 'Content-Type': 'application/json', Accept: 'application/json', ...extra });
  const q = (filters) => (filters || []).map(([c, op, v]) => `${encodeURIComponent(c)}=${op}.${encodeURIComponent(v)}`).join('&');
  const check = async (res, what) => {
    // PostgREST answers a write with return=minimal as 201 and an EMPTY body (the rig found
    // this before a live server could): read the text and parse only what is there.
    if (res.ok) { const text = await res.text(); return text.trim() ? JSON.parse(text) : null; }
    let msg = res.status + ' ' + res.statusText;
    try { const j = await res.json(); msg = j.message || j.hint || j.details || JSON.stringify(j); } catch (e) { /* keep status text */ }
    throw new Error(what + ': ' + msg);
  };
  return {
    async rpc(name, args) {
      const res = await /* network: user-initiated */ fetch(`${base}/rpc/${name}`, { method: 'POST', headers: await headers(), body: JSON.stringify(args || {}) });
      return check(res, name);
    },
    async select(table, o) {
      const parts = [];
      if (o.select) parts.push('select=' + encodeURIComponent(o.select));
      if (o.order) parts.push('order=' + encodeURIComponent(o.order));
      const f = q(o.filters); if (f) parts.push(f);
      const res = await /* network: user-initiated */ fetch(`${base}/${table}?${parts.join('&')}`, { headers: await headers() });
      return check(res, 'read ' + table);
    },
    async upsert(table, rows, conflict) {
      const res = await /* network: user-initiated */ fetch(`${base}/${table}?on_conflict=${encodeURIComponent(conflict)}`, {
        method: 'POST', headers: await headers({ Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(rows),
      });
      return check(res, 'write ' + table);
    },
    async update(table, patch, filters) {
      const res = await /* network: user-initiated */ fetch(`${base}/${table}?${q(filters)}`, {
        method: 'PATCH', headers: await headers({ Prefer: 'return=representation' }), body: JSON.stringify(patch),
      });
      const rows = await check(res, 'update ' + table);
      return Array.isArray(rows) ? rows.length : 0;
    },
    async del(table, filters) {
      const res = await /* network: user-initiated */ fetch(`${base}/${table}?${q(filters)}`, { method: 'DELETE', headers: await headers({ Prefer: 'return=representation' }) });
      const rows = await check(res, 'delete ' + table);
      return Array.isArray(rows) ? rows.length : 0;
    },
  };
}

/** An in-memory server with the same semantics the policies give the real one, for the suite.
 *  It knows who is calling (`user`) and enforces the few rules the suite exercises. */
function memoryTransport(server, user) {
  server.reviews = server.reviews || new Map();     // key user|clientId -> row
  server.packs = server.packs || new Map();          // key user|pack_id -> row
  server.profiles = server.profiles || new Map();    // key user -> row
  server.clock = server.clock || 0;
  const stamp = () => new Date(1e12 + (++server.clock) * 1000).toISOString();
  return {
    failNext: null,
    async rpc(name, args) {
      if (this.failNext) { const e = this.failNext; this.failNext = null; throw new Error(e); }
      if (name === 'append_reviews') {
        const rows = args.p_rows;
        if (!Array.isArray(rows)) throw new Error('rows must be an array');
        if (rows.length > 500) throw new Error('at most 500 rows per call');
        let n = 0;
        for (const r of rows) {
          if (!/^[^#\s]+#\d+$/.test(r.c) || r.g < 1 || r.g > 4 || r.k < 0 || r.k > 2) throw new Error('bad row');
          const key = `${user}|${r.c}|${r.t}`;
          if (server.reviews.has(key)) continue;
          server.reviews.set(key, { user_id: user, card: r.c, t: r.t, g: r.g, k: r.k, s: r.s, d: r.d, i: r.i, u: r.u, e: r.e, v: r.v || null, received_at: stamp() });
          n++;
        }
        return n;
      }
      if (name === 'delete_me') { for (const k of [...server.reviews.keys()]) if (k.startsWith(user + '|')) server.reviews.delete(k); return null; }
      if (name === 'erase_my_reviews') { let n = 0; for (const k of [...server.reviews.keys()]) if (k.startsWith(user + '|')) { server.reviews.delete(k); n++; } return n; }
      throw new Error('unknown rpc ' + name);
    },
    async select(table, o) {
      const src = table === 'review_log' ? server.reviews : table === 'user_packs' ? server.packs : table === 'profiles' ? server.profiles : new Map();
      let rows = [...src.values()].filter((r) => r.user_id === user);
      for (const [c, op, v] of o.filters || []) rows = rows.filter((r) => (op === 'gt' ? r[c] > v : op === 'eq' ? r[c] === v : true));
      if (o.order) { const [col, dir] = o.order.split('.'); rows.sort((a, b) => (a[col] < b[col] ? -1 : a[col] > b[col] ? 1 : 0) * (dir === 'desc' ? -1 : 1)); }
      return rows;
    },
    async upsert(table, rows) {
      if (table === 'profiles') { for (const r of rows) server.profiles.set(user, { user_id: user, ...r, created_at: stamp() }); return; }
      for (const r of rows) server.packs.set(`${user}|${r.pack_id}`, { user_id: user, ...r, updated_at: stamp() });
    },
    async update() { return 0; },
    async del() { return 0; },
  };
}

// editor.js — the learner's own cards. NO DOM, NO browser globals.
//
// A card the learner writes is a note in a pack like any other (PACK-FORMAT.md): the pack is
// "mine", it installs through the same pack store, and an edit is a new version merged by the
// §4.5 rules — history binds to the guid, so editing a card never loses its schedule, and
// retiring one suspends its cards rather than deleting anything (SPEC.md A9). Nothing new in
// storage; the editor only makes packs. Every change stamps `updated` (ISO time): when the same
// pack is edited on two devices, the later stamp wins whole (sync.js: last write wins).


const OWN_PACK_ID = 'mine';

// Three shapes a learner can write. Display roles are the renderer's vocabulary (packs.js).
const OWN_NOTE_TYPES = [
  {
    id: 'basic', name: 'Basic', fields: ['front', 'back', 'note', 'hint'],
    display: { front: 'headline', back: 'headline', note: 'also', hint: 'hint' },
    templates: [{ ord: 0, name: 'Front → Back', prompt: 'front', answer: 'back' }],
  },
  {
    id: 'both', name: 'Basic, both ways', fields: ['front', 'back', 'note', 'hint'],
    display: { front: 'headline', back: 'headline', note: 'also', hint: 'hint' },
    templates: [
      { ord: 0, name: 'Front → Back', prompt: 'front', answer: 'back' },
      { ord: 1, name: 'Back → Front', prompt: 'back', answer: 'front' },
    ],
  },
  {
    id: 'cloze', name: 'Fill in the blank', kind: 'cloze', fields: ['text', 'extra'],
    display: { text: 'text', extra: 'also' },
    templates: [{ ord: 0, name: 'Blank', prompt: 'text', answer: 'text' }],
  },
  {
    id: 'vocab', name: 'Vocabulary', fields: ['word', 'reading', 'meaning', 'note', 'hint'],
    display: { word: 'glyph', reading: 'headline', meaning: 'text', note: 'also', hint: 'hint' },
    templates: [
      { ord: 0, name: 'Recognition', prompt: 'word', answer: 'meaning' },
      { ord: 1, name: 'Production', prompt: 'meaning', answer: 'word' },
    ],
  },
];
const REQUIRED = { basic: ['front', 'back'], both: ['front', 'back'], vocab: ['word', 'meaning'], cloze: ['text'] };

function newOwnPack(language = '') {
  return {
    format: 'kurikaeshi-pack', formatVersion: 1,
    id: OWN_PACK_ID, version: '1.0.0', title: 'My cards', language: language || '',
    publisher: { name: '', role: 'self' }, attribution: '', licence: '', milestones: [],
    noteTypes: OWN_NOTE_TYPES.map((t) => ({ ...t, fields: [...t.fields], templates: t.templates.map((x) => ({ ...x })) })),
    notes: [],
  };
}

/** The learner's pack carries the app's CURRENT own-card types. A pack made before a type
 *  existed (the cloze type arrived after the first packs) would otherwise refuse it forever:
 *  "no such card type" on a pack that is the app's own. Definitions are replaced by id, so a
 *  changed template propagates through the §4.5 plan like any pack update. */
function withOwnTypes(pack) {
  const own = OWN_NOTE_TYPES.map((t) => ({ ...t, fields: [...t.fields], display: { ...t.display }, templates: t.templates.map((x) => ({ ...x })) }));
  const ids = new Set(own.map((t) => t.id));
  const kept = (pack.noteTypes || []).filter((t) => !ids.has(t.id));
  return { ...pack, noteTypes: [...own, ...kept] };
}

/** Which copy of the learner's pack wins when two meet — a sync, or a file import: 'adopt'
 *  the incoming one, 'keep' the local one, 'same', or 'none' when neither exists. The later
 *  `updated` stamp wins whole (last write wins, sync.js); a local tombstone — the pack was
 *  retired on this device at that time — counts as the local stamp, so a retired pack does not
 *  come back from an older copy. */
function packVerdict(local, incoming, localTombstone) {
  if (!local && !incoming) return 'none';
  const lt = local ? (local.updated || '') : (localTombstone || '');
  const rt = incoming ? (incoming.updated || '') : '';
  if (incoming && rt > lt) return 'adopt';
  if (lt > rt) return 'keep';
  return 'same';
}

function bumpVersion(v) {
  const [a, b, c] = String(v).split('.').map((n) => parseInt(n, 10) || 0);
  return `${a}.${b}.${c + 1}`;
}

function newGuid() {
  const g = globalThis.crypto;
  if (g && g.randomUUID) return 'c-' + g.randomUUID().replace(/-/g, '').slice(0, 16);
  return 'c-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

/** What is wrong with a note as typed, in the learner's words — or null. */
function noteProblem(type, fields) {
  const req = REQUIRED[type];
  if (!req) return 'Pick a card type.';
  for (const f of req) if (!fields || !String(fields[f] || '').trim()) return `The ${f} is empty.`;
  if (type === 'cloze' && !clozeOrds(fields.text).length) return 'Mark at least one blank, like {{c1::word}}.';
  return null;
}

// A retired note is remembered on the pack by guid, type and first field. A card written again
// with the same first field gets that guid back — and with it every card's history, because the
// §4.5 plan un-suspends cards that return (external review, round 8: the retire copy promised
// this, and a fresh guid made it false).
const firstField = (pack, type) => (pack.noteTypes.find((t) => t.id === type) || { fields: [''] }).fields[0];
const findRetired = (pack, type, key) => (pack.retired || []).find((r) => r.type === type && r.key === key) || null;
const dropRetired = (pack, guids) => { const rest = (pack.retired || []).filter((r) => !guids.has(r.guid)); return rest.length ? rest : undefined; };

/** Add or edit a note. Returns a NEW pack at the next version; the input is untouched. */
function upsertNote(pack0, { guid, type, lesson, fields }) {
  const problem = noteProblem(type, fields);
  if (problem) throw new Error(problem);
  const pack = withOwnTypes(pack0);
  const nt = pack.noteTypes.find((t) => t.id === type);
  if (!nt) throw new Error(`no such card type "${type}"`);
  const clean = {};
  for (const f of nt.fields) clean[f] = String((fields || {})[f] || '').trim();
  const back = guid ? null : findRetired(pack, type, clean[nt.fields[0]]);
  const note = { guid: guid || (back && back.guid) || newGuid(), type, lesson: String(lesson || '').trim(), tags: ['mine'], fields: clean };
  const notes = pack.notes.filter((n) => n.guid !== note.guid);
  const idx = pack.notes.findIndex((n) => n.guid === note.guid);
  if (idx >= 0) notes.splice(idx, 0, note); else notes.push(note);
  const next = { ...pack, version: bumpVersion(pack.version), updated: new Date().toISOString(), notes, retired: dropRetired(pack, new Set([note.guid])) };
  validatePack(next);
  return next;
}

/** Retire a note: it leaves the pack, and the §4.5 merge suspends its cards — their history
 *  stays and comes back if the note ever returns. Returns the new pack, which may be EMPTY
 *  (then the pack itself is removed by the caller; an empty pack is not installable). */
function retireNote(pack0, guid) {
  if (!pack0.notes.some((n) => n.guid === guid)) throw new Error('no such card');
  const pack = withOwnTypes(pack0);
  const note = pack.notes.find((n) => n.guid === guid);
  const key = String((note.fields || {})[firstField(pack, note.type)] || '').trim();
  const retired = [...(pack.retired || []).filter((r) => r.guid !== guid), { guid, type: note.type, key }];
  return { ...pack, version: bumpVersion(pack.version), updated: new Date().toISOString(), notes: pack.notes.filter((n) => n.guid !== guid), retired };
}

/** What installing `next` over `current` would do — the same plan the update path shows. */
function describeChange(current, next) {
  if (!next.notes.length) return { apply: false, empty: true, reason: 'the last card was retired; the pack goes with it' };
  return planUpdate(current, next);
}

/** Search the learner's cards by any field, case-insensitively. */
function findNotes(pack, query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return pack.notes.slice();
  return pack.notes.filter((n) => Object.values(n.fields).some((v) => String(v).toLowerCase().includes(q)) || (n.lesson || '').toLowerCase().includes(q));
}

/** Add many notes in ONE version bump. Duplicates follow Anki's documented import rule: when
 *  the first field matches an existing note of the same type, "the existing note's other fields
 *  will be updated" (docs.ankiweb.net/importing/text-files.html) — the guid, and so the history,
 *  stays. Every note is validated before the pack is touched. Returns { pack, added, updated }. */
function addNotes(pack0, list) {
  const pack = withOwnTypes(pack0);
  for (const n of list) {
    const problem = noteProblem(n.type, n.fields);
    if (problem) throw new Error(problem);
    if (!pack.noteTypes.find((t) => t.id === n.type)) throw new Error(`no such card type "${n.type}"`);
  }
  const notes = pack.notes.slice();
  const revived = new Set();
  let added = 0, updated = 0;
  for (const n of list) {
    const nt = pack.noteTypes.find((t) => t.id === n.type);
    const clean = {};
    for (const f of nt.fields) clean[f] = String((n.fields || {})[f] || '').trim();
    const first = nt.fields[0];
    const idx = notes.findIndex((x) => x.type === n.type && x.fields[first] === clean[first]);
    const tags = Array.from(new Set(['mine', ...(n.tags || [])]));
    if (idx >= 0) { notes[idx] = { ...notes[idx], lesson: n.lesson ? String(n.lesson).trim() : notes[idx].lesson, tags, fields: clean }; updated++; }
    else {
      const back = findRetired(pack, n.type, clean[first]);
      if (back) revived.add(back.guid);
      notes.push({ guid: back ? back.guid : newGuid(), type: n.type, lesson: String(n.lesson || '').trim(), tags, fields: clean }); added++;
    }
  }
  const next = { ...pack, version: bumpVersion(pack.version), updated: new Date().toISOString(), notes, retired: dropRetired(pack, revived) };
  validatePack(next);
  return { pack: next, added, updated };
}

// importer.js — cards from a text file: a spreadsheet export, a word list, an Anki text export.
// NO DOM, NO browser globals.
//
// The file rules are not invented here. They are Anki's text-import format as its manual
// states them (docs.ankiweb.net/importing/text-files.html, fetched 2026-09-06):
//   - "#separator:" file-header directive; values "Comma, Semicolon, Tab, Space, Pipe, Colon,
//     or the corresponding literal characters"; headers since "Anki 2.1.54+"
//   - other directives on the same page: #html, #tags, #columns, #notetype, #deck,
//     #notetype column, #deck column, #tags column, #guid column
//   - quoting: "Escape the characters by placing the contents of the field in quotation marks";
//     an embedded quote: "replace a single doublequote with two doublequotes to escape them"
//   - "The files must be in UTF-8 format"
//   - duplicates: when the first field matches an existing note, "the existing note's other
//     fields will be updated based on content of the imported file"
// and RFC 4180 §2 for quoting when there is no directive: "Fields containing line breaks
// (CRLF), double quotes, and commas should be enclosed in double-quotes"; "a double-quote
// appearing inside a field must be escaped by preceding it with another double quote".
//
// Two things are this module's own calls, labelled as such:
//   UNBACKED — my judgment: a leading byte-order mark is dropped (Anki's page says nothing
//     about a BOM either way; spreadsheets on Windows write one).
//   UNBACKED — my judgment: with no #separator directive the separator is detected by counting
//     candidates on the first lines (tab, comma, semicolon, pipe); a tie falls to tab. Anki's
//     page names no default in a quotable sentence.

const SEPARATORS = { comma: ',', semicolon: ';', tab: '\t', space: ' ', pipe: '|', colon: ':' };

/** Read the "#key:value" header lines Anki writes. Returns { directives, body } where body is
 *  the text after the header block. Lines beginning with # before the first data line are the
 *  header; a # line with no colon is a comment and is dropped. */
function readDirectives(text) {
  const lines = String(text).replace(/^﻿/, '').split(/\r\n|\n|\r/);
  const directives = {};
  let i = 0;
  for (; i < lines.length; i++) {
    const l = lines[i];
    if (l.trim() === '') continue;
    if (!l.startsWith('#')) break;
    const m = l.slice(1).match(/^([a-z][a-z ]*?):(.*)$/i);
    if (m) directives[m[1].trim().toLowerCase()] = m[2].trim();
  }
  return { directives, body: lines.slice(i).join('\n') };
}

/** The separator a directive names, or null. Accepts the words Anki lists and literal chars. */
function separatorFromDirective(v) {
  if (v == null) return null;
  const s = String(v).trim();
  if (SEPARATORS[s.toLowerCase()]) return SEPARATORS[s.toLowerCase()];
  if (s.length === 1) return s;
  if (s === '\\t') return '\t';
  return null;
}

/** Detect a separator from the first lines (UNBACKED — my judgment, see the header). */
function detectSeparator(body) {
  const lines = body.split('\n').filter((l) => l.trim() !== '').slice(0, 20);
  if (!lines.length) return '\t';
  let best = '\t', bestScore = -1;
  for (const c of ['\t', ',', ';', '|']) {
    const counts = lines.map((l) => countOutsideQuotes(l, c));
    const present = counts.filter((n) => n > 0).length;
    if (!present) continue;
    // Prefer the candidate found on the most lines; break ties by consistency of the count.
    const consistent = counts.every((n) => n === counts[0]) ? 1 : 0;
    const score = present * 10 + consistent;
    if (score > bestScore) { best = c; bestScore = score; }
  }
  return best;
}
function countOutsideQuotes(line, ch) {
  let n = 0, q = false;
  for (const x of line) { if (x === '"') q = !q; else if (!q && x === ch) n++; }
  return n;
}

/** Split delimited text into rows of fields, RFC 4180 quoting. Rows are arrays of strings;
 *  blank lines are skipped. A quoted field may span lines. */
function splitRows(body, sep) {
  const rows = [];
  let row = [], field = '', q = false, i = 0;
  const s = body;
  while (i < s.length) {
    const c = s[i];
    if (q) {
      if (c === '"') {
        if (s[i + 1] === '"') { field += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"' && field === '') { q = true; i++; continue; }
    if (c === sep) { row.push(field); field = ''; i++; continue; }
    if (c === '\n') {
      row.push(field); field = '';
      if (row.some((f) => f.trim() !== '')) rows.push(row);
      row = []; i++; continue;
    }
    field += c; i++;
  }
  row.push(field);
  if (row.some((f) => f.trim() !== '')) rows.push(row);
  return rows;
}

/** Text a field carries when the file declared #html:true: line breaks kept, tags dropped.
 *  The app renders text, never HTML, so this is the honest projection. */
function htmlToText(s) {
  return String(s).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li)>/gi, '\n').replace(/<[^>]+>/g, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').trim();
}

/**
 * Parse a file. Returns { rows, separator, directives, columns, tagsForAll, tagsColumn }.
 *   rows        string[][] — data rows, quoting resolved, HTML projected to text if declared
 *   columns     string[] | null — names from #columns: if present
 *   tagsForAll  string[] — from #tags:
 *   tagsColumn  number | null — 0-based, from #tags column: (Anki counts from 1)
 */
function parseDelimited(text, opts = {}) {
  const { directives, body } = readDirectives(text);
  const separator = opts.separator || separatorFromDirective(directives.separator) || detectSeparator(body);
  const html = /^true$/i.test(directives.html || '');
  let rows = splitRows(body, separator).map((r) => r.map((f) => (html ? htmlToText(f) : f.trim())));
  const columns = directives.columns ? splitRows(directives.columns, separator)[0].map((c) => c.trim()) : null;
  const tagsForAll = (directives.tags || '').split(/\s+/).filter(Boolean);
  const tagsColumn = directives['tags column'] ? parseInt(directives['tags column'], 10) - 1 : null;
  if (opts.headerRow && rows.length) rows = rows.slice(1);
  return { rows, separator, directives, columns, tagsForAll, tagsColumn };
}

/** A default mapping of columns onto a card type's fields: by #columns names when they match
 *  the type's field names (case-insensitive), else positional in the type's field order. */
function defaultMapping(nCols, typeFields, columns) {
  const map = [];
  const used = new Set();
  for (let i = 0; i < nCols; i++) {
    let f = null;
    if (columns && columns[i]) {
      const hit = typeFields.find((x) => x.toLowerCase() === columns[i].toLowerCase());
      if (hit && !used.has(hit)) f = hit;
    }
    map.push(f);
  }
  map.forEach((f) => { if (f) used.add(f); });
  const free = typeFields.filter((f) => !used.has(f));
  for (let i = 0; i < map.length; i++) if (!map[i] && free.length) map[i] = free.shift();
  return map;   // entries: a field name or null (skip)
}

/**
 * Rows into notes for the editor. mapping[i] names the field column i fills (null = skip).
 * Returns { notes: [{type, lesson, fields, tags}], skipped: [{row, reason}] } — a row that
 * cannot make a card is reported by its 1-based row number, never silently dropped.
 */
function rowsToNotes(rows, { type, mapping, lesson, tagsForAll = [], tagsColumn = null, problem }) {
  const notes = [], skipped = [];
  rows.forEach((r, idx) => {
    const fields = {};
    mapping.forEach((f, i) => { if (f) fields[f] = (r[i] || '').trim(); });
    const tags = tagsForAll.slice();
    if (tagsColumn != null && r[tagsColumn]) tags.push(...r[tagsColumn].split(/\s+/).filter(Boolean));
    const why = problem ? problem(type, fields) : null;
    if (why) { skipped.push({ row: idx + 1, reason: why }); return; }
    notes.push({ type, lesson: lesson || '', fields, tags });
  });
  return { notes, skipped };
}
