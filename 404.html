<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Study Kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500&family=Spline+Sans+Mono:wght@400&display=swap">
<style>
:root{color-scheme:light; --ground:#F4F2EC; --ink:#23212A; --ink2:#56525E;
  --muted:#857F8C; --line:#E3DFD5; --mosstext:#1C5B48;}
*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.6; margin:0; padding:60px 18px;
  display:flex; align-items:center; justify-content:center; min-height:100vh}
main{max-width:460px}
.eyebrow{font-family:"Spline Sans Mono",ui-monospace,monospace; font-size:11px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
h1{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif; font-weight:700;
  font-size:30px; line-height:1.15; margin:6px 0 0; letter-spacing:-.015em}
p{color:var(--ink2); margin:14px 0 0}
a{color:var(--mosstext); text-decoration-thickness:1px; text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--mosstext); outline-offset:3px; border-radius:2px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">404</div>
  <h1>That page isn't here</h1>
  <p>The address may have changed, or it may never have existed. Nothing on this site moves once it is published, so an old link you saved should still work.</p>
  <p><a href="/studykit/">Go to the Study Kit front door</a></p>
</main>
</body>
</html>
